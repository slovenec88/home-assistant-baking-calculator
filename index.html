r(--panel); color: var(--mid); font-size: 0.875rem; font-weight: 500; box-shadow: 0 2px 0 var(--line); }\n  #tabs button[aria-selected=\"true\"] { background: var(--accent); color: var(--on-accent); box-shadow: none; transform: translateY(2px); }\n  #bar { display: flex; height: 6px; gap: 2px; margin: 2px 2px; }\n  #bar span { font-size: 0; min-width: 3px; transition: flex-grow 150ms ease-out; }\n  #bar span[data-id=\"flour\"] { background: var(--ink); } #bar span[data-id=\"water\"] { background: var(--accent); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: var(--mid); } #bar span[data-id=\"salt\"] { background: var(--line); }\n  #inputs { display: grid; gap: 8px; }\n  .in { --ink: var(--glass-ink); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 8px; padding: 10px 14px 0; background: var(--glass); color: var(--glass-ink); border-radius: 14px; overflow: hidden; }\n  .in .lab { align-self: start; font-size: 0.8125rem; color: var(--glass-mid); letter-spacing: 0.04em; }\n  .in .pre { display: flex; gap: 6px; margin-top: 6px; }\n  .in .pre button { height: 30px; padding: 0 12px; border: 1px solid var(--glass-mid); border-radius: 999px; background: none; font-size: 0.8125rem; color: var(--glass-mid); }\n  .in .pre button[aria-pressed=\"true\"] { background: var(--glass-ink); color: var(--glass); border-color: var(--glass-ink); }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 52px; font-weight: 200; font-size: 56px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; color: var(--glass-ink); }\n  .num small { font-size: 1.0625rem; letter-spacing: 0; color: var(--glass-mid); font-weight: 400; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; color: var(--glass-ink); border: 0; border-bottom: 2px solid var(--accent); text-align: right; padding: 0 2px; }\n  .ruler { grid-column: 1 / -1; height: 18px; margin: 4px -14px 0; position: relative; opacity: 0.7; -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: -2px; width: 3px; height: 22px; margin-left: -1.5px; background: var(--accent); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel); }\n  #choices button { height: 38px; border: 0; border-radius: 9px; background: none; font-size: 0.8125rem; color: var(--mid); }\n  #choices button[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  #out .cell { padding: 8px 14px; background: var(--panel); border-radius: 14px; }\n  #out .cell small { display: block; font-size: 0.8125rem; color: var(--mid); }\n  #out .cell b { display: block; margin-top: 2px; font-weight: 300; font-size: 30px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }\n  #out .total { grid-column: 1 / -1; padding: 12px 16px; background-color: var(--panel); background-image: radial-gradient(var(--line) 1.7px, transparent 2.1px); background-size: 10px 10px; }\n  #out .total b { font-size: 52px; font-weight: 400; } #out .total small { color: var(--ink); font-weight: 500; }\n  #plan { margin: 0; padding: 0 4px; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; }\n  #drawer { border-top: 0; background: var(--panel); box-shadow: 0 -2px 0 var(--line); border-radius: 18px 18px 0 0; }\n  #dname, #dgo, #dlist li, #dlist button, #dnote { border-radius: 10px; }\n\n  #tabs { grid-template-columns: repeat(2, 1fr); }\n  #choices .grp:only-child { grid-column: 1 / -1; }\n  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }\n  .in .pre { margin-top: 0; }\n  .num { min-height: 44px; }\n  /* one-screen fit: Bread and Pizza share the phone height with the choice row and the recipe handle */\n  main { gap: 6px !important; padding-top: 8px !important; }\n  #tabs button { height: 40px !important; }\n  .num { min-height: 40px !important; font-size: 44px !important; }\n  .num small { font-size: 0.9375rem !important; }\n  .ruler { height: 12px !important; margin-top: 2px !important; }\n  .in { padding-top: 6px !important; }\n  #choices button { height: 36px !important; }\n  #out { gap: 6px !important; }\n  #out .cell { padding-top: 5px !important; padding-bottom: 5px !important; }\n  #out .cell b { font-size: 26px !important; }\n  #out .total { padding-top: 6px !important; padding-bottom: 6px !important; }\n  #out .total b { font-size: 44px !important; }\n  #out .cell[data-id=\"hyd\"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px !important; border: 0 !important; box-shadow: none !important; background: none !important; color: var(--mid) !important; }\n  #out .cell[data-id=\"hyd\"] small { color: var(--mid) !important; } #out .cell[data-id=\"hyd\"] b { font-size: 18px !important; margin: 0 !important; color: var(--ink) !important; font-family: inherit !important; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };\n  function drag(el, { key, axis = \"x\", pxPerStep = 10, onTap, onStart, onEnd, target }) {\n    let start = null;\n    el.style.touchAction = axis === \"x\" ? \"pan-y\" : \"pan-x\";\n    el.addEventListener(\"pointerdown\", e => {\n      if (e.button) return;\n      const k = typeof key === \"function\" ? key(e) : key;\n      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };\n      try { el.setPointerCapture(e.pointerId); } catch {}\n      onStart && onStart(k, e);\n    });\n    el.addEventListener(\"pointermove\", e => {\n      if (!start || e.pointerId !== start.id || !start.k) return;\n      const d = axis === \"x\" ? e.clientX - start.x : start.y - e.clientY;\n      if (!start.moved && Math.abs(d) < 5) return;\n      start.moved = true;\n      const steps = Math.round(d / pxPerStep(start.k));\n      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }\n    });\n    const end = e => {\n      if (!start || e.pointerId !== start.id) return;\n      const s = start; start = null;\n      if (!s.moved && e.type === \"pointerup\") onTap && onTap(s.k, e);\n      onEnd && onEnd(s.k, s.moved);\n    };\n    el.addEventListener(\"pointerup\", end);\n    el.addEventListener(\"pointercancel\", end);\n  }\n\n  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);\n  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */\n  function snapshot() {\n    const p = pizzaValues();\n    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },\n             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };\n  }\n  function restore(s) {\n    if (!s || ![\"sourdough\", \"instant\", \"pizza\"].includes(s.mode)) return false;\n    state.mode = s.mode;\n    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };\n    state.instant = { ...DEFAULTS.instant, ...s.instant };\n    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };\n    emit(); return true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };\n  // critically damped-ish spring on o[key]; velocity kept in o[key + \"V\"]\n  function spring(o, key, target, dt, k = 220, d = 22) {\n    const v = (o[key + \"V\"] || 0) + (target - o[key]) * k * dt;\n    o[key + \"V\"] = v * Math.max(0, 1 - d * dt);\n    o[key] += o[key + \"V\"] * dt;\n    return o[key];\n  }\n  function canvas(el, draw) {\n    const ctx = el.getContext(\"2d\");\n    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;\n    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }\n    new ResizeObserver(resize).observe(el); resize();\n    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }\n    raf = requestAnimationFrame(frame);\n    document.addEventListener(\"visibilitychange\", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });\n    return { ctx, size: () => ({ w, h }) };\n  }\n  function pointer(el, hd) {\n    el.style.touchAction = \"none\";\n    const ;clip:auto;white-space:normal;background:#fff;color:#000;border:2px solid #000;border-radius:12px;padding:10px;z-index:1000;display:grid;gap:8px;font:16px system-ui}.dough-sr label{display:grid;gap:2px}.dough-sr input,.dough-sr button{font:inherit;min-height:40px}\";\n  document.head.append(st);\n  const root = document.createElement(\"div\"); root.className = \"dough-sr\"; root.setAttribute(\"role\", \"group\"); root.setAttribute(\"aria-label\", \"Dough calculator controls\"); document.body.append(root);\n  const live = document.createElement(\"div\"); live.setAttribute(\"aria-live\", \"polite\");\n  let sig = \"\";\n  Dough.subscribe(m => {\n    const s = m.mode + m.fields.map(f => f.key).join() + m.choices.map(c => c.key).join();\n    if (s !== sig) {\n      sig = s; root.replaceChildren();\n      const modes = document.createElement(\"div\");\n      Dough.modes.forEach(([v, l]) => { const b = document.createElement(\"button\"); b.type = \"button\"; b.textContent = l; b.setAttribute(\"aria-pressed\", String(m.mode === v)); b.onclick = () => Dough.choose(\"mode\", v); modes.append(b); });\n      root.append(modes);\n      m.fields.forEach(f => { const lab = document.createElement(\"label\"); lab.textContent = `${f.label} (${f.unit || \"count\"})`; const i = document.createElement(\"input\"); i.type = \"number\"; i.min = f.min; i.max = f.max; i.step = f.step; i.dataset.key = f.key; i.addEventListener(\"change\", () => Dough.set(f.key, parseFloat(i.value))); lab.append(i); root.append(lab); });\n      m.choices.forEach(c => { const g = document.createElement(\"div\"); g.setAttribute(\"role\", \"group\"); g.setAttribute(\"aria-label\", c.label); c.options.forEach(([v, l]) => { const b = document.createElement(\"button\"); b.type = \"button\"; b.textContent = l; b.dataset.k = c.key; b.dataset.v = v; b.onclick = () => Dough.choose(c.key, v); g.append(b); }); root.append(g); });\n      root.append(live);\n    }\n    m.fields.forEach(f => { const i = root.querySelector(` ) => draw(Dough.recipes.list()), 1500);\n  });\n  function draw(list) {\n    $(\"#dl\").textContent = list.length ? `Recipes (${list.length})` : \"Recipes\";\n    $(\"#dnote\").hidden = Dough.recipes.persistent();\n    const ul = $(\"#dlist\"); ul.replaceChildren();\n    if (!list.length) { const li = document.createElement(\"li\"); li.className = \"empty\"; li.textContent = \"No saved recipes.\"; ul.append(li); return; }\n    list.forEach(r => {\n      const li = document.createElement(\"li\");\n      const t = document.createElement(\"div\"); const b = document.createElement(\"b\"); b.textContent = r.name; const s = document.createElement(\"span\"); s.textContent = Dough.recipes.summary(r.snap); t.append(b, s);\n      const load = document.createElement(\"button\"); load.type = \"button\"; load.className = \"load\"; load.textContent = \"Load\"; load.setAttribute(\"aria-label\", \"Load \" + r.name);\n      load.onclick = () => { Dough.recipes.load(r.id); setOpen(false); vib(10); };\n      const del = document.createElement(\"button\"); del.type = \"button\"; del.textContent = confirmId === r.id ? \"Sure?\" : \"Delete\"; del.setAttribute(\"aria-label\", \"Delete \" + r.name);\n      del.onclick = () => { if (confirmId === r.id) { confirmId = null; Dough.recipes.remove(r.id); } else { confirmId = r.id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; draw(Dough.recipes.list()); }, 2500); draw(Dough.recipes.list()); } };\n      li.append(t, load, del); ul.append(li);\n    });\n  }\n  Dough.recipes.subscribe(draw);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "rams-calc", "name": "Rams, calculator", "group": "Rams, five iterations (Bread and Pizza tabs, saved recipes)", "blurb": "An ET 66. Dark body, LCD bands, grey keys, one orange key for the total.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */\n  main { padding-bottom: 48px; }\n  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); }\n  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }\n  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }\n  #dl { font-size: 0.875rem; font-weight: 600; }\n  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }\n  #dbody[hidden] { display: none; }\n  #dsave { display: flex; gap: 8px; }\n  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }\n  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }\n  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }\n  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }\n  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }\n  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }\n  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }\n  #dnote[hidden] { display: none; }\n  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }\n\n  /* Rams, calculator: an ET 66. A dark body, LCD bands for the inputs, grey keys, one orange key. */\n  :root { color-scheme: dark; --bg: #262624; --panel: #30302d; --ink: #efede6; --mid: #9a968b; --line: #44443f; --key: #dcd9cf; --on-key: #1b1b1a; --lcd: #141413; --lcd-ink: #d9d7cc; --accent: #ff7a1a; --on-accent: #1b1b1a; }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.2 \"Helvetica Neue\", Helvetica, Arial, system-ui, sans-serif; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 48px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n  #tabs button { height: 44px; border: 0; border-radius: 999px; background: var(--key); color: var(--on-key); font-size: 0.875rem; font-weight: 500; box-shadow: 0 3px 0 #8f8c82; }\n  #tabs button[aria-selected=\"true\"] { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 0 #8f8c82; transform: translateY(2px); }\n  #bar { display: flex; height: 8px; gap: 2px; background: var(--lcd); padding: 1px; border-radius: 4px; }\n  #bar span { font-size: 0; min-width: 3px; transition: flex-grow 150ms ease-out; border-radius: 2px; }\n  #bar span[data-id=\"flour\"] { background: var(--lcd-ink); } #bar span[data-id=\"water\"] { background: var(--accent); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: var(--mid); } #bar span[data-id=\"salt\"] { background: var(--line); }\n  #inputs { display: grid; gap: 8px; }\n  .in { --ink: var(--lcd-ink); display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 8px; padding: 8px 14px 0; background: var(--lcd); color: var(--lcd-ink); border-radius: 8px; border: 3px solid #3a3a37; overflow: hidden; }\n  .in .lab { align-self: start; font-size: 0.75rem; color: #8f8c82; letter-spacing: 0.06em; text-transform: uppercase; }\n  .in .pre { display: flex; gap: 8px; margin-top: 6px; }\n  .in .pre button { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--key); color: var(--on-key); font-size: 0.8125rem; font-weight: 500; box-shadow: 0 2px 0 #8f8c82; }\n  .in .pre button[aria-pressed=\"true\"] { background: var(--accent); box-shadow: 0 1px 0 #8f8c82; transform: translateY(1px); }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 50px; font-weight: 400; font-size: 52px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; color: var(--lcd-ink); }\n  .num small { font-size: 1rem; letter-spacing: 0; color: #8f8c82; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; color: var(--lcd-ink); border: 0; border-bottom: 2px solid var(--accent); text-align: right; padding: 0 2px; }\n  .ruler { grid-column: 1 / -1; height: 14px; margin: 4px -14px 0; position: relative; opacity: 0.55; }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: 0; width: 3px; height: 14px; margin-left: -1.5px; background: var(--accent); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\n  #choices button { height: 40px; border: 0; border-radius: 999px; background: var(--key); color: var(--on-key); font-size: 0.8125rem; font-weight: 500; box-shadow: 0 2px 0 #8f8c82; }\n  #choices button[aria-pressed=\"true\"] { background: var(--accent); box-shadow: 0 1px 0 #8f8c82; transform: translateY(1px); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  #out .cell { padding: 8px 14px; background: var(--key); color: var(--on-key); border-radius: 14px; box-shadow: 0 3px 0 #8f8c82; }\n  #out .cell small { display: block; font-size: 0.75rem; color: #5b5950; letter-spacing: 0.04em; text-transform: uppercase; }\n  #out .cell b { display: block; margin-top: 2px; font-weight: 500; font-size: 28px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }\n  #out .total { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); padding: 10px 16px; }\n  #out .total small { color: var(--on-accent); opacity: 0.75; } #out .total b { font-size: 48px; }\n  #plan { margin: 0; padding: 0 4px; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; }\n  #drawer { border-top: 0; background: var(--panel); box-shadow: 0 -2px 0 #1b1b1a; border-radius: 18px 18px 0 0; }\n  #dname { background: var(--lcd); border-color: #3a3a37; border-radius: 8px; } #dgo { border-radius: 999px; }\n  #dlist li { border-radius: 10px; } #dlist button { border-radius: 999px; } #dnote { border-radius: 10px; }\n\n  #tabs { grid-template-columns: repeat(2, 1fr); }\n  #choices .grp:only-child { grid-column: 1 / -1; }\n  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }\n  .in .pre { margin-top: 0; }\n  .num { min-height: 44px; }\n  /* one-screen fit: Bread and Pizza share the phone height with the choice row and the recipe handle */\n  main { gap: 6px !important; padding-top: 8px !important; }\n  #tabs button { height: 40px !important; }\n  .num { min-height: 40px !important; font-size: 44px !important; }\n  .num small { font-size: 0.9375rem !important; }\n  .ruler { height: 12px !important; margin-top: 2px !important; }\n  .in { padding-top: 6px !important; }\n  #choices button { height: 36px !important; }\n  #out { gap: 6px !important; }\n  #out .cell { padding-top: 5px !important; padding-bottom: 5px !important; }\n  #out .cell b { font-size: 26px !important; }\n  #out .total { padding-top: 6px !important; padding-bottom: 6px !important; }\n  #out .total b { font-size: 44px !important; }\n  #out .cell[data-id=\"hyd\"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px !important; border: 0 !important; box-shadow: none !important; background: none !important; color: var(--mid) !important; }\n  #out .cell[data-id=\"hyd\"] small { color: var(--mid) !important; } #out .cell[data-id=\"hyd\"] b { font-size: 18px !important; margin: 0 !important; color: var(--ink) !important; font-family: inherit !important; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key one yellow hand. */\n  :root { color-scheme: light dark; --bg: #f6f4ef; --ink: #101010; --mid: #7b786f; --line: #d9d6cd; --accent: #f4c400; --on-accent: #101010; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --ink: #f2f0ea; --mid: #8f8c83; --line: #2e2e2c; --accent: #ffcf1a; --on-accent: #101010; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.2 \"Helvetica Neue\", Helvetica, Arial, system-ui, sans-serif; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }\n  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 14px 18px 48px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--ink); }\n  #tabs button { height: 40px; border: 0; background: none; color: var(--mid); font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); box-shadow: inset 0 -4px 0 var(--accent); }\n  #bar { display: flex; height: 4px; margin: 12px 0 4px; }\n  #bar span { font-size: 0; min-width: 3px; transition: flex-grow 150ms ease-out; }\n  #bar span[data-id=\"flour\"] { background: var(--ink); } #bar span[data-id=\"water\"] { background: var(--accent); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: var(--mid); } #bar span[data-id=\"salt\"] { background: var(--line); }\n  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 0 8px; padding: 10px 0 0; border-bottom: 1px solid var(--line); }\n  .in .lab { align-self: start; font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mid); font-weight: 600; }\n  .in .pre { display: flex; gap: 12px; margin-top: 8px; }\n  .in .pre button { padding: 2px 0; border: 0; background: none; color: var(--mid); font-size: 0.8125rem; border-bottom: 1px solid var(--line); }\n  .in .pre button[aria-pressed=\"true\"] { color: var(--ink); border-bottom: 3px solid var(--accent); font-weight: 600; }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 60px; font-weight: 500; font-size: 62px; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; }\n  .num small { font-size: 1.0625rem; letter-spacing: 0; color: var(--mid); font-weight: 500; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; border: 0; border-bottom: 3px solid var(--accent); text-align: right; padding: 0 2px; }\n  .ruler { grid-column: 1 / -1; height: 14px; margin: 4px 0 0; position: relative; opacity: 0.8; -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: -3px; width: 5px; height: 20px; margin-left: -2.5px; background: var(--accent); box-shadow: 0 0 0 1px var(--ink); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; }\n  #choices button { height: 36px; border: 0; background: none; font-size: 0.6875rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--mid); border-bottom: 1px solid var(--line); }\n  #choices button[aria-pressed=\"true\"] { color: var(--ink); border-bottom: 4px solid var(--accent); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; padding-top: 6px; }\n  #out .cell { padding: 6px 0; border-bottom: 1px solid var(--line); }\n  #out .cell small { display: block; font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); font-weight: 600; }\n  #out .cell b { display: block; margin-top: 2px; font-size: 30px; font-weight: 500; letter-spacing: -0.04em; }\n  #out .total { grid-column: 1 / -1; border-bottom: 0; padding-top: 10px; }\n  #out .total b { display: inline-block; font-size: 58px; line-height: 1.05; background: linear-gradient(transparent 76%, var(--accent) 76%); letter-spacing: -0.05em; }\n  #plan { margin: 6px 0 0; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; }\n  #drawer { border-top: 1px solid var(--ink); } #dh .grip { display: none; } #dl { font-size: 0.6875rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; }\n  #dname { border: 0; border-bottom: 1px solid var(--ink); border-radius: 0; } #dgo { border-radius: 0; color: var(--on-accent); }\n  #dlist li { border-width: 0 0 1px; border-radius: 0; } #dlist button { border-radius: 0; } #dnote { border-radius: 0; }\n\n  #tabs { grid-template-columns: repeat(2, 1fr); }\n  #choices .grp:only-child { grid-column: 1 / -1; }\n  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }\n  .in .pre { margin-top: 0; }\n  .num { min-height: 44px; }\n  /* one-screen fit: Bread and Pizza share the phone height with the choice row and the recipe handle */\n  main { gap: 6px !important; padding-top: 8px !important; }\n  #tabs button { height: 40px !important; }\n  .num { min-height: 40px !important; font-size: 44px !important; }\n  .num small { font-size: 0.9375rem !important; }\n  .ruler { height: 12px !important; margin-top: 2px !important; }\n  .in { padding-top: 6px !important; }\n  #choices button { height: 36px !important; }\n  #out { gap: 6px !important; }\n  #out .cell { padding-top: 5px !important; padding-bottom: 5px !important; }\n  #out .cell b { font-size: 26px !important; }\n  #out .total { padding-top: 6px !important; padding-bottom: 6px !important; }\n  #out .total b { font-size: 44px !important; }\n  #out .cell[data-id=\"hyd\"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px !important; border: 0 !important; box-shadow: none !important; background: none !important; color: var(--mid) !important; }\n  #out .cell[data-id=\"hyd\"] small { color: var(--mid) !important; } #out .cell[data-id=\"hyd\"] b { font-size: 18px !important; margin: 0 !important; color: var(--ink) !important; font-family: inherit !important; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };\n  function drag(el, { key, axis = \"x\", pxPerStep = 10, onTap, onStart, onEnd, target }) {\n    let start = null;\n    el.style.touchAction = axis === \"x\" ? \"pan-y\" : \"pan-x\";\n    el.addEventListener(\"pointerdown\", e => {\n      if (e.button) return;\n      const k = typeof key === \"function\" ? key(e) : key;\n      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };\n      try { el.setPointerCapture(e.pointerId); } catch {}\n      onStart && onStart(k, e);\n    });\n    el.addEventListener(\"pointermove\", e => {\n      if (!start || e.pointerId !== start.id || !start.k) return;\n      const d = axis === \"x\" ? e.clientX - start.x : start.y - e.clientY;\n      if (!start.moved && Math.abs(d) < 5) return;\n      start.moved = true;\n      const steps = Math.round(d / pxPerStep(start.k));\n      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }\n    });\n    const end = e => {\n      if (!start || e.pointerId !== start.id) return;\n      const s = start; start = null;\n      if (!s.moved && e.type === \"pointerup\") onTap && onTap(s.k, e);\n      onEnd && onEnd(s.k, s.moved);\n    };\n    el.addEventListener(\"pointerup\", end);\n    el.addEventListener(\"pointercancel\", end);\n  }\n\n  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);\n  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */\n  function snapshot() {\n    const p = pizzaValues();\n    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },\n             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };\n  }\n  function restore(s) {\n    if (!s || ![\"sourdough\", \"instant\", \"pizza\"].includes(s.mode)) return false;\n    state.mode = s.mode;\n    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };\n    state.instant = { ...DEFAULTS.instant, ...s.instant };\n    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };\n    emit(); return true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };\n  // critically damped-ish spring on o[key]; velocity kept in o[key + \"V\"]\n  function spring(o, key, target, dt, k = 220, d = 22) {\n    const v = (o[key + \"V\"] || 0) + (
