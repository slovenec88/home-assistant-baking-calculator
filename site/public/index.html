<style>
  * { -webkit-tap-highlight-color: transparent; }
  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */
  main { padding-bottom: 48px; }
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); transform: translateY(var(--ty, calc(100% - var(--hh, 60px)))); transition: transform 240ms cubic-bezier(0.2, 0.9, 0.25, 1); will-change: transform; }
  #drawer.open { --ty: 0px; } #drawer.dragging { transition: none; }
  #drawer:not(.open):not(.dragging) #dbody { visibility: hidden; transition: visibility 0s 240ms; }
  @media (prefers-reduced-motion: reduce) { #drawer { transition-duration: 1ms; } }
  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }
  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }
  #dl { font-size: 0.875rem; font-weight: 600; }
  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }
  #dsave { display: flex; gap: 8px; }
  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }
  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }
  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }
  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }
  #plan button.timer { all: unset; box-sizing: border-box; color: var(--mid); font-size: 0.75rem; min-height: 1em; white-space: nowrap; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; touch-action: none; }
  #plan li.cold button.timer { color: var(--crust); font-weight: 600; }
  #plan button.timer.run { color: var(--ink); font-weight: 700; text-decoration: none; font-size: 0.6875rem; }
  #plan button.timer.fin { color: var(--crust); font-weight: 700; text-decoration: none; }
  #plan button.timer:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #tpop, #tdone { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); width: min(340px, calc(100% - 24px)); box-sizing: border-box; padding: 14px; border-radius: 16px; background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.2); }
  #tpop { bottom: 76px; display: grid; gap: 12px; }
  #tdone { top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 700; }
  #tpop[hidden], #tdone[hidden] { display: none; }
  #tpop .trow { display: grid; gap: 8px; }
  #tpop .tl { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  #tpop .tl b { font-weight: 600; }
  #tpop .left { font-size: 1.5rem; font-weight: 700; }
  #tpop .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  #tpop button, #tdone button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: none; color: inherit; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; touch-action: none; }
  #tpop button.go, #tdone button { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }
  #tpop .tnote { margin: 0; font-size: 0.75rem; line-height: 1.35; color: var(--mid); }
  #dlist span.when { font-size: 0.75rem; opacity: 0.8; }
  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }
  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }
  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }
  #dnote[hidden] { display: none; }
  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }

  :root { color-scheme: light dark; --bg: #e6e3db; --panel: #f3f1eb; --ink: #1d1d1b; --mid: #86827a; --line: #cdc9be; --accent: #e4531c; --on-accent: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141412; --panel: #1f1f1c; --ink: #eceae3; --mid: #8d897f; --line: #2d2d29; --accent: #ff6a2b; --on-accent: #141412; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.2 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 48px; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #tabs button { height: 44px; border: 0; border-radius: 12px; background: var(--panel); color: var(--mid); font-size: 0.875rem; font-weight: 500; }
  #tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
  #tabs button[aria-selected="true"]::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
  #bar { display: flex; height: 8px; gap: 3px; margin: 2px 4px; }
  #bar span { font-size: 0; padding: 0; border-radius: 4px; min-width: 4px; transition: flex-grow 150ms ease-out; }
  #bar span[data-id="flour"] { background: var(--ink); } #bar span[data-id="water"] { background: var(--accent); }
  #bar span[data-id="starter"], #bar span[data-id="yeast"] { background: var(--mid); } #bar span[data-id="salt"] { background: var(--line); }
  #inputs { display: grid; gap: 6px; }
  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 8px; padding: 10px 14px 0; background: var(--panel); border-radius: 16px; overflow: hidden; }
  .in .lab { align-self: start; font-size: 0.875rem; color: var(--mid); font-weight: 500; }
  .in .pre { display: flex; gap: 6px; margin-top: 6px; }
  .in .pre button { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 0.8125rem; color: var(--mid); }
  .in .pre button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 52px; font-weight: 300; font-size: 54px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  .num small { font-size: 1.0625rem; letter-spacing: 0; color: var(--mid); font-weight: 400; }
  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; border: 0; border-bottom: 2px solid var(--accent); text-align: right; padding: 0 2px; }
  .ruler { grid-column: 1 / -1; height: 14px; margin: 2px -14px 0; position: relative; opacity: 0.5; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
  .ruler::after { content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } #choices[hidden] { display: none; }
  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel); }
  #choices button { height: 38px; border: 0; border-radius: 9px; background: none; font-size: 0.8125rem; color: var(--mid); }
  #choices button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #out .cell { padding: 8px 14px; background: var(--panel); border-radius: 14px; }
  #out .cell small { display: block; font-size: 0.8125rem; color: var(--mid); }
  #out .cell b { display: block; margin-top: 2px; font-weight: 300; font-size: 30px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  #out .total { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); padding: 10px 16px; }
  #out .total small { color: var(--on-accent); opacity: 0.8; } #out .total b { font-size: 52px; }
  #plan { margin: 0; padding: 0 4px; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; }
  #drawer { border-top: 0; background: var(--panel); box-shadow: 0 -1px 0 var(--line); border-radius: 20px 20px 0 0; }
  #dname, #dgo, #dlist li, #dlist button { border-radius: 12px; }

  #tabs { grid-template-columns: repeat(2, 1fr); }
  #choices { grid-template-columns: 1fr !important; gap: 6px !important; }
  #choices .grp { grid-column: 1 / -1; }
  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }
  .in .pre { margin-top: 0; }
  .num { min-height: 44px; }
  /* one-screen fit: Bread and Pizza share the phone height with the choice row and the recipe handle */
  main { gap: 6px !important; padding-top: 8px !important; }
  #tabs button { height: 40px !important; }
  .num { min-height: 40px !important; font-size: 44px !important; }
  .num small { font-size: 0.9375rem !important; }
  .ruler { height: 12px !important; margin-top: 2px !important; }
  .in { padding-top: 6px !important; }
  #choices button { height: 44px !important; font-weight: 600 !important; font-size: 0.9375rem !important; }
  #out { gap: 6px !important; }
  #out .cell { padding-top: 5px !important; padding-bottom: 5px !important; }
  #out .cell b { font-size: 26px !important; }
  #out .total { padding-top: 6px !important; padding-bottom: 6px !important; }
  #out .total b { font-size: 44px !important; }
  #out .cell[data-id="hyd"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px !important; border: 0 !important; box-shadow: none !important; background: none !important; color: var(--mid) !important; }
  #out .cell[data-id="hyd"] small { color: var(--mid) !important; } #out .cell[data-id="hyd"] b { font-size: 18px !important; margin: 0 !important; color: var(--ink) !important; font-family: inherit !important; }
  /* pizza has two choice rows (leavening, then proofing), so its inputs and outputs are a little tighter */
  body[data-mode="pizza"] .num { min-height: 34px !important; font-size: 40px !important; }
  body[data-mode="pizza"] .ruler { height: 8px !important; }
  body[data-mode="pizza"] .in { padding-top: 4px !important; }
  body[data-mode="pizza"] #out .cell { padding-top: 3px !important; padding-bottom: 3px !important; }
  body[data-mode="pizza"] #out .cell b { font-size: 22px !important; }
  body[data-mode="pizza"] #out .total b { font-size: 36px !important; }
  body[data-mode="pizza"] #choices button { height: 40px !important; }
  body[data-mode="pizza"] #plan { font-size: 0.75rem !important; }

  main { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px) !important; }
  #toprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: stretch; }
  #sb { width: 44px; border: 0; border-radius: 10px; background: var(--panel); color: var(--ink); display: grid; place-items: center; padding: 0; touch-action: manipulation; }
  #sb[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
  main { position: relative; }
  #settings { position: absolute; right: 12px; top: 58px; z-index: 50; width: min(300px, calc(100% - 24px)); display: grid; gap: 14px; padding: 14px; border-radius: 16px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0, 0, 0, 0.2); }
  #settings[hidden] { display: none; }
  #settings .lab { font-size: 0.8125rem; color: var(--mid); font-weight: 500; margin-bottom: 6px; }
  .seg { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: var(--bg); }
  .seg button { height: 40px; border: 0; border-radius: 9px; background: none; color: var(--mid); font-size: 0.875rem; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  #settings .ver { margin: 0; font-size: 0.75rem; color: var(--mid); font-variant-numeric: tabular-nums; }
  /* recipes: a bottom drawer again, with the handle lifted clear of the system back gesture */
  #dh { height: auto !important; flex-direction: column; justify-content: flex-start !important; gap: 6px !important; padding: 10px 0 calc(env(safe-area-inset-bottom, 0px) + 22px) !important; }
  #dh .grip { width: 40px !important; height: 5px !important; border-radius: 3px !important; }
  body.sheet-open #drawer { box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.16) !important; }
  #drawer { border-top: 0 !important; }
  main { padding-bottom: 62px !important; }
  :root[data-theme="light"] { color-scheme: light; --bg: #e6e3db; --panel: #f3f1eb; --ink: #1d1d1b; --mid: #86827a; --line: #cdc9be; --dough: #ffe082; --on-dough: #3e2723; --crust: #6d4c41; --accent: #ffb300; --on-accent: #3e2723; }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #141412; --panel: #1f1f1c; --ink: #eceae3; --mid: #8d897f; --line: #2d2d29; --dough: #ffd54f; --on-dough: #3e2723; --crust: #ffd54f; --accent: #ffd54f; --on-accent: #3e2723; }
  :root:not([data-theme]) { --dough: #ffe082; --on-dough: #3e2723; --crust: #6d4c41; --accent: #ffb300; --on-accent: #3e2723; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --dough: #ffd54f; --on-dough: #3e2723; --crust: #ffd54f; --accent: #ffd54f; --on-accent: #3e2723; } }
  :focus-visible { outline-color: var(--ink) !important; }
  #dbody { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px) !important; padding-top: 2px !important; }
  .in > div:first-child { display: block !important; }
  .in .lab { margin-bottom: 4px; }
  .in .pre { gap: 8px !important; }
  .pre button { height: 38px !important; min-width: 64px; padding: 0 16px !important; font-size: 0.9375rem !important; }
  .ruler { height: 24px !important; margin-top: 2px !important; cursor: ew-resize; opacity: 0.7 !important; }
  .ruler::after { height: 24px !important; }
  #out { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
  #out .cell { grid-column: span 2; padding: 6px 12px !important; }
  #out[data-small="2"] .cell { grid-column: span 3; }
  #out .cell b { font-size: 24px !important; }
  #out .cell.hero { grid-column: span 3; background: var(--dough); color: var(--on-dough); padding: 8px 16px !important; }
  #out[data-hero="1"] .cell.hero:not(.sm) { grid-column: 1 / -1; }
  #out .cell.hero.sm { grid-column: span 2; padding: 6px 12px !important; }
  #out[data-small="2"] .cell.hero.sm { grid-column: span 3; }
  #out .cell.hero.sm b { font-size: 24px !important; }
  #out .cell.hero small { color: var(--on-dough); opacity: 0.75; }
  #out .cell.hero b { font-size: 52px !important; }
  #out .total { background: var(--panel) !important; color: var(--ink) !important; padding: 6px 12px !important; }
  #out .total small { color: var(--mid) !important; opacity: 1 !important; } #out .total b { font-size: 24px !important; }
  #plan { display: flex; list-style: none; margin: 0 !important; padding: 0 !important; background: var(--panel); border-radius: 14px; overflow: hidden; font-size: 0.8125rem !important; }
  #plan li { flex: 1 1 0; min-width: 0; padding: 8px 6px 9px 10px; border-left: 1px solid var(--line); display: grid; gap: 1px; align-content: start; }
  #plan li:first-child { border-left: 0; }
  #plan small { font-size: 0.6875rem; color: var(--mid); font-variant-numeric: tabular-nums; }
  #plan b { font-weight: 600; color: var(--ink); font-size: 0.8125rem; }
  #plan span { color: var(--mid); font-size: 0.75rem; min-height: 1em; }
  #plan li.cold span { color: var(--crust); font-weight: 600; }
  #plan li { padding: 8px 4px 9px 8px !important; }
  #plan[data-n="6"] b { font-size: 0.6875rem; letter-spacing: -0.01em; }
  /* a slightly slanted swipe on a wheel must never pull the page down or refresh it */
  html, body { overscroll-behavior: none; }
  .in, .in .num, .in .ruler, #dh { touch-action: none !important; }
  .in:not(.live) .ruler { transition: background-position 220ms cubic-bezier(0.2, 0.9, 0.25, 1); }
  @media (prefers-reduced-motion: reduce) { .in:not(.live) .ruler { transition: none; } }
  /* one typeface for the whole app: Atkinson Hyperlegible Next (OFL), served from /fonts */
  @font-face { font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/fonts/atkinson-hyperlegible-next-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/fonts/atkinson-hyperlegible-next-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  body, button, input, .dough-sr, .dough-sr * { font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif !important; }
  body *, .num, #out .cell b, #plan small { font-variant-numeric: normal !important; }   /* this face has very wide tabular figures; its normal ones fit the cards */
  /* pizza: water, leavening and flour are the three big cards; salt and total stack beside the flour */
  #out .cell.hero:not(.sm) b { white-space: nowrap; }
  #out[data-hero="3"] .cell[data-id="flour"] { grid-row: span 2; align-content: center; }
  #out[data-hero="3"] .cell.hero.sm, #out[data-hero="3"] .cell.total { grid-column: 4 / span 3; }
  #inputs.fresh .ruler { transition: none !important; }   /* wheels that are built fresh appear in place, they do not slide in */
  #tabs button, .pre button, #choices button, #sb, .seg button, #dlist button, #dgo { touch-action: none; }   /* a slightly sliding tap must not turn into a page scroll that cancels it */
  .dough-sr:not(:focus-within) { top: 0; left: 0; }   /* the hidden screen-reader controls sat 1px below the page and made it scroll */
  #tabs button[aria-selected="true"]::before { display: none; }   /* no dot: the filled tab already says which one is active */
  #tabs button { text-align: center; }
  .hint { margin-left: 10px; font-size: 0.75rem; font-weight: 400; color: var(--mid); opacity: 0; transition: opacity 500ms ease; }
  .hint.on { opacity: 0.85; }
  #settings { max-height: calc(100dvh - 76px); overflow: auto; }
  .installbtn { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 0.9375rem; font-weight: 600; }
  #settings .note { margin: 8px 2px 0; font-size: 0.8125rem; line-height: 1.35; color: var(--mid); }
  #settings .note[hidden] { display: none; }
  .num { cursor: default; }

</style>

<body>
<main>

    <button id="sb" type="button" aria-expanded="false" aria-controls="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

  <button id="dh" type="button" aria-expanded="false" aria-controls="dbody"><span class="grip" aria-hidden="true"></span><span id="dl">Recipes</span></button>

<script>
/* Shared core: the original calculator maths and saved state, behind a small API.
   Every concept below only draws a different interface on top of this. */
const Dough = (() => {
  const STORAGE_KEY = "dough-ratio-assistant:v1";
  const DEFAULTS = {
    mode: "sourdough",
    sourdough: { flour: 500, hydration: 70, starterPct: 5 },
    instant: { flour: 500, hydration: 70 },
    pizza: { balls: 8, hydration: 64, yeastType: "instant", proof: "nextDay", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }
  };
  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };
  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };

  /* ---- original calculations, unchanged ---- */
  function calculateSourdough({ flour, hydration, starterPct }) {
    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;
    const totalFlour = flour + starterFlour;
    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);
    const salt = totalFlour * 0.02;
    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculateInstant({ flour, hydration }) {
    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;
    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };
  }
  function calculatePizzaInstant({ balls, hydration, yeastPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;
    const flour = target / (1 + h + s + y);
    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };
  }
  function calculatePizzaSourdough({ balls, hydration, starterPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;
    const totalFlour = target / (1 + h + s);
    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;
    const water = Math.max(0, totalFlour * h - starterWater);
    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculatePizza(p) {
    return p.yeastType === "sourdough"
      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })
      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });
  }
  function bakeManualText(mode, p) {
    if (mode === "pizza") {
      if (p.yeastType === "instant" && p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      if (p.yeastType === "instant") return "Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.";
      if (p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      return "Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.";
    }
    if (mode === "sourdough") return "Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.";
    return "Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.";
  }

  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const sp = saved && saved.pizza;
      return {
        ...DEFAULTS, ...saved,
        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },
        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },
        pizza: {
          ...DEFAULTS.pizza,
          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,
          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,
          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,
          hydration: DEFAULTS.pizza.hydration,
          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }
        }
      };
    } catch { return structuredClone(DEFAULTS); }
  }
  let state = loadState();
  if (!["sourdough", "instant", "pizza"].includes(state.mode)) state.mode = "sourdough";
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));
    } catch {}
  }

  /* ---- field specs: what the UI may edit, with limits and presets ---- */
  const SPEC = {
    flour:          { label: "Flour",        unit: "g", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },
    hydration:      { label: "Hydration",    unit: "%", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },
    starterPct:     { label: "Starter",      unit: "%", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },
    balls:          { label: "Dough balls",  unit: "",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },
    pizzaHydration: { label: "Hydration",    unit: "%", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },
    yeastPct:       { label: "Yeast",        unit: "%", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }
  };
  const CHOICES = {
    yeastType: { label: "Leavening", options: [["instant", "Instant yeast"], ["sourdough", "Sourdough"]] },
    proof:     { label: "Proofing",  options: [["sameDay", "Same day"], ["nextDay", "Next day"]] }
  };
  const MODES = [["sourdough", "Sourdough"], ["instant", "Instant yeast"], ["pizza", "Pizza"]];
  const MODE_TITLE = { sourdough: "Sourdough bread", instant: "Instant yeast bread", pizza: "Neapolitan pizza" };

  function breadValues() {
    const cur = state[state.mode];
    return {
      flour: clampNumber(cur.flour, 1, 10000, 500),
      hydration: clampNumber(cur.hydration, 40, 100, 70),
      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)
    };
  }
  function pizzaValues() {
    const p = state.pizza;
    return {
      balls: clampNumber(p.balls, 1, 48, 8),
      hydration: clampNumber(p.hydration, 50, 80, 64),
      yeastType: p.yeastType === "sourdough" ? "sourdough" : "instant",
      proof: p.proof === "sameDay" ? "sameDay" : "nextDay",
      instantYeastPct: {
        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),
        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)
      }
    };
  }

  function fieldKeys() {
    if (state.mode === "pizza") return ["balls", "pizzaHydration"].concat(pizzaValues().yeastType === "instant" ? ["yeastPct"] : []);
    return state.mode === "sourdough" ? ["flour", "hydration", "starterPct"] : ["flour", "hydration"];
  }
  function valueOf(key) {
    if (state.mode === "pizza") {
      const p = pizzaValues();
      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];
    }
    return breadValues()[key];
  }

  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */
  function timeline(mode, p) {
    const T = (label, hours, text, fridge, fold) => ({ label, hours: hours || null, text: text || (hours ? hours + " h" : ""), fridge: !!fridge, fold: !!fold });
    if (mode === "sourdough") return [T("Mix"), T("Rest", 4, "", false, true), T("Basket"), T("Bake")];
    if (mode === "instant") return [T("Mix"), T("Rest", 1.5, "1-2 h"), T("Basket"), T("Bake")];
    const sd = p.yeastType === "sourdough", next = p.proof === "nextDay";
    if (!next) return [T("Mix"), T("Rest", 4, "", false, sd), T("Divide"), T("Double"), T("Bake")];
    if (!sd) return [T("Mix"), T("Chill", 24, "24 h", true), T("Rest", 2), T("Divide"), T("Double"), T("Bake")];
    return [T("Mix"), T("Rest", 2, "", false, true), T("Divide"), T("Chill", 24, "24 h", true), T("Double"), T("Bake")];
  }

  function model() {
    const mode = state.mode, pizza = mode === "pizza";
    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();
    const r = pizza ? calculatePizza(p) : mode === "sourdough" ? calculateSourdough(v) : calculateInstant(v);
    const hasStarter = pizza ? p.yeastType === "sourdough" : mode === "sourdough";
    const hasYeast = pizza ? p.yeastType === "instant" : mode === "instant";
    const parts = [{ id: "flour", label: "Flour", g: pizza ? r.flour : v.flour }, { id: "water", label: "Water", g: r.water }];
    if (hasStarter) parts.push({ id: "starter", label: "Starter", g: r.starter });
    if (hasYeast) parts.push({ id: "yeast", label: "Yeast", g: r.yeast });
    parts.push({ id: "salt", label: "Salt", g: r.salt });
    return {
      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,
      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),
      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],
      plan: bakeManualText(mode, p),
      timeline: timeline(mode, p),
      pieces: pizza ? p.balls : null
    };
  }

  const subs = new Set();
  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };

  function set(key, raw) {
    const sp = SPEC[key];
    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));
    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;
    if (key === "balls") state.pizza.balls = val;
    else if (key === "pizzaHydration") state.pizza.hydration = val;
    else if (key === "yeastPct") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }
    else if (key === "starterPct") state.sourdough.starterPct = val;
    else state[state.mode][key] = val;
    emit();
  }
  function choose(key, val) {
    if (key === "mode") state.mode = val;
    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; const changed = state.pizza[key] !== val; state.pizza[key] = val;
      // going from next day to same day (or back) starts the yeast amount again from that proof's saved preset
      if (key === "proof" && changed) state.pizza.instantYeastPct[val] = DEFAULTS.pizza.instantYeastPct[val];
    }
    emit();
  }

  /* ---- formatting ---- */
  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + " g";
  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));
  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === "g" ? " g" : f.unit) : "");

  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */
  const haptic = (key, val) => { if (window.__tick) return window.__tick(key, val); try { navigator.vibrate && navigator.vibrate(6); } catch {} };
  function drag(el, { key, axis = "x", pxPerStep = 10, onTap, onStart, onEnd, onMove, target, ignore }) {
    let start = null;
    el.style.touchAction = axis === "x" ? "pan-y" : "pan-x";
    el.addEventListener("pointerdown", e => {
      if (e.button || (ignore && ignore(e))) return;
      const k = typeof key === "function" ? key(e) : key;
      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };
      try { el.setPointerCapture(e.pointerId); } catch {}
      onStart && onStart(k, e);
    });
    el.addEventListener("pointermove", e => {
      if (!start || e.pointerId !== start.id || !start.k) return;
      const d = axis === "x" ? e.clientX - start.x : start.y - e.clientY;
      if (!start.moved && Math.abs(d) < 8) return;
      start.moved = true;
      const raw = d / pxPerStep(start.k), steps = Math.round(raw);
      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(start.k, valueOf(start.k)); }
      onMove && onMove(raw - steps, start.k);   // the part of a step between two values, so a wheel can follow the finger smoothly
    });
    const end = e => {
      if (!start || e.pointerId !== start.id) return;
      const s = start; start = null;
      if (!s.moved && e.type === "pointerup") onTap && onTap(s.k, e);
      onEnd && onEnd(s.k, s.moved);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);
  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */
  function snapshot() {
    const p = pizzaValues();
    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },
             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };
  }
  function restore(s) {
    if (!s || !["sourdough", "instant", "pizza"].includes(s.mode)) return false;
    state.mode = s.mode;
    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };
    state.instant = { ...DEFAULTS.instant, ...s.instant };
    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };
    emit(); return true;
  }

  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },
           api: { calculateSourdough, calculateInstant, calculatePizza } };
})();
window.DoughRatioAssistant = Dough.api;

/* ---- Game helpers for the canvas concepts ---- */
const Game = (() => {
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };
  // critically damped-ish spring on o[key]; velocity kept in o[key + "V"]
  function spring(o, key, target, dt, k = 220, d = 22) {
    const v = (o[key + "V"] || 0) + (target - o[key]) * k * dt;
    o[key + "V"] = v * Math.max(0, 1 - d * dt);
    o[key] += o[key + "V"] * dt;
    return o[key];
  }
  function canvas(el, draw) {
    const ctx = el.getContext("2d");
    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;
    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }
    new ResizeObserver(resize).observe(el); resize();
    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }
    raf = requestAnimationFrame(frame);
    document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });
    return { ctx, size: () => ({ w, h }) };
  }
  function pointer(el, hd) {
    el.style.touchAction = "none";
    const pos = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    el.addEventListener("pointerdown", e => { if (e.button) return; try { el.setPointerCapture(e.pointerId); } catch {} hd.down && hd.down(...pos(e), e); });
    el.addEventListener("pointermove", e => { hd.move && hd.move(...pos(e), e); });
    const up = e => { hd.up && hd.up(...pos(e), e); };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  }
  // simple particle pool
  function particles() {
    const ps = [];
    return {
      burst(x, y, n, o = {}) { for (let i = 0; i < n; i++) { const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2), s = (o.speed ?? 120) * (0.4 + Math.random() * 0.8); ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: (o.life ?? 0.7) * (0.6 + Math.random() * 0.6), r: (o.r ?? 3) * (0.6 + Math.random() * 0.8), c: o.color || "#fff", g: o.gravity ?? 300 }); } },
      update(dt) { for (let i = ps.length - 1; i >= 0; i--) { const p = ps[i]; p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life >= p.max) ps.splice(i, 1); } },
      draw(ctx) { for (const p of ps) { ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); } ctx.globalAlpha = 1; }
    };
  }
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return { clamp, lerp, ease, spring, canvas, pointer, particles, css };
})();

/* ---- Accessibility layer for canvas concepts: every field and choice as real, visually hidden controls ---- */
Dough.a11y = function () {
  const st = document.createElement("style");
  st.textContent = ".dough-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.dough-sr:focus-within{position:fixed;left:8px;right:8px;bottom:8px;width:auto;height:auto;clip:auto;white-space:normal;background:#fff;color:#000;border:2px solid #000;border-radius:12px;padding:10px;z-index:1000;display:grid;gap:8px;font:16px system-ui}.dough-sr label{display:grid;gap:2px}.dough-sr input,.dough-sr button{font:inherit;min-height:40px}";
  document.head.append(st);
  const root = document.createElement("div"); root.className = "dough-sr"; root.setAttribute("role", "group"); root.setAttribute("aria-label", "Dough calculator controls"); document.body.append(root);
  const live = document.createElement("div"); live.setAttribute("aria-live", "polite");
  let sig = "";
  Dough.subscribe(m => {
    const s = m.mode + m.fields.map(f => f.key).join() + m.choices.map(c => c.key).join();
    if (s !== sig) {
      sig = s; root.replaceChildren();
      const modes = document.createElement("div");
      Dough.modes.forEach(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.setAttribute("aria-pressed", String(m.mode === v)); b.onclick = () => Dough.choose("mode", v); modes.append(b); });
      root.append(modes);
      m.fields.forEach(f => { const lab = document.createElement("label"); lab.textContent = `${f.label} (${f.unit || "count"})`; const i = document.createElement("input"); i.type = "number"; i.min = f.min; i.max = f.max; i.step = f.step; i.dataset.key = f.key; i.addEventListener("change", () => Dough.set(f.key, parseFloat(i.value))); lab.append(i); root.append(lab); });
      m.choices.forEach(c => { const g = document.createElement("div"); g.setAttribute("role", "group"); g.setAttribute("aria-label", c.label); c.options.forEach(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.dataset.k = c.key; b.dataset.v = v; b.onclick = () => Dough.choose(c.key, v); g.append(b); }); root.append(g); });
      root.append(live);
    }

    const acts = H("div", { class: "acts" });
    if (!t) acts.append(H("button", { type: "button", class: "go", text: tr("Start timer"), onclick: act(() => start(kind, open.step, ms)) }));
    else if (t.done) acts.append(H("button", { type: "button", class: "go", text: tr("Restart"), onclick: act(() => start(kind, open.step, ms)) }));
    else acts.append(H("button", { type: "button", class: "go", text: tr("Add to calendar"), onclick: act(() => calendar(t)) }), H("button", { type: "button", text: tr("Stop"), onclick: act(() => stop(id)) }));
    return H("div", { class: "trow" }, H("div", { class: "tl" }, H("b", { text: title }), left), acts);
  }
  function panel() {
    const el = pop(); if (!open) { el.hidden = true; return; }
    el.replaceChildren(row("step", tr(open.step), open.hours * 3600000), ...(open.fold ? [row("fold", tr("Fold"), FOLD)] : []), H("p", { class: "tnote", text: tr("A reminder follows your phone's sound settings. For something that must wake you, use the alarm in the Clock app.") }));
    el.setAttribute("aria-label", tr("Timer") + ": " + tr(open.step)); el.hidden = false;
  }
  function openFor(li) {
    const same = open && open.step === li.dataset.step && !pop().hidden;
    open = same ? null : { step: li.dataset.step, hours: +li.dataset.hours, fold: li.dataset.fold === "1" }; panel();
  }

  /* ---- the clock: the time left, and the moment a timer runs out ---- */
  function banner() {
    const el = $("#tdone"), t = list.find(x => x.done);
    if (!t) { el.hidden = true; return; }
    el.replaceChildren(H("span", { text: name(t) + ": " + tr("Done") }), H("button", { type: "button", text: tr("OK"), onclick: () => { list = list.filter(x => !x.done); save(); tick(); } }));
    el.hidden = false;
  }
  function tick() {
    const now = Date.now(); let changed = false;
    list.forEach(t => { if (!t.done && now >= t.end) { t.done = true; changed = true; save(); if (now - t.end < 8000) BK.ring(); } });
    cells(); banner(); if (changed && open) panel();
    pop().querySelectorAll("[data-left]").forEach(s => { const t = find(s.dataset.left); if (t && !t.done) s.textContent = fmt(t.end - now); });
    if (!list.length) { clearInterval(timer); timer = 0; } else if (!timer) timer = setInterval(tick, 1000);
  }

  $("#plan").addEventListener("click", e => { const b = e.target.closest("button.timer"); if (b) openFor(b.closest("li")); });
  document.addEventListener("pointerdown", e => { if (!pop().hidden && !e.target.closest("#tpop, #plan button.timer")) { open = null; panel(); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop().hidden) { open = null; panel(); } });
  new MutationObserver(() => { cells(); if (open) panel(); }).observe($("#plan"), { childList: true });
  BK.onChange(() => { cells(); banner(); if (open) panel(); });
  addEventListener("storage", e => { if (e.key === KEY) { list = read(); tick(); if (open) panel(); } });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  tick();
})();

</script>
</body>
</html>
