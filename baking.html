<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dough Calculator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f1e7; --ink: #2b2118; --muted: #7a6c5d; --line: #d9cfbf; --accent: #b4491e; --on-accent: #fff;
    --flour: #e8c872; --water: #8fc1e3; --starter: #c79a6b; --yeast: #d9867f; --salt: #cfcac1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16120e; --ink: #f0e6d6; --muted: #a39482; --line: #3a3128; --accent: #f0925f; --on-accent: #1c1008;
      --flour: #b58f3a; --water: #4f86ad; --starter: #946a43; --yeast: #a85a54; --salt: #7d786f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #app { width: min(520px, 100%); margin: 0 auto; padding: 8px 16px 12px; display: grid; gap: 4px; }

  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  #tabs button { min-height: 44px; border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  #tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 4px; }
  #total { font: 600 44px/1 Georgia, "Iowan Old Style", serif; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #sub { color: var(--muted); font-size: 0.9375rem; text-align: right; }

  #jar { width: 100%; height: auto; max-height: 46dvh; display: block; user-select: none; -webkit-user-select: none; }
  #jar [data-part] { cursor: ns-resize; }
  #jar text { font-family: inherit; fill: var(--ink); }
  #jar .lab-name { fill: var(--muted); font-size: 14px; }
  #jar .lab-val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #jar .sel-lab .lab-name, #jar .sel-lab .lab-val { fill: var(--accent); }

  #choices { display: flex; gap: 8px; flex-wrap: wrap; }
  #choices[hidden] { display: none; }
  .seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { min-height: 36px; padding: 0 12px; border: 0; background: none; font-size: 0.9375rem; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

  #fieldpick { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  #fieldpick button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: none; }
  #fieldpick button small { display: block; color: var(--muted); font-size: 0.8125rem; }
  #fieldpick button b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #fieldpick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #editor { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  #editor .step { width: 48px; height: 44px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 1.375rem; }
  #editor .step:active { background: var(--line); }
  #editor input { width: 88px; height: 44px; border: 0; border-bottom: 2px solid var(--ink); background: none; text-align: center; font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; border-radius: 0; }
  #editor .unit { color: var(--muted); margin-left: -4px; }
  #editor .presets { margin-left: auto; display: flex; gap: 6px; }
  #editor .presets button { min-height: 36px; padding: 0 10px; white-space: nowrap; border: 1px solid var(--line); border-radius: 8px; background: none; }
  #editor .presets button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  #plan { margin: 0; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main id="app">
  <nav id="tabs" role="tablist" aria-label="Dough type"></nav>
  <section class="hero"><output id="total" aria-live="polite"></output><span id="sub"></span></section>
  <svg id="jar" viewBox="0 0 340 296" role="group" aria-label="Dough jar. Drag a layer up or down to change it."></svg>
  <div id="choices"></div>
  <div id="fieldpick" role="group" aria-label="Value to edit"></div>
  <div id="editor"></div>
  <p id="plan"></p>
</main>

<script>
/* Shared core: the original calculator maths and saved state, behind a small API.
   Every concept below only draws a different interface on top of this. */
const Dough = (() => {
  const STORAGE_KEY = "dough-ratio-assistant:v1";
  const DEFAULTS = {
    mode: "sourdough",
    sourdough: { flour: 500, hydration: 70, starterPct: 5 },
    instant: { flour: 500, hydration: 70 },
    pizza: { balls: 8, hydration: 64, yeastType: "instant", proof: "nextDay", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }
  };
  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };
  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };

  /* ---- original calculations, unchanged ---- */
  function calculateSourdough({ flour, hydration, starterPct }) {
    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;
    const totalFlour = flour + starterFlour;
    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);
    const salt = totalFlour * 0.02;
    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculateInstant({ flour, hydration }) {
    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;
    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };
  }
  function calculatePizzaInstant({ balls, hydration, yeastPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;
    const flour = target / (1 + h + s + y);
    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };
  }
  function calculatePizzaSourdough({ balls, hydration, starterPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;
    const totalFlour = target / (1 + h + s);
    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;
    const water = Math.max(0, totalFlour * h - starterWater);
    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculatePizza(p) {
    return p.yeastType === "sourdough"
      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })
      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });
  }
  function bakeManualText(mode, p) {
    if (mode === "pizza") {
      if (p.yeastType === "instant" && p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      if (p.yeastType === "instant") return "Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.";
      if (p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      return "Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.";
    }
    if (mode === "sourdough") return "Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.";
    return "Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.";
  }

  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const sp = saved && saved.pizza;
      return {
        ...DEFAULTS, ...saved,
        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },
        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },
        pizza: {
          ...DEFAULTS.pizza,
          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,
          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,
          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,
          hydration: DEFAULTS.pizza.hydration,
          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }
        }
      };
    } catch { return structuredClone(DEFAULTS); }
  }
  let state = loadState();
  if (!["sourdough", "instant", "pizza"].includes(state.mode)) state.mode = "sourdough";
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));
    } catch {}
  }

  /* ---- field specs: what the UI may edit, with limits and presets ---- */
  const SPEC = {
    flour:          { label: "Flour",        unit: "g", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },
    hydration:      { label: "Hydration",    unit: "%", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },
    starterPct:     { label: "Starter",      unit: "%", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },
    balls:          { label: "Dough balls",  unit: "",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },
    pizzaHydration: { label: "Hydration",    unit: "%", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },
    yeastPct:       { label: "Yeast",        unit: "%", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }
  };
  const CHOICES = {
    yeastType: { label: "Leavening", options: [["instant", "Instant yeast"], ["sourdough", "Sourdough"]] },
    proof:     { label: "Proofing",  options: [["sameDay", "Same day"], ["nextDay", "Next day"]] }
  };
  const MODES = [["sourdough", "Sourdough"], ["instant", "Instant yeast"], ["pizza", "Pizza"]];
  const MODE_TITLE = { sourdough: "Sourdough bread", instant: "Instant yeast bread", pizza: "Neapolitan pizza" };

  function breadValues() {
    const cur = state[state.mode];
    return {
      flour: clampNumber(cur.flour, 1, 10000, 500),
      hydration: clampNumber(cur.hydration, 40, 100, 70),
      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)
    };
  }
  function pizzaValues() {
    const p = state.pizza;
    return {
      balls: clampNumber(p.balls, 1, 48, 8),
      hydration: clampNumber(p.hydration, 50, 80, 64),
      yeastType: p.yeastType === "sourdough" ? "sourdough" : "instant",
      proof: p.proof === "sameDay" ? "sameDay" : "nextDay",
      instantYeastPct: {
        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),
        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)
      }
    };
  }

  function fieldKeys() {
    if (state.mode === "pizza") return ["balls", "pizzaHydration"].concat(pizzaValues().yeastType === "instant" ? ["yeastPct"] : []);
    return state.mode === "sourdough" ? ["flour", "hydration", "starterPct"] : ["flour", "hydration"];
  }
  function valueOf(key) {
    if (state.mode === "pizza") {
      const p = pizzaValues();
      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];
    }
    return breadValues()[key];
  }

  function model() {
    const mode = state.mode, pizza = mode === "pizza";
    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();
    const r = pizza ? calculatePizza(p) : mode === "sourdough" ? calculateSourdough(v) : calculateInstant(v);
    const hasStarter = pizza ? p.yeastType === "sourdough" : mode === "sourdough";
    const hasYeast = pizza ? p.yeastType === "instant" : mode === "instant";
    const parts = [{ id: "flour", label: "Flour", g: pizza ? r.flour : v.flour }, { id: "water", label: "Water", g: r.water }];
    if (hasStarter) parts.push({ id: "starter", label: "Starter", g: r.starter });
    if (hasYeast) parts.push({ id: "yeast", label: "Yeast", g: r.yeast });
    parts.push({ id: "salt", label: "Salt", g: r.salt });
    return {
      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,
      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),
      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],
      plan: bakeManualText(mode, p),
      pieces: pizza ? p.balls : null
    };
  }

  const subs = new Set();
  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };

  function set(key, raw) {
    const sp = SPEC[key];
    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));
    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;
    if (key === "balls") state.pizza.balls = val;
    else if (key === "pizzaHydration") state.pizza.hydration = val;
    else if (key === "yeastPct") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }
    else if (key === "starterPct") state.sourdough.starterPct = val;
    else state[state.mode][key] = val;
    emit();
  }
  function choose(key, val) {
    if (key === "mode") state.mode = val;
    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }
    emit();
  }

  /* ---- formatting ---- */
  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + " g";
  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));
  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === "g" ? " g" : f.unit) : "");

  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */
  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };
  function drag(el, { key, axis = "x", pxPerStep = 10, onTap, onStart, onEnd, target }) {
    let start = null;
    el.style.touchAction = axis === "x" ? "pan-y" : "pan-x";
    el.addEventListener("pointerdown", e => {
      if (e.button) return;
      const k = typeof key === "function" ? key(e) : key;
      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };
      try { el.setPointerCapture(e.pointerId); } catch {}
      onStart && onStart(k, e);
    });
    el.addEventListener("pointermove", e => {
      if (!start || e.pointerId !== start.id || !start.k) return;
      const d = axis === "x" ? e.clientX - start.x : start.y - e.clientY;
      if (!start.moved && Math.abs(d) < 5) return;
      start.moved = true;
      const steps = Math.round(d / pxPerStep(start.k));
      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }
    });
    const end = e => {
      if (!start || e.pointerId !== start.id) return;
      const s = start; start = null;
      if (!s.moved && e.type === "pointerup") onTap && onTap(s.k, e);
      onEnd && onEnd(s.k, s.moved);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);
  return { model, set, choose, step, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },
           api: { calculateSourdough, calculateInstant, calculatePizza } };
})();
window.DoughRatioAssistant = Dough.api;

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const H = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]); } kids.forEach(c => e.append(c)); return e; };

  // jar geometry (svg units)
  const JX = 14, JW = 150, JT = 18, JH = 270;
  const CAP = { bread: 2400, pizza: 4800 };
  let sel = "flour";
  let current = null;

  // which field a layer edits
  function fieldFor(part, m) {
    const keys = m.fields.map(f => f.key);
    const map = { flour: m.mode === "pizza" ? "balls" : "flour", water: m.mode === "pizza" ? "pizzaHydration" : "hydration", starter: "starterPct", yeast: "yeastPct" };
    const k = map[part];
    return k && keys.includes(k) ? k : null;
  }
  const PX = { flour: 3, hydration: 6, starterPct: 8, balls: 26, pizzaHydration: 6, yeastPct: 4 };

  function drawJar(m) {
    const svg = $("#jar"); svg.replaceChildren();
    const cap = Math.max(m.mode === "pizza" ? CAP.pizza : CAP.bread, m.total * 1.04);
    const fillH = Math.max(14, m.total / cap * JH);
    const defs = el("defs"); const clip = el("clipPath", { id: "inside" });
    clip.append(el("rect", { x: JX, y: JT, width: JW, height: JH, rx: 20 })); defs.append(clip); svg.append(defs);

    const g = el("g", { "clip-path": "url(#inside)" });
    let y = JT + JH; const centers = [];
    m.parts.forEach(p => {
      const h = p.g / m.total * fillH; y -= h;
      const k = fieldFor(p.id, m);
      const r = el("rect", { x: JX, y: y.toFixed(1), width: JW, height: Math.max(h, 0.5).toFixed(1), fill: `var(--${p.id})`, "data-part": p.id, "data-k": k || "" });
      if (k) { r.setAttribute("tabindex", "0"); r.setAttribute("role", "slider"); r.setAttribute("aria-label", `${p.label}: ${m.fields.find(f => f.key === k).label}`); r.setAttribute("aria-valuenow", m.fields.find(f => f.key === k).value); }
      g.append(r);
      if (h > 0.5) g.append(el("line", { x1: JX, x2: JX + JW, y1: y.toFixed(1), y2: y.toFixed(1), stroke: "var(--bg)", "stroke-width": 1.5, "pointer-events": "none" }));
      centers.push({ p, top: y, h, c: y + h / 2 });
    });
    if (sel && centers.some(c => c.p.id === sel)) {
      const c = centers.find(c => c.p.id === sel);
      g.append(el("rect", { x: JX + 2, y: (c.top + 1).toFixed(1), width: JW - 4, height: Math.max(c.h - 2, 1).toFixed(1), fill: "none", stroke: "var(--ink)", "stroke-width": 2, "pointer-events": "none" }));
    }
    svg.append(g);
    svg.append(el("rect", { x: JX, y: JT, width: JW, height: JH, rx: 20, fill: "none", stroke: "var(--ink)", "stroke-width": 2.5, "pointer-events": "none" }));
    svg.append(el("line", { x1: JX + 40, x2: JX + JW - 40, y1: JT - 4, y2: JT - 4, stroke: "var(--ink)", "stroke-width": 4, "stroke-linecap": "round", "pointer-events": "none" }));

    // labels on the right, pushed apart so thin layers stay readable
    const MIN = 26; const labels = centers.map(c => ({ ...c, y: c.c })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < MIN) labels[i].y = labels[i - 1].y + MIN;
    const over = labels.length ? labels[labels.length - 1].y - (JT + JH - 6) : 0;
    if (over > 0) labels.forEach(l => l.y -= over);
    labels.forEach(l => {
      const grp = el("g", { class: l.p.id === sel ? "sel-lab" : "", "data-part": l.p.id, "data-k": fieldFor(l.p.id, m) || "", style: "cursor:pointer" });
      grp.append(el("path", { d: `M${JX + JW} ${l.c.toFixed(1)} L${JX + JW + 14} ${l.c.toFixed(1)} L${JX + JW + 24} ${l.y.toFixed(1)}`, fill: "none", stroke: "var(--muted)", "stroke-width": 1, "pointer-events": "none" }));
      grp.append(el("rect", { x: JX + JW + 24, y: (l.y - 13).toFixed(1), width: 160, height: 26, fill: "transparent" }));
      grp.append(el("text", { x: JX + JW + 30, y: (l.y + 5).toFixed(1), class: "lab-name" }, l.p.label));
      grp.append(el("text", { x: 336, y: (l.y + 5).toFixed(1), class: "lab-val", "text-anchor": "end" }, Dough.fmtG(l.p.g)));
      svg.append(grp);
    });
  }

  function drawTray(m) {
    const choices = $("#choices"); choices.hidden = !m.choices.length; choices.replaceChildren();
    m.choices.forEach(c => choices.append(H("div", { class: "seg", role: "group", "aria-label": c.label },
      ...c.options.map(([v, l]) => H("button", { type: "button", text: l, "aria-pressed": String(c.value === v), onclick: () => Dough.choose(c.key, v) })))));

    const pick = $("#fieldpick"); pick.replaceChildren();
    const active = m.fields.find(f => f.key === activeKey(m)) || m.fields[0];
    m.fields.forEach(f => pick.append(H("button", { type: "button", "aria-pressed": String(f.key === active.key), onclick: () => { sel = partForField(f.key, m); drawAll(); } },
      H("small", { text: f.label }), H("b", { text: Dough.fmtVal(f) }))));

    const ed = $("#editor"); ed.replaceChildren();
    const input = H("input", { type: "text", inputmode: "decimal", "aria-label": active.label, value: Dough.fmtNum(active.value, active.dec) });
    input.addEventListener("focus", () => input.select());
    input.addEventListener("change", () => { const v = parseFloat(input.value.replace(",", ".")); if (Number.isFinite(v)) Dough.set(active.key, v); else drawTray(current); });
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
    ed.append(H("button", { type: "button", class: "step", "aria-label": "Decrease " + active.label, text: "−", onclick: () => Dough.step(active.key, -1) }), input,
      H("span", { class: "unit", text: active.unit }),
      H("button", { type: "button", class: "step", "aria-label": "Increase " + active.label, text: "+", onclick: () => Dough.step(active.key, 1) }));
    if (active.presets.length) ed.append(H("div", { class: "presets" }, ...active.presets.map(p =>
      H("button", { type: "button", text: p + (active.unit === "g" ? " g" : active.unit), "aria-pressed": String(active.value === p), onclick: () => Dough.set(active.key, p) }))));
  }
  const partForField = (key, m) => ({ flour: "flour", balls: "flour", hydration: "water", pizzaHydration: "water", starterPct: "starter", yeastPct: "yeast" })[key];
  function activeKey(m) { const k = fieldFor(sel, m); return k || m.fields[0].key; }

  function drawAll() {
    const m = current;
    $("#tabs").replaceChildren(...Dough.modes.map(([v, l]) => H("button", { type: "button", role: "tab", text: l, "aria-selected": String(m.mode === v), onclick: () => { sel = "flour"; Dough.choose("mode", v); } })));
    $("#total").textContent = Dough.fmtG(m.total);
    $("#sub").textContent = m.mode === "pizza" ? `${m.pieces} balls of 300 g` : `${Dough.fmtNum(m.finalHydration, 1)}% hydration`;
    $("#plan").textContent = m.plan;
    if (!m.parts.some(p => p.id === sel) || !fieldFor(sel, m)) sel = "flour";
    drawJar(m); drawTray(m);
  }

  // drag a layer: up = more
  Dough.drag($("#jar"), {
    key: e => { const t = e.target.closest("[data-part]"); return t && t.dataset.k ? t.dataset.k : null; },
    axis: "y",
    pxPerStep: k => PX[k] || 6,
    onStart: (k, e) => { const t = e.target.closest("[data-part]"); if (t && t.dataset.k) { sel = t.dataset.part; } },
  });
  $("#jar").addEventListener("keydown", e => {
    const t = e.target.closest && e.target.closest("[data-k]"); if (!t || !t.dataset.k) return;
    const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key]; if (!dir) return;
    e.preventDefault(); sel = t.dataset.part; Dough.step(t.dataset.k, dir);
  });

  Dough.subscribe(m => { current = m; drawAll(); });
})();
</script>
</body>
</html>
