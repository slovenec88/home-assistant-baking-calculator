<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dough Calculator Concepts</title>
<style>
  :root { color-scheme: light dark; --bg: #e9e7e1; --panel: #f7f6f2; --ink: #1c1b18; --muted: #6d6a62; --line: #cfccc2; --accent: #1f6f4a; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f0d; --panel: #181916; --ink: #ecebe5; --muted: #98958b; --line: #2c2d29; --accent: #5fc58f; --on: #0d1a12; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .nav { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: none; font-size: 1.25rem; }
  header .nav:active { background: var(--line); }
  #pick { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); text-align: left; display: flex; align-items: center; gap: 8px; }
  #pick b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pick small { color: var(--muted); margin-left: auto; white-space: nowrap; }

  main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); position: relative; }
  #side { display: none; }
  #stage { min-height: 0; display: grid; place-items: center; }
  #frame { width: 100%; height: 100%; border: 0; background: var(--bg); }

  /* picker sheet */
  #sheet { position: absolute; inset: 0; z-index: 10; background: var(--bg); overflow: auto; padding: 8px; display: none; }
  #sheet.open { display: block; }
  .item { width: 100%; display: grid; gap: 2px; text-align: left; padding: 12px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .item b { font-size: 1rem; } .item span { color: var(--muted); font-size: 0.875rem; }
  .item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .grp { margin: 12px 4px 6px; color: var(--muted); font-size: 0.8125rem; font-weight: 700; }

  /* wide screens: list on the left, phone frame in the middle */
  @media (min-width: 860px) {
    main { grid-template-columns: 320px minmax(0, 1fr); }
    #side { display: block; overflow: auto; padding: 8px; border-right: 1px solid var(--line); background: var(--panel); }
    #pick { cursor: default; }
    #sheet { display: none !important; }
    #frame { width: 390px; height: min(100%, 780px); border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 0 0 8px var(--panel); }
    #stage { padding: 16px; }
  }
</style>
</head>
<body>
<header>
  <button class="nav" id="prev" aria-label="Previous concept">&#8249;</button>
  <button id="pick" aria-haspopup="dialog"><b id="name"></b><small id="idx"></small></button>
  <button class="nav" id="next" aria-label="Next concept">&#8250;</button>
</header>
<main>
  <nav id="side" aria-label="Concepts"></nav>
  <div id="stage"><iframe id="frame" title="Concept" sandbox="allow-scripts allow-same-origin allow-modals"></iframe></div>
  <div id="sheet" role="dialog" aria-label="Pick a concept"></div>
</main>

01\" aria-label=\"Increase instant yeast\">+<\/button>\n              <\/span>\n            <\/div>\n          <\/div>\n        <\/form>\n\n        <aside class=\"panel results\" aria-live=\"polite\">\n          <div class=\"stats\">\n            <div class=\"stat flour mode-only\" data-visible-for=\"pizza\">\n              <div class=\"label\">Flour<\/div>\n              <output class=\"value\" id=\"pizzaFlour\">0 g<\/output>\n            <\/div>\n            <div class=\"stat water\">\n              <div class=\"label\">Required water<\/div>\n              <output class=\"value\" id=\"water\">0 g<\/output>\n            <\/div>\n            <div class=\"stat starter mode-only\" data-visible-for=\"sourdough pizza\">\n              <div class=\"label\" id=\"starterLabel\">Necessary starter<\/div>\n              <output class=\"value\" id=\"starter\">0 g<\/output>\n            <\/div>\n            <div class=\"stat yeast mode-only\" data-visible-for=\"instant pizza\">\n              <div class=\"label\" id=\"yeastLabel\">Instant yeast<\/div>\n              <output class=\"value\" id=\"yeast\">0 g<\/output>\n            <\/div>\n            <div class=\"stat salt\">\n              <div class=\"label\">Recommended salt<\/div>\n              <output class=\"value\" id=\"salt\">0 g<\/output>\n            <\/div>\n            <div class=\"stat\">\n              <div class=\"label\">Final hydration<\/div>\n              <output class=\"value\" id=\"finalHydration\">0%<\/output>\n            <\/div>\n          <\/div>\n\n          <div class=\"result-main\">\n            <span class=\"label\">Total dough<\/span>\n            <output class=\"total\" id=\"totalDough\">0 g<\/output>\n          <\/div>\n\n          <div class=\"manual mode-only\" data-visible-for=\"sourdough instant pizza\" hidden>\n            <p class=\"manual-title\">Little bake plan<\/p>\n            <p class=\"manual-text\" id=\"pizzaManual\"><\/p>\n          <\/div>\n        <\/aside>\n      <\/section>\n    <\/div>\n  <\/main>\n\n  <script>\n    const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n    const DEFAULTS = {\n      mode: \"sourdough\",\n      sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n      instant: { flour: 500, hydration: 70 },\n      pizza: {\n        balls: 8,\n        hydration: 64,\n        yeastType: \"instant\",\n        proof: \"nextDay\",\n        instantYeastPct: { sameDay: 0.5, nextDay: 0.11 }\n      }\n    };\n\n    const PIZZA_BALL_WEIGHT = 300;\n    const PIZZA_SALT_PCT = 2;\n    const PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n\n    const el = {\n      modeTitle: document.querySelector(\"#modeTitle\"),\n      tabs: [...document.querySelectorAll(\"[data-mode]\")],\n      modeBlocks: [...document.querySelectorAll(\"[data-visible-for]\")],\n      flourChips: [...document.querySelectorAll(\"[data-flour]\")],\n      flourCustom: document.querySelector(\"#flourCustom\"),\n      hydrationChips: [...document.querySelectorAll(\"[data-hydration]\")],\n      hydrationCustom: document.querySelector(\"#hydrationCustom\"),\n      starterChips: [...document.querySelectorAll(\"[data-starter-pct]\")],\n      starterCustom: document.querySelector(\"#starterCustom\"),\n      pizzaBalls: document.querySelector(\"#pizzaBalls\"),\n      pizzaHydration: document.querySelector(\"#pizzaHydration\"),\n      pizzaYeastPct: document.querySelector(\"#pizzaYeastPct\"),\n      pizzaFlour: document.querySelector(\"#pizzaFlour\"),\n      pizzaManual: document.querySelector(\"#pizzaManual\"),\n      pizzaYeastTypeChips: [...document.querySelectorAll(\"[data-pizza-yeast-type]\")],\n      pizzaProofChips: [...document.querySelectorAll(\"[data-pizza-proof]\")],\n      pizzaStepButtons: [...document.querySelectorAll(\"[data-pizza-step]\")],\n      flour: document.querySelector(\"#flour\"),\n      hydration: document.querySelector(\"#hydration\"),\n      starterPct: document.querySelector(\"#starterPct\"),\n      totalDough: document.querySelector(\"#totalDough\"),\n      water: document.querySelector(\"#water\"),\n      starter: document.querySelector(\"#starter\"),\n      starterLabel: document.querySelector(\"#starterLabel\"),\n      yeast: document.querySelector(\"#yeast\"),\n      yeastLabel: document.querySelector(\"#yeastLabel\"),\n      salt: document.querySelector(\"#salt\"),\n      finalHydration: document.querySelector(\"#finalHydration\"),\n      formulaNote: null\n    };\n\n    let state = loadState();\n\n    function clampNumber(value, min, max, fallback) {\n      const parsed = Number(value);\n      if (!Number.isFinite(parsed)) return fallback;\n      return Math.min(max, Math.max(min, parsed));\n    }\n\n    function grams(value) {\n      const rounded = Math.round(value);\n      return `${rounded.toLocaleString()} g`;\n    }\n\n    function gramLabel(value) {\n      return `${Number(value.toFixed(0)).toLocaleString()} g`;\n    }\n\n    function pct(value) {\n      return `${Number(value.toFixed(1)).toLocaleString()}%`;\n    }\n\n    function presetLabel(value) {\n      return `${Number(value.toFixed(1)).toLocaleString()}%`;\n    }\n\n    function precisePctLabel(value) {\n      return `${Number(value.toFixed(2)).toLocaleString()}%`;\n    }\n\n    function focusInput(input) {\n      input.focus();\n      input.select();\n    }\n\n    function calculateSourdough({ flour, hydration, starterPct }) {\n      const starter = flour * starterPct / 100;\n      const starterFlour = starter / 2;\n      const starterWater = starter / 2;\n      const totalFlour = flour + starterFlour;\n      const requiredWater = Math.max(0, totalFlour * hydration / 100 - starterWater);\n      const salt = totalFlour * 0.02;\n      const totalDough = flour + starter + requiredWater + salt;\n\n      return {\n        totalDough,\n        water: requiredWater,\n        starter,\n        salt,\n        finalHydration: (requiredWater + starterWater) / totalFlour * 100\n      };\n    }\n\n    function calculateInstant({ flour, hydration }) {\n      const water = flour * hydration / 100;\n      const salt = flour * 0.02;\n      const yeast = flour * 0.007;\n      const totalDough = flour + water + salt + yeast;\n\n      return {\n        totalDough,\n        water,\n        yeast,\n        salt,\n        finalHydration: hydration\n      };\n    }\n\n    function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n      const targetDough = balls * PIZZA_BALL_WEIGHT;\n      const hydrationRate = hydration / 100;\n      const yeastRate = yeastPct / 100;\n      const saltRate = PIZZA_SALT_PCT / 100;\n      const flour = targetDough / (1 + hydrationRate + saltRate + yeastRate);\n      const water = flour * hydrationRate;\n      const yeast = flour * yeastRate;\n      const salt = flour * saltRate;\n\n      return { totalDough: targetDough, flour, water, yeast, salt, finalHydration: hydration };\n    }\n\n    function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n      const targetDough = balls * PIZZA_BALL_WEIGHT;\n      const hydrationRate = hydration / 100;\n      const starterRate = starterPct / 100;\n      const saltRate = PIZZA_SALT_PCT / 100;\n      const totalFlour = targetDough / (1 + hydrationRate + saltRate);\n      const starter = totalFlour * starterRate;\n      const starterWater = starter / 2;\n      const starterFlour = starter / 2;\n      const flour = totalFlour - starterFlour;\n      const water = Math.max(0, totalFlour * hydrationRate - starterWater);\n      const salt = totalFlour * saltRate;\n\n      return {\n        totalDough: targetDough,\n        flour,\n        water,\n        starter,\n        salt,\n        finalHydration: (water + starterWater) / totalFlour * 100\n      };\n    }\n\n    function calculatePizza(pizza) {\n      if (pizza.yeastType === \"sourdough\") {\n        return calculatePizzaSourdough({\n          balls: pizza.balls,\n          hydration: pizza.hydration,\n          starterPct: PIZZA_STARTER_PCT[pizza.proof]\n        });\n      }\n\n      return calculatePizzaInstant({\n        balls: pizza.balls,\n        hydration: pizza.hydration,\n        yeastPct: pizza.instantYeastPct[pizza.proof]\n      });\n    }\n\n    function pizzaManualText(pizza) {\n      if (pizza.yeastType === \"instant\" && pizza.proof === \"sameDay\") {\n        return \"🍯 Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      }\n      if (pizza.yeastType === \"instant\" && pizza.proof === \"nextDay\") {\n        return \"🌙 Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      }\n      if (pizza.yeastType === \"sourdough\" && pizza.proof === \"sameDay\") {\n        return \"🌿 Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      }\n      return \"✨ Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n\n    function bakeManualText(mode, pizza) {\n      if (mode === \"pizza\") return pizzaManualText(pizza);\n      if (mode === \"sourdough\") {\n        return \"🌿 Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n      }\n      return \"🍞 Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n    }\n\n    function loadState() {\n      try {\n        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n        return {\n          ...DEFAULTS,\n          ...saved,\n          sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n          instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n          pizza: {\n            ...DEFAULTS.pizza,\n            balls: saved && saved.pizza && saved.pizza.balls ? saved.pizza.balls : DEFAULTS.pizza.balls,\n            yeastType: saved && saved.pizza && saved.pizza.yeastType ? saved.pizza.yeastType : DEFAULTS.pizza.yeastType,\n            proof: saved && saved.pizza && saved.pizza.proof ? saved.pizza.proof : DEFAULTS.pizza.proof,\n            hydration: DEFAULTS.pizza.hydration,\n            instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n          }\n        };\n      } catch {\n        return structuredClone(DEFAULTS);\n      }\n    }\n\n    function saveState() {\n      const savedState = {\n        ...state,\n        pizza: {\n          ...state.pizza,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));\n    }\n\n    function currentValues() {\n      const current = state[state.mode];\n      return {\n        flour: clampNumber(el.flour.value, 1, 10000, current.flour),\n        hydration: clampNumber(el.hydration.value, 40, 100, current.hydration),\n        starterPct: clampNumber(el.starterPct.value, 0, 100, state.sourdough.starterPct)\n      };\n    }\n\n    function currentPizza() {\n      return {\n        ...state.pizza,\n        balls: clampNumber(state.pizza.balls, 1, 48, DEFAULTS.pizza.balls),\n        hydration: clampNumber(state.pizza.hydration, 50, 80, DEFAULTS.pizza.hydration),\n        yeastType: state.pizza.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n        proof: state.pizza.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n        instantYeastPct: {\n          sameDay: clampNumber(state.pizza.instantYeastPct.sameDay, 0.01, 2, DEFAULTS.pizza.instantYeastPct.sameDay),\n          nextDay: clampNumber(state.pizza.instantYeastPct.nextDay, 0.01, 2, DEFAULTS.pizza.instantYeastPct.nextDay)\n        }\n      };\n    }\n\n    function commitInputs() {\n      const values = currentValues();\n      if (state.mode === \"sourdough\") {\n        state.sourdough = values;\n      } else if (state.mode === \"instant\") {\n        state.instant = { flour: values.flour, hydration: values.hydration };\n      }\n      saveState();\n      render();\n    }\n\n    function setMode(mode) {\n      const previous = currentValues();\n      if (state.mode === \"sourdough\") {\n        state.sourdough = previous;\n      } else if (state.mode === \"instant\") {\n        state.instant = { flour: previous.flour, hydration: previous.hydration };\n      }\n      state.mode = mode;\n      saveState();\n      syncInputsFromState();\n      render();\n    }\n\n    function setPizzaOption(key, value) {\n      state.pizza = currentPizza();\n      state.pizza[key] = value;\n      saveState();\n      render();\n    }\n\n    function stepPizzaControl(control, step) {\n      const pizza = currentPizza();\n      if (control === \"balls\") {\n        pizza.balls = clampNumber(pizza.balls + step, 1, 48, DEFAULTS.pizza.balls);\n      }\n      if (control === \"hydration\") {\n        pizza.hydration = clampNumber(pizza.hydration + step, 50, 80, DEFAULTS.pizza.hydration);\n      }\n      if (control === \"yeastPct\") {\n        const proof = pizza.proof;\n        pizza.instantYeastPct[proof] = clampNumber(pizza.instantYeastPct[proof] + step, 0.01, 2, DEFAULTS.pizza.instantYeastPct[proof]);\n        pizza.instantYeastPct[proof] = Math.round(pizza.instantYeastPct[proof] * 100) / 100;\n      }\n      state.pizza = pizza;\n      saveState();\n      render();\n    }\n\n    function syncInputsFromState() {\n      if (state.mode === \"pizza\") return;\n      const current = state[state.mode];\n      el.flour.value = current.flour;\n      el.hydration.value = current.hydration;\n      el.starterPct.value = state.sourdough.starterPct;\n    }\n\n    function render() {\n      const pizzaMode = state.mode === \"pizza\";\n      const values = pizzaMode ? null : currentValues();\n      const pizza = currentPizza();\n      const sourdough = state.mode === \"sourdough\";\n      const instant = state.mode === \"instant\";\n      const pizzaInstant = pizzaMode && pizza.yeastType === \"instant\";\n      const pizzaSourdough = pizzaMode && pizza.yeastType === \"sourdough\";\n      const result = pizzaMode ? calculatePizza(pizza) : sourdough ? calculateSourdough(values) : calculateInstant(values);\n\n      el.tabs.forEach(tab => {\n        tab.setAttribute(\"aria-selected\", String(tab.dataset.mode === state.mode));\n      });\n\n      el.modeBlocks.forEach(block => {\n        const targets = block.dataset.visibleFor.split(\" \");\n        block.hidden = !targets.includes(state.mode);\n      });\n\n      document.querySelectorAll(\"[data-visible-for='pizza-instant']\").forEach(block => {\n        block.hidden = !pizzaInstant;\n      });\n\n      if (!pizzaMode) {\n        el.flourChips.forEach(chip => {\n          chip.setAttribute(\"aria-pressed\", String(Number(chip.dataset.flour) === values.flour));\n        });\n\n        const flourPresets = el.flourChips.map(chip => Number(chip.dataset.flour));\n        const flourIsPreset = flourPresets.includes(values.flour);\n        el.flourCustom.textContent = flourIsPreset ? \"Custom\" : gramLabel(values.flour);\n        el.flourCustom.setAttribute(\"aria-pressed\", String(!flourIsPreset));\n\n        el.hydrationChips.forEach(chip => {\n          chip.setAttribute(\"aria-pressed\", String(Number(chip.dataset.hydration) === values.hydration));\n        });\n\n        const hydrationIsPreset = [65, 70].includes(values.hydration);\n        el.hydrationCustom.textContent = hydrationIsPreset ? \"Custom\" : presetLabel(values.hydration);\n        el.hydrationCustom.setAttribute(\"aria-pressed\", String(!hydrationIsPreset));\n\n        el.starterChips.forEach(chip => {\n          chip.setAttribute(\"aria-pressed\", String(Number(chip.dataset.starterPct) === values.starterPct));\n        });\n\n        const starterIsPreset = [5, 10].includes(values.starterPct);\n        el.starterCustom.textContent = starterIsPreset ? \"Custom\" : presetLabel(values.starterPct);\n        el.starterCustom.setAttribute(\"aria-pressed\", String(!starterIsPreset));\n      }\n\n      el.pizzaBalls.textContent = pizza.balls;\n      el.pizzaHydration.textContent = presetLabel(pizza.hydration);\n      el.pizzaYeastPct.textContent = precisePctLabel(pizza.instantYeastPct[pizza.proof]);\n      el.pizzaManual.textContent = bakeManualText(state.mode, pizza);\n      el.pizzaYeastTypeChips.forEach(chip => {\n        chip.setAttribute(\"aria-pressed\", String(chip.dataset.pizzaYeastType === pizza.yeastType));\n      });\n      el.pizzaProofChips.forEach(chip => {\n        chip.setAttribute(\"aria-pressed\", String(chip.dataset.pizzaProof === pizza.proof));\n      });\n\n      el.modeTitle.textContent = pizzaMode ? \"Neapolitan pizza\" : sourdough ? \"Sourdough bread\" : \"Instant yeast bread\";\n      el.totalDough.textContent = grams(result.totalDough);\n      el.pizzaFlour.textContent = grams(result.flour || 0);\n      el.water.textContent = grams(result.water);\n      el.salt.textContent = grams(result.salt);\n      el.finalHydration.textContent = pct(result.finalHydration);\n      el.starterLabel.textContent = pizzaMode ? \"Sourdough starter\" : \"Necessary starter\";\n      el.yeastLabel.textContent = pizzaMode ? \"Instant dry yeast\" : \"Instant yeast\";\n\n      if (sourdough || pizzaSourdough) {\n        el.starter.textContent = grams(result.starter);\n      }\n      if (instant || pizzaInstant) {\n        el.yeast.textContent = grams(result.yeast);\n      }\n\n      el.starter.parentElement.hidden = !(sourdough || pizzaSourdough);\n      el.yeast.parentElement.hidden = !(instant || pizzaInstant);\n    }\n\n    el.tabs.forEach(tab => {\n      tab.addEventListener(\"click\", () => setMode(tab.dataset.mode));\n    });\n\n    el.flourChips.forEach(chip => {\n      chip.addEventListener(\"click\", () => {\n        el.flour.value = chip.dataset.flour;\n        commitInputs();\n      });\n    });\n\n    el.flourCustom.addEventListener(\"click\", () => focusInput(el.flour));\n\n    el.hydrationChips.forEach(chip => {\n      chip.addEventListener(\"click\", () => {\n        el.hydration.value = chip.dataset.hydration;\n        commitInputs();\n      });\n    });\n\n    el.hydrationCustom.addEventListener(\"click\", () => focusInput(el.hydration));\n\n    el.starterChips.forEach(chip => {\n      chip.addEventListener(\"click\", () => {\n        el.starterPct.value = chip.dataset.starterPct;\n        commitInputs();\n      });\n    });\n\n    el.starterCustom.addEventListener(\"click\", () => focusInput(el.starterPct));\n\n    el.pizzaYeastTypeChips.forEach(chip => {\n      chip.addEventListener(\"click\", () => setPizzaOption(\"yeastType\", chip.dataset.pizzaYeastType));\n    });\n\n    el.pizzaProofChips.forEach(chip => {\n      chip.addEventListener(\"click\", () => setPizzaOption(\"proof\", chip.dataset.pizzaProof));\n    });\n\n    el.pizzaStepButtons.forEach(button => {\n      button.addEventListener(\"click\", () => {\n        stepPizzaControl(button.dataset.pizzaStep, Number(button.dataset.step));\n      });\n    });\n\n    [el.flour, el.hydration, el.starterPct].forEach(input => {\n      input.addEventListener(\"input\", commitInputs);\n      input.addEventListener(\"change\", commitInputs);\n    });\n\n    window.DoughRatioAssistant = {\n      calculateSourdough,\n      calculateInstant,\n      calculatePizzaInstant,\n      calculatePizzaSourdough,\n      calculatePizza\n    };\n\n    syncInputsFromState();\n    render();\n  <\/script>\n<\/body>\n<\/html>\n"}, {"id": "material-you", "name": "Material You, one screen", "group": "Your original, reworked", "blurb": "Same layout, Material 3 tonal look, results on the same screen, presets on tap.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <title>Dough Calculator<\/title>\n  <style>\n    :root {\n      color-scheme: light dark;\n      --primary: #6750a4;\n      --primary-container: #eaddff;\n      --on-primary-container: #21005d;\n      --secondary-container: #e8def8;\n      --on-secondary-container: #1d192b;\n      --water: #5b8fe0;\n      --fl tions button.primary { background: transparent; color: var(--primary); }\n    .saved-item { border-radius: 16px; background: var(--s-highest); }\n    .saved-item button { color: var(--on-secondary-container); background: var(--secondary-container); font-weight: 500; }\n    #toast { border-radius: 12px; color: var(--on-inverse); background: var(--inverse); font-weight: 400; }\n\n    @media (max-width: 760px) {\n      .app { padding: 12px; }\n      .recipe { background: var(--s-low); border-radius: 28px 28px 0 0; box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.05); }\n      .recipe-handle .grip { width: 32px; height: 4px; background: var(--outline); opacity: 0.6; }\n      .recipe-handle .summary { color: var(--on-surface); font-weight: 500; }\n      .form, .plan { padding: 16px; }\n      .recipe-body { padding: 8px 16px 16px; }\n    }\n\n    /* ===== One screen: inputs and results visible together on a phone ===== */\n    .phone-only { display: none; }\n    @media (max-width: 760px) {\n      body { padding-bottom: 0; }\n      .app { padding: 8px; }\n      .shell, .layout { gap: 8px; }\n      .top-actions { display: none; }\n      .phone-only { display: inline-flex; align-items: center; justify-content: center; }\n      #resetBtn { display: none; }\n      .actions { grid-template-columns: repeat(4, 1fr); }\n      .actions button { min-height: 40px; }\n\n      /* results are part of the page, not a sheet */\n      .recipe { position: static; display: block; max-height: none; border-radius: 24px; box-shadow: none; background: var(--s-high); padding: 0; }\n      .recipe-handle { display: none; }\n      .recipe-body { display: grid; padding: 12px; gap: 8px; }\n      .ing .bp { min-width: 44px; font-size: 0.8125rem; }\n      .recipe-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }\n      .recipe-head h2 { font-size: 1.125rem; }\n      .recipe-head p { margin: 0; }\n      .ings { gap: 6px; }\n      .ing { row-gap: 2px; }\n      .ing .name { font-size: 0.9375rem; }\n      .ing .amt { font-size: 1.25rem; }\n      .ing .bar { height: 6px; }\n      .ing-head { display: none; }\n      .ing .bp::after { content: \"\"; }\n      .stats { display: none; }\n      .result-main { padding: 8px 16px; border-radius: 20px; }\n      .total { font-size: 1.875rem; }\n\n      /* inputs: one line per value */\n      .panel { border-radius: 24px; }\n      .form { padding: 12px; gap: 4px; }\n      .fields { gap: 4px; }\n      .field { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; row-gap: 0; min-height: 40px; }\n      .field > .presets { display: none; }\n      .field:focus-within > .presets { display: flex; grid-column: 1 / -1; justify-content: flex-end; padding-bottom: 6px; }\n      .field > .chips { grid-column: 2; justify-content: flex-end; }\n      .field:has(> .segmented) { grid-template-columns: auto minmax(0, 1fr); }\n      .field > .segmented { justify-self: end; grid-column: 2; }\n      .field-label { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; font-size: 0.9375rem; }\n      .field-label small { font-size: 0.75rem; }\n      .stepper { grid-template-columns: 36px 96px 36px; gap: 4px; }\n      .stepper button { min-height: 36px; font-size: 1.25rem; }\n      .stepper input { min-height: 38px; padding: 0 28px 0 8px; border-radius: 12px; font-size: 1.125rem; }\n      .stepper .unit { right: 8px; font-size: 0.8125rem; }\n      #fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }\n      #fields > .field { grid-column: 1 / -1; }\n      #fields > .field.choice { grid-column: span 1; grid-template-columns: 1fr; }\n      .field.choice .field-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }\n      .field.choice > .chips { grid-column: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }\n      .field.choice .chip { padding: 0 4px; font-size: 0.8125rem; }\n      details.advanced { padding-top: 0; }\n      details.advanced summary { min-height: 36px; }\n      .plan { padding: 12px; }\n    }\n  <\/style>\n<\/head>\n<body>\n  <main class=\"app\">\n    <div class=\"shell\">\n      <header class=\"topbar\">\n        <nav class=\"segmented\" id=\"tabs\" aria-label=\"Dough type\"><\/nav>\n        <div class=\"top-actions\">\n          <button type=\"button\" class=\"icon-btn\" id=\"unitsBtn\" aria-label=\"Switch units\">g<\/button>\n          <button type=\"button\" class=\"icon-btn\" id=\"recipesBtn\">Recipes<\/button>\n        <\/div>\n      <\/header>\n\n      <section class=\"layout\">\n        <form class=\"panel form\" id=\"controls\" autocomplete=\"off\" onsubmit=\"return false\">\n          <div class=\"field\">\n            <div class=\"field-label\">Scale by<\/div>\n            <div class=\"segmented small\" id=\"scaleSeg\" role=\"group\" aria-label=\"Scale recipe by\"><\/div>\n          <\/div>\n          <div class=\"fields\" id=\"fields\"><\/div>\n          <details class=\"advanced\">\n            <summary>Advanced<\/summary>\n            <div class=\"fields\" id=\"advFields\"><\/div>\n          <\/details>\n        <\/form>\n\n        <aside class=\"panel recipe\" id=\"recipe\" aria-label=\"Recipe\">\n          <button type=\"button\" class=\"recipe-handle\" id=\"sheetToggle\" aria-expanded=\"false\" aria-controls=\"recipeBody\">\n            <span class=\"grip\"><\/span>\n            <span class=\"summary\" id=\"summary\"><\/span>\n          <\/button>\n          <div class=\"recipe-body\" id=\"recipeBody\">\n            <div class=\"recipe-head\">\n              <h2 id=\"recipeTitle\"><\/h2>\n              <p id=\"recipeSub\"><\/p>\n            <\/div>\n            <ul class=\"ings\" id=\"ings\"><li class=\"ing-head\" aria-hidden=\"true\">% of flour<\/li><\/ul>\n            <div class=\"stats\">\n              <div class=\"stat\"><div class=\"label\">Total flour<\/div><div class=\"value\" id=\"totalFlour\"><\/div><\/div>\n              <div class=\"stat\"><div class=\"label\">Final hydration<\/div><div class=\"value\" id=\"finalHydration\"><\/div><\/div>\n            <\/div>\n            <div class=\"result-main\">\n              <span class=\"label\">Total dough<\/span>\n              <output class=\"total\" id=\"totalDough\" aria-live=\"polite\"><\/output>\n            <\/div>\n            <div class=\"actions\">\n              <button type=\"button\" class=\"primary\" id=\"copyBtn\">Copy<\/button>\n              <button type=\"button\" id=\"shareBtn\">Share<\/button>\n              <button type=\"button\" id=\"saveBtn\">Save<\/button>\n              <button type=\"button\" id=\"recipesBtn2\" class=\"phone-only\">Recipes<\/button>\n              <button type=\"button\" id=\"resetBtn\">Reset<\/button>\n            <\/div>\n          <\/div>\n        <\/aside>\n      <\/section>\n\n      <section class=\"panel plan\" id=\"plan\" aria-label=\"Bake plan\">\n        <h2>Bake plan<\/h2>\n        <div class=\"plan-controls\">\n          <label>Bake at <input type=\"datetime-local\" id=\"bakeAt\"><\/label>\n          <button type=\"button\" class=\"chip\" id=\"startNow\">Start now<\/button>\n        <\/div>\n        <p class=\"warn\" id=\"planWarn\" hidden><\/p>\n        <ol class=\"steps\" id=\"steps\"><\/ol>\n      <\/section>\n    <\/div>\n  <\/main>\n\n  <dialog id=\"saveDlg\">\n    <form method=\"dialog\" id=\"saveForm\">\n      <h3>Save recipe<\/h3>\n      <input type=\"text\" id=\"saveName\" maxlength=\"40\" placeholder=\"Name, e.g. Weekend country loaf\" aria-label=\"Recipe name\" required>\n      <div class=\"dlg-actions\">\n        <button type=\"button\" id=\"saveCancel\">Cancel<\/button>\n        <button type=\"submit\" class=\"primary\">Save<\/button>\n      <\/div>\n    <\/form>\n  <\/dialog>\n\n  <dialog id=\"recipesDlg\">\n    <h3>Saved recipes<\/h3>\n    <ul class=\"saved-list\" id=\"savedList\"><\/ul>\n    <div class=\"dlg-actions\"><button type=\"button\" class=\"primary\" id=\"recipesClose\">Close<\/button><\/div>\n  <\/dialog>\n\n  <div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n  <script>\n    \"use strict\";\n    const KEY = \"dough-ratio-assistant:v2\";\n    const OLD_KEY = \"dough-ratio-assistant:v1\";\n    const TIMER_KEY = \"dough-ratio-assistant:timers\";\n    const OZ = 28.3495;\n\n    const MODES = {\n      sourdough: { tab: \"Sourdough\", title: \"Sourdough bread\", one: \"loaf\", many: \"loaves\" },\n      instant: { tab: \"Instant yeast\", title: \"Instant yeast bread\", one: \"loaf\", many: \"loaves\" },\n      pizza: { tab: \"Pizza\", title: \"Neapolitan pizza\", one: \"ball\", many: \"balls\" }\n    };\n\n    const BASE = {\n      scaleBy: \"flour\", flour: 500, pieces: 1, total: 750, pieceWeight: 750,\n      hydration: 70, salt: 2, starterPct: 5, starterHyd: 100, yeastPct: 0.7\n    };\n    const MODE_DEFAULTS = {\n      sourdough: { ...BASE },\n      instant: { ...BASE },\n      pizza: { ...BASE, scaleBy: \"pieces\", pieces: 8, total: 2400, pieceWeight: 300, hydration: 64,\n               leaven: \"instant\", proof: \"nextDay\", yeastPct: 0.11, starterPct: 20 }\n    };\n    const PROOF = { sameDay: { yeastPct: 0.5, starterPct: 25 }, nextDay: { yeastPct: 0.11, starterPct: 20 } };\n\n    const WEIGHT_KEYS = new Set([\"flour\", \"total\", \"pieceWeight\"]);\n    function spec(mode, key) {\n      const pizza = mode === \"pizza\";\n      return {\n        flour:       { min: 10,  max: 10000, step: 25,  stepOz: 1,   dec: 0 },\n        pieces:      { min: 1,   max: 48,    step: 1,   stepOz: 1,   dec: 0 },\n        total:       { min: 100, max: 20000, step: 50,  stepOz: 2,   dec: 0 },\n        pieceWeight: { min: 50,  max: 3000,  step: 50,  stepOz: 1,   dec: 0 },\n        hydration:   pizza ? { min: 50, max: 80, step: 1, dec: 0 } : { min: 40, max: 100, step: 1, dec: 0 },\n        salt:        { min: 0,   max: 5,     step: 0.1, dec: 1 },\n        starterPct:  { min: 0,   max: 100,   step: 0.5, dec: 1 },\n        starterHyd:  { min: 50,  max: 200,   step: 5,   dec: 0 },\n        yeastPct:    { min: 0.01, max: 3,    step: pizza ? 0.01 : 0.05, dec: 2 }\n      }[key];\n    }\n\n    /* ---------------- helpers ---------------- */\n    const $ = (sel, root = document) => root.querySelector(sel);\n    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));\n    const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;\n    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);\n    const reduceMotion = matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n    const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };\n\n    function h(tag, props = {}, ...kids) {\n      const e = document.createElement(tag);\n      for (const [k, v] of Object.entries(props)) {\n        if (v == null || v === false) continue;\n        if (k === \"class\") e.className = v;\n        else if (k === \"text\") e.textContent = v;\n        else if (k.startsWith(\"on\")) e.addEventListener(k.slice(2), v);\n        else e.setAttribute(k, v === true ? \"\" : v);\n      }\n      for (const c of kids.flat()) if (c != null) e.append(c);\n      return e;\n    }\n\n    let toastTimer;\n    function toast(msg) {\n      const t = $(\"#toast\");\n      t.textContent = msg;\n      t.classList.add(\"show\");\n      clearTimeout(toastTimer);\n      toastTimer = setTimeout(() => t.classList.remove(\"show\"), 2200);\n    }\n\n    /* ---------------- state ---------------- */\n    function sanitize(mode, s) {\n      const d = MODE_DEFAULTS[mode];\n      const out = { ...d, ...s };\n      for (const key of Object.keys(d)) {\n        if (typeof d[key] === \"number\") {\n          const n = Number(out[key]);\n          const sp = spec(mode, key);\n          out[key] = Number.isFinite(n) ? clamp(n, sp.min, sp.max) : d[key];\n        }\n      }\n      if (![\"flour\", \"pieces\", \"total\"].includes(out.scaleBy)) out.scaleBy = d.scaleBy;\n      if (mode === \"pizza\") {\n        if (![\"instant\", \"sourdough\"].includes(out.leaven)) out.leaven = d.leaven;\n        if (!PROOF[out.proof]) out.proof = d.proof;\n      }\n      return out;\n    }\n\n    function loadState() {\n      const st = { mode: \"sourdough\", units: \"g\", byMode: {}, saved: [] };\n      for (const m of Object.keys(MODES)) st.byMode[m] = { ...MODE_DEFAULTS[m] };\n      try {\n        const raw = localStorage.getItem(KEY);\n        if (raw) {\n          const p = JSON.parse(raw);\n          if (MODES[p.mode]) st.mode = p.mode;\n          if (p.units === \"oz\") st.units = \"oz\";\n          for (const m of Object.keys(MODES)) st.byMode[m] = { ...st.byMode[m], ...(p.byMode && p.byMode[m]) };\n          if (Array.isArray(p.saved)) st.saved = p.saved.filter(x => x && MODES[x.mode]);\n        } else {\n          const old = JSON.parse(localStorage.getItem(OLD_KEY));\n          if (old) {\n            if (MODES[old.mode]) st.mode = old.mode;\n            for (const m of [\"sourdough\", \"instant\"]) if (old[m]) Object.assign(st.byMode[m], old[m]);\n            if (old.pizza) Object.assign(st.byMode.pizza, { pieces: old.pizza.balls, leaven: old.pizza.yeastType, proof: old.pizza.proof });\n          }\n        }\n      } catch {}\n      for (const m of Object.keys(MODES)) st.byMode[m] = sanitize(m, st.byMode[m]);\n      return st;\n    }\n\n    const state = loadState();\n    function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }\n\n    /* ---------------- calculation (everything is linear in flour) ---------------- */\n    const leavened = (m, s) => m === \"sourdough\" || (m === \"pizza\" && s.leaven === \"sourdough\");\n    const yeasted = (m, s) => m === \"instant\" || (m === \"pizza\" && s.leaven === \"instant\");\n\n    function calcAt(m, s, flour) {\n      const starter = leavened(m, s) ? flour * s.starterPct / 100 : 0;\n      const starterFlour = starter / (1 + s.starterHyd / 100);\n      const starterWater = starter - starterFlour;\n      const yeast = yeasted(m, s) ? flour * s.yeastPct / 100 : 0;\n      const totalFlour = flour + starterFlour;\n      const water = Math.max(0, totalFlour * s.hydration / 100 - starterWater);\n      const salt = totalFlour * s.salt / 100;\n      return { flour, starter, starterFlour, starterWater, yeast, totalFlour, water, salt, total: flour + starter + water + salt + yeast };\n    }\n\n    function compute(m, s) {\n      const ref = calcAt(m, s, 1000);\n      let k;\n      if (s.scaleBy === \"flour\") k = s.flour / 1000;\n      else k = (s.scaleBy === \"pieces\" ? s.pieces * s.pieceWeight : s.total) / ref.total;\n      const r = calcAt(m, s, 1000 * k);\n      r.finalHydration = (r.water + r.starterWater) / r.totalFlour * 100;\n      r.pieces = r.total / s.pieceWeight;\n      r.hasStarter = leavened(m, s);\n      r.hasYeast = yeasted(m, s);\n      return r;\n    }\n\n    /* ---------------- formatting ---------------- */\n    function fmtW(g) {\n      if (state.units === \"oz\") {\n        const o = g / OZ;\n        return (o < 1 ? o.toFixed(2) : o.toFixed(1)).replace(/\\.0+$/, \"\") + \" oz\";\n      }\n      if (g < 10) return (Math.round(g * 10) / 10).toLocaleString() + \" g\";\n      return Math.round(g).toLocaleString() + \" g\";\n    }\n    const fmtPct = v => Number(v.toFixed(1)).toLocaleString() + \"%\";\n    const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n    function fmtDur(min) {\n      if (min < 60) return min + \" min\";\n      const hr = Math.floor(min / 60), mm = min % 60;\n      return mm ? `${hr} h ${mm} min` : `${hr} h`;\n    }\n    function fmtWhen(d) {\n      const now = new Date();\n      const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n      const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - day0) / 864e5);\n      const day = diff === 0 ? \"Today\" : diff === 1 ? \"Tomorrow\" : diff === -1 ? \"Yesterday\" : d.toLocaleDateString([], { weekday: \"short\" });\n      return { day, time: d.toLocaleTimeString([], { hour: \"2-digit\", minute: \"2-digit\" }) };\n    }\n    const toLocalInput = d => {\n      const p = n => String(n).padStart(2, \"0\");\n      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;\n    };\n\n    /* animate numbers so changes are easy to notice */\n    function animateTo(el, to, fmt) {\n      const from = el._v == null ? to : el._v;\n      el._v = to;\n      cancelAnimationFrame(el._raf);\n      if (reduceMotion || from === to) { el.textContent = fmt(to); return; }\n      const t0 = performance.now(), dur = 150;\n      const tick = now => {\n        const p = Math.min(1, (now - t0) / dur);\n        el.textContent = fmt(from + (to - from) * (1 - (1 - p) ** 3));\n        if (p < 1) el._raf = requestAnimationFrame(tick);\n      };\n      el._raf = requestAnimationFrame(tick);\n    }\n\n    /* ---------------- controls ---------------- */\n    let refreshers = [];\n\n    function changed() {\n      saveState();\n      refreshers.forEach(fn => fn());\n      renderResults();\n    }\n\n    function structural() {\n      saveState();\n      renderControls();\n      renderResults();\n      renderPlan();\n    }\n\n    function makeField(key, label, opts = {}) {\n      const m = state.mode, s = state.byMode[m], sp = spec(m, key);\n      const weight = WEIGHT_KEYS.has(key), oz = weight && state.units === \"oz\";\n      const conv = oz ? OZ : 1, dec = oz ? 1 : sp.dec, step = oz ? sp.stepOz : sp.step;\n      const unit = weight ? (oz ? \"oz\" : \"g\") : (opts.unit || \"\");\n      const input = h(\"input\", { type: \"text\", inputmode: \"decimal\", id: \"f-\" + key, autocomplete: \"off\", enterkeyhint: \"done\", \"aria-label\": label });\n      const show = () => { input.value = fmtNum(s[key] / conv, dec); input.removeAttribute(\"aria-invalid\"); };\n\n      const setDisplay = v => {\n        const lo = sp.min / conv, hi = sp.max / conv;\n        s[key] = round(clamp(v, lo, hi) * conv, 3);\n      } ick\", () => { renderSaved(); $(\"#recipesDlg\").showModal(); });\n    $(\"#recipesClose\").addEventListener(\"click\", () => $(\"#recipesDlg\").close());\n    $(\"#bakeAt\").addEventListener(\"change\", e => {\n      const d = new Date(e.target.value);\n      if (!isNaN(d)) { bakeAt = d; planAnchor = \"fixed\"; renderPlan(); }\n    });\n    $(\"#startNow\").addEventListener(\"click\", () => { planAnchor = \"now\"; renderPlan(); });\n\n    window.DoughRatioAssistant = { compute, calcAt, planSteps, MODE_DEFAULTS, sanitize };\n\n    renderControls();\n    renderResults();\n    renderPlan();\n  <\/script>\n<\/body>\n<\/html>\n"}, {"id": "scrub-rams", "name": "Rams, panel", "group": "Rams, five iterations (Bread and Pizza tabs, saved recipes)", "blurb": "The first Rams: warm grey panels, thin numerals, one orange accent.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */\n  main { padding-bottom: 48px; }\n  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); }\n  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }\n  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }\n  #dl { font-size: 0.875rem; font-weight: 600; }\n  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }\n  #dbody[hidden] { display: none; }\n  #dsave { display: flex; gap: 8px; }\n  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }\n  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }\n  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }\n  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }\n  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }\n  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }\n  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }\n  #dnote[hidden] { display: none; }\n  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }\n\n  :root { color-scheme: light dark; --bg: #e6e3db; --panel: #f3f1eb; --ink: #1d1d1b; --mid: #86827a; --line: #cdc9be; --accent: #e4531c; --on-accent: #ffffff; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #141412; --panel: #1f1f1c; --ink: #eceae3; --mid: #8d897f; --line: #2d2d29; --accent: #ff6a2b; --on-accent: #141412; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.2 \"Helvetica Neue\", Helvetica, Arial, system-ui, sans-serif; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 48px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n  #tabs button { height: 44px; border: 0; border-radius: 12px; background: var(--panel); color: var(--mid); font-size: 0.875rem; font-weight: 500; }\n  #tabs button[aria-selected=\"true\"] { background: var(--ink); color: var(--bg); }\n  #tabs button[aria-selected=\"true\"]::before { content: \"\"; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }\n  #bar { display: flex; height: 8px; gap: 3px; margin: 2px 4px; }\n  #bar span { font-size: 0; padding: 0; border-radius: 4px; min-width: 4px; transition: flex-grow 150ms ease-out; }\n  #bar span[data-id=\"flour\"] { background: var(--ink); } #bar span[data-id=\"water\"] { background: var(--accent); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: var(--mid); } #bar span[data-id=\"salt\"] { background: var(--line); }\n  #inputs { display: grid; gap: 6px; }\n  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 8px; padding: 10px 14px 0; background: var(--panel); border-radius: 16px; overflow: hidden; }\n  .in .lab { align-self: start; font-size: 0.875rem; color: var(--mid); font-weight: 500; }\n  .in .pre { display: flex; gap: 6px; margin-top: 6px; }\n  .in .pre button { height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 0.8125rem; color: var(--mid); }\n  .in .pre button[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 52px; font-weight: 300; font-size: 54px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; }\n  .num small { font-size: 1.0625rem; letter-spacing: 0; color: var(--mid); font-weight: 400; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; border: 0; border-bottom: 2px solid var(--accent); text-align: right; padding: 0 2px; }\n  .ruler { grid-column: 1 / -1; height: 14px; margin: 2px -14px 0; position: relative; opacity: 0.5; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: 0; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 12px; background: var(--panel); }\n  #choices button { height: 38px; border: 0; border-radius: 9px; background: none; font-size: 0.8125rem; color: var(--mid); }\n  #choices button[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }\n  #out .cell { padding: 8px 14px; background: var(--panel); border-radius: 14px; }\n  #out .cell small { display: block; font-size: 0.8125rem; color: var(--mid); }\n  #out .cell b { display: block; margin-top: 2px; font-weight: 300; font-size: 30px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }\n  #out .total { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); padding: 10px 16px; }\n  #out .total small { color: var(--on-accent); opacity: 0.8; } #out .total b { font-size: 52px; }\n  #plan { margin: 0; padding: 0 4px; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; }\n  #drawer { border-top: 0; background: var(--panel); box-shadow: 0 -1px 0 var(--line); border-radius: 20px 20px 0 0; }\n  #dname, #dgo, #dlist li, #dlist button { border-radius: 12px; }\n\n  #tabs { grid-template-columns: repeat(2, 1fr); }\n  #choices .grp:only-child { grid-column: 1 / -1; }\n  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }\n  .in .pre { margin-top: 0; }\n  .num { min-height: 44px; }\n  /* one-screen fit: Bread and Pizza share the phone height with the choice row and the recipe handle */\n  main { gap: 6px !important; padding-top: 8px !important; }\n  #tabs button { height: 40px !important; }\n  .num { min-height: 40px !important; font-size: 44px !important; }\n  .num small { font-size: 0.9375rem !important; }\n  .ruler { height: 12px !important; margin-top: 2px !important; }\n  .in { padding-top: 6px !important; }\n  #choices button { height: 36px !important; }\n  #out { gap: 6px !important; }\n  #out .cell { padding-top: 5px !important; padding-bottom: 5px !important; }\n  #out .cell b { font-size: 26px !important; }\n  #out .total { padding-top: 6px !important; padding-bottom: 6px !important; }\n  #out .total b { font-size: 44px !important; }\n  #out .cell[data-id=\"hyd\"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px !important; border: 0 !important; box-shadow: none !important; background: none !important; color: var(--mid) !important; }\n  #out .cell[data-id=\"hyd\"] small { color: var(--mid) !important; } #out .cell[data-id=\"hyd\"] b { font-size: 18px !important; margin: 0 !important; color: var(--ink) !important; font-family: inherit !important; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () ult(); const m = Dough.model();\n    const name = $(\"#dname\").value.trim() || (m.title + \", \" + Dough.fmtVal(m.fields[0]));\n    Dough.recipes.save(name); $(\"#dname\").value = \"\"; vib(10);\n    $(\"#dl\").textContent = Dough.recipes.persistent() ? \"Saved\" : \"Saved for this session\"; clearTimeout(flash); flash = setTimeout(() => draw(Dough.recipes.list()), 1500);\n  });\n  function draw(list) {\n    $(\"#dl\").textContent = list.length ? `Recipes (${list.length})` : \"Recipes\";\n    $(\"#dnote\").hidden = Dough.recipes.persistent();\n    const ul = $(\"#dlist\"); ul.replaceChildren();\n    if (!list.length) { const li = document.createElement(\"li\"); li.className = \"empty\"; li.textContent = \"No saved recipes.\"; ul.append(li); return; }\n    list.forEach(r => {\n      const li = document.createElement(\"li\");\n      const t = document.createElement(\"div\"); const b = document.createElement(\"b\"); b.textContent = r.name; const s = document.createElement(\"span\"); s.textContent = Dough.recipes.summary(r.snap); t.append(b, s);\n      const load = document.createElement(\"button\"); load.type = \"button\"; load.className = \"load\"; load.textContent = \"Load\"; load.setAttribute(\"aria-label\", \"Load \" + r.name);\n      load.onclick = () => { Dough.recipes.load(r.id); setOpen(false); vib(10); };\n      const del = document.createElement(\"button\"); del.type = \"button\"; del.textContent = confirmId === r.id ? \"Sure?\" : \"Delete\"; del.setAttribute(\"aria-label\", \"Delete \" + r.name);\n      del.onclick = () => { if (confirmId === r.id) { confirmId = null; Dough.recipes.remove(r.id); } else { confirmId = r.id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; draw(Dough.recipes.list()); }, 2500); draw(Dough.recipes.list()); } };\n      li.append(t, load, del); ul.append(li);\n    });\n  }\n  Dough.recipes.subscribe(draw);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "rams-radio", "name": "Rams, radio", "group": "Rams,
