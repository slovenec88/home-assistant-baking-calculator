<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dough Calculator</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f1e8; --ink: #1f1c16; --muted: #7b7566; --line: #ddd6c6; --derived: #5b6b5e; --accent: #b4411f; --petal: #fffdf7; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131210; --ink: #f0eadb; --muted: #9a9384; --line: #2f2d27; --derived: #9fb5a3; --accent: #f08a5c; --petal: #26241f; --on: #1a1008; } }
  * { box-sizing: border-box; }
  html, body { overscroll-behavior: none; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #app { width: min(480px, 100%); margin: 0 auto; padding: 0 16px 12px; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px auto auto auto; gap: 4px; align-content: start; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  #tabs button { border: 0; background: none; color: var(--muted); font-size: 1.0625rem; font-weight: 500; border-bottom: 3px solid transparent; }
  #tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
  #rows { display: grid; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px; min-height: 64px; border-bottom: 1px solid var(--line); transition: opacity 150ms ease-out; }
  .row .n { color: var(--muted); font-size: 1.0625rem; font-weight: 500; }
  .row .v { font: 700 44px/1 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; align-self: center; }
  .row .v small { font-size: 1rem; letter-spacing: 0; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .row.in .v { color: var(--ink); } .row.out .v { color: var(--derived); }
  .row.tot { border-bottom: 0; } .row.tot .v { font-size: 56px; color: var(--ink); }
  body.rose .row:not(.hot) { opacity: 0.3; }
  .hold { color: var(--muted); font-size: 0.875rem; text-align: center; margin: 2px 0; }
  #choices { display: flex; justify-content: center; gap: 8px; align-items: baseline; font-size: 1.125rem; min-height: 46px; }
  #choices button { border: 0; background: none; padding: 6px 4px; color: var(--accent); font-weight: 700; border-bottom: 2px dotted var(--accent); }
  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }
  #ov { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 30; }
  #ov text { font-family: inherit; }
  .petal circle { fill: var(--petal); stroke: var(--line); stroke-width: 1.5; }
  .petal.on circle { fill: var(--accent); stroke: var(--accent); }
  .petal text { fill: var(--ink); font-size: 12px; font-weight: 700; text-anchor: middle; }
  .petal.on text { fill: var(--on); }
  #live { fill: var(--ink); font: 700 40px ui-monospace, "SF Mono", Consolas, monospace; text-anchor: middle; }
  #liveL { fill: var(--muted); font-size: 13px; font-weight: 600; text-anchor: middle; }
  .pre circle { fill: var(--petal); stroke: var(--accent); stroke-width: 2; pointer-events: all; cursor: pointer; }
  .pre text { fill: var(--ink); font-size: 14px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .pre.on circle { fill: var(--accent); } .pre.on text { fill: var(--on); }
</style>
</head>
<body>
<main id="app">
  <nav id="tabs"></nav>
  <section id="rows" aria-live="polite"></section>
  <div id="choices"></div>
  <p class="hold">hold anywhere to change a value</p>
  <p id="plan"></p>
</main>
<svg id="ov" aria-hidden="true"></svg>
<script>
/* Shared core: the original calculator maths and saved state, behind a small API.
   Every concept below only draws a different interface on top of this. */
const Dough = (() => {
  const STORAGE_KEY = "dough-ratio-assistant:v1";
  const DEFAULTS = {
    mode: "sourdough",
    sourdough: { flour: 500, hydration: 70, starterPct: 5 },
    instant: { flour: 500, hydration: 70 },
    pizza: { balls: 8, hydration: 64, yeastType: "instant", proof: "nextDay", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }
  };
  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };
  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };

  /* ---- original calculations, unchanged ---- */
  function calculateSourdough({ flour, hydration, starterPct }) {
    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;
    const totalFlour = flour + starterFlour;
    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);
    const salt = totalFlour * 0.02;
    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculateInstant({ flour, hydration }) {
    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;
    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };
  }
  function calculatePizzaInstant({ balls, hydration, yeastPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;
    const flour = target / (1 + h + s + y);
    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };
  }
  function calculatePizzaSourdough({ balls, hydration, starterPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;
    const totalFlour = target / (1 + h + s);
    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;
    const water = Math.max(0, totalFlour * h - starterWater);
    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculatePizza(p) {
    return p.yeastType === "sourdough"
      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })
      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });
  }
  function bakeManualText(mode, p) {
    if (mode === "pizza") {
      if (p.yeastType === "instant" && p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      if (p.yeastType === "instant") return "Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.";
      if (p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      return "Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.";
    }
    if (mode === "sourdough") return "Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.";
    return "Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.";
  }

  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const sp = saved && saved.pizza;
      return {
        ...DEFAULTS, ...saved,
        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },
        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },
        pizza: {
          ...DEFAULTS.pizza,
          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,
          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,
          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,
          hydration: DEFAULTS.pizza.hydration,
          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }
        }
      };
    } catch { return structuredClone(DEFAULTS); }
  }
  let state = loadState();
  if (!["sourdough", "instant", "pizza"].includes(state.mode)) state.mode = "sourdough";
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));
    } catch {}
  }

  /* ---- field specs: what the UI may edit, with limits and presets ---- */
  const SPEC = {
    flour:          { label: "Flour",        unit: "g", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },
    hydration:      { label: "Hydration",    unit: "%", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },
    starterPct:     { label: "Starter",      unit: "%", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },
    balls:          { label: "Dough balls",  unit: "",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },
    pizzaHydration: { label: "Hydration",    unit: "%", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },
    yeastPct:       { label: "Yeast",        unit: "%", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }
  };
  const CHOICES = {
    yeastType: { label: "Leavening", options: [["instant", "Instant yeast"], ["sourdough", "Sourdough"]] },
    proof:     { label: "Proofing",  options: [["sameDay", "Same day"], ["nextDay", "Next day"]] }
  };
  const MODES = [["sourdough", "Sourdough"], ["instant", "Instant yeast"], ["pizza", "Pizza"]];
  const MODE_TITLE = { sourdough: "Sourdough bread", instant: "Instant yeast bread", pizza: "Neapolitan pizza" };

  function breadValues() {
    const cur = state[state.mode];
    return {
      flour: clampNumber(cur.flour, 1, 10000, 500),
      hydration: clampNumber(cur.hydration, 40, 100, 70),
      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)
    };
  }
  function pizzaValues() {
    const p = state.pizza;
    return {
      balls: clampNumber(p.balls, 1, 48, 8),
      hydration: clampNumber(p.hydration, 50, 80, 64),
      yeastType: p.yeastType === "sourdough" ? "sourdough" : "instant",
      proof: p.proof === "sameDay" ? "sameDay" : "nextDay",
      instantYeastPct: {
        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),
        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)
      }
    };
  }

  function fieldKeys() {
    if (state.mode === "pizza") return ["balls", "pizzaHydration"].concat(pizzaValues().yeastType === "instant" ? ["yeastPct"] : []);
    return state.mode === "sourdough" ? ["flour", "hydration", "starterPct"] : ["flour", "hydration"];
  }
  function valueOf(key) {
    if (state.mode === "pizza") {
      const p = pizzaValues();
      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];
    }
    return breadValues()[key];
  }

  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */
  function timeline(mode, p) {
    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + " h" : ""), fridge: !!fridge });
    if (mode === "sourdough") return [T("Mix"), T("Rest", 4), T("Basket"), T("Bake")];
    if (mode === "instant") return [T("Mix"), T("Rest", 1.5, "1-2 h"), T("Basket"), T("Bake")];
    const sd = p.yeastType === "sourdough", next = p.proof === "nextDay";
    if (!next) return [T("Mix"), T("Rest", 4), T("Divide"), T("Double"), T("Bake")];
    if (!sd) return [T("Mix"), T("Chill", 24, "24 h", true), T("Rest", 2), T("Divide"), T("Double"), T("Bake")];
    return [T("Mix"), T("Rest", 2), T("Divide"), T("Chill", 24, "24 h", true), T("Double"), T("Bake")];
  }

  function model() {
    const mode = state.mode, pizza = mode === "pizza";
    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();
    const r = pizza ? calculatePizza(p) : mode === "sourdough" ? calculateSourdough(v) : calculateInstant(v);
    const hasStarter = pizza ? p.yeastType === "sourdough" : mode === "sourdough";
    const hasYeast = pizza ? p.yeastType === "instant" : mode === "instant";
    const parts = [{ id: "flour", label: "Flour", g: pizza ? r.flour : v.flour }, { id: "water", label: "Water", g: r.water }];
    if (hasStarter) parts.push({ id: "starter", label: "Starter", g: r.starter });
    if (hasYeast) parts.push({ id: "yeast", label: "Yeast", g: r.yeast });
    parts.push({ id: "salt", label: "Salt", g: r.salt });
    return {
      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,
      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),
      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],
      plan: bakeManualText(mode, p),
      timeline: timeline(mode, p),
      pieces: pizza ? p.balls : null
    };
  }

  const subs = new Set();
  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };

  function set(key, raw) {
    const sp = SPEC[key];
    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));
    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;
    if (key === "balls") state.pizza.balls = val;
    else if (key === "pizzaHydration") state.pizza.hydration = val;
    else if (key === "yeastPct") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }
    else if (key === "starterPct") state.sourdough.starterPct = val;
    else state[state.mode][key] = val;
    emit();
  }
  function choose(key, val) {
    if (key === "mode") state.mode = val;
    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }
    emit();
  }

  /* ---- formatting ---- */
  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + " g";
  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));
  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === "g" ? " g" : f.unit) : "");

  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */
  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };
  function drag(el, { key, axis = "x", pxPerStep = 10, onTap, onStart, onEnd, target }) {
    let start = null;
    el.style.touchAction = axis === "x" ? "pan-y" : "pan-x";
    el.addEventListener("pointerdown", e => {
      if (e.button) return;
      const k = typeof key === "function" ? key(e) : key;
      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };
      try { el.setPointerCapture(e.pointerId); } catch {}
      onStart && onStart(k, e);
    });
    el.addEventListener("pointermove", e => {
      if (!start || e.pointerId !== start.id || !start.k) return;
      const d = axis === "x" ? e.clientX - start.x : start.y - e.clientY;
      if (!start.moved && Math.abs(d) < 5) return;
      start.moved = true;
      const steps = Math.round(d / pxPerStep(start.k));
      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }
    });
    const end = e => {
      if (!start || e.pointerId !== start.id) return;
      const s = start; start = null;
      if (!s.moved && e.type === "pointerup") onTap && onTap(s.k, e);
      onEnd && onEnd(s.k, s.moved);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);
  return { model, set, choose, step, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },
           api: { calculateSourdough, calculateInstant, calculatePizza } };
})();
window.DoughRatioAssistant = Dough.api;

/* ---- Game helpers for the canvas concepts ---- */
const Game = (() => {
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };
  // critically damped-ish spring on o[key]; velocity kept in o[key + "V"]
  function spring(o, key, target, dt, k = 220, d = 22) {
    const v = (o[key + "V"] || 0) + (target - o[key]) * k * dt;
    o[key + "V"] = v * Math.max(0, 1 - d * dt);
    o[key] += o[key + "V"] * dt;
    return o[key];
  }
  function canvas(el, draw) {
    const ctx = el.getContext("2d");
    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;
    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }
    new ResizeObserver(resize).observe(el); resize();
    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }
    raf = requestAnimationFrame(frame);
    document.addEventListener("visibilitychange", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });
    return { ctx, size: () => ({ w, h }) };
  }
  function pointer(el, hd) {
    el.style.touchAction = "none";
    const pos = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    el.addEventListener("pointerdown", e => { if (e.button) return; try { el.setPointerCapture(e.pointerId); } catch {} hd.down && hd.down(...pos(e), e); });
    el.addEventListener("pointermove", e => { hd.move && hd.move(...pos(e), e); });
    const up = e => { hd.up && hd.up(...pos(e), e); };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  }
  // simple particle pool
  function particles() {
    const ps = [];
    return {
      burst(x, y, n, o = {}) { for (let i = 0; i < n; i++) { const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2), s = (o.speed ?? 120) * (0.4 + Math.random() * 0.8); ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: (o.life ?? 0.7) * (0.6 + Math.random() * 0.6), r: (o.r ?? 3) * (0.6 + Math.random() * 0.8), c: o.color || "#fff", g: o.gravity ?? 300 }); } },
      update(dt) { for (let i = ps.length - 1; i >= 0; i--) { const p = ps[i]; p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life >= p.max) ps.splice(i, 1); } },
      draw(ctx) { for (const p of ps) { ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); } ctx.globalAlpha = 1; }
    };
  }
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return { clamp, lerp, ease, spring, canvas, pointer, particles, css };
})();

/* ---- Accessibility layer for canvas concepts: every field and choice as real, visually hidden controls ---- */
Dough.a11y = function () {
  const st = document.createElement("style");
  st.textContent = ".dough-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.dough-sr:focus-within{position:fixed;left:8px;right:8px;bottom:8px;width:auto;height:auto;clip:auto;white-space:normal;background:#fff;color:#000;border:2px solid #000;border-radius:12px;padding:10px;z-index:1000;display:grid;gap:8px;font:16px system-ui}.dough-sr label{display:grid;gap:2px}.dough-sr input,.dough-sr button{font:inherit;min-height:40px}";
  document.head.append(st);
  const root = document.createElement("div"); root.className = "dough-sr"; root.setAttribute("role", "group"); root.setAttribute("aria-label", "Dough calculator controls"); document.body.append(root);
  const live = document.createElement("div"); live.setAttribute("aria-live", "polite");
  let sig = "";
  Dough.subscribe(m => {
    const s = m.mode + m.fields.map(f => f.key).join() + m.choices.map(c => c.key).join();
    if (s !== sig) {
      sig = s; root.replaceChildren();
      const modes = document.createElement("div");
      Dough.modes.forEach(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.setAttribute("aria-pressed", String(m.mode === v)); b.onclick = () => Dough.choose("mode", v); modes.append(b); });
      root.append(modes);
      m.fields.forEach(f => { const lab = document.createElement("label"); lab.textContent = `${f.label} (${f.unit || "count"})`; const i = document.createElement("input"); i.type = "number"; i.min = f.min; i.max = f.max; i.step = f.step; i.dataset.key = f.key; i.addEventListener("change", () => Dough.set(f.key, parseFloat(i.value))); lab.append(i); root.append(lab); });
      m.choices.forEach(c => { const g = document.createElement("div"); g.setAttribute("role", "group"); g.setAttribute("aria-label", c.label); c.options.forEach(([v, l]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = l; b.dataset.k = c.key; b.dataset.v = v; b.onclick = () => Dough.choose(c.key, v); g.append(b); }); root.append(g); });
      root.append(live);
    }
    m.fields.forEach(f => { const i = root.querySelector(`input[data-key="${f.key}"]`); if (i && document.activeElement !== i) i.value = f.value; });
    m.choices.forEach(c => root.querySelectorAll(`button[data-k="${c.key}"]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === c.value))));
    root.querySelectorAll("div > button:not([data-k])").forEach((b, i) => b.setAttribute("aria-pressed", String(Dough.modes[i] && Dough.modes[i][0] === m.mode)));
    live.textContent = `${m.title}. Total dough ${Dough.fmtG(m.total)}. ` + m.parts.map(p => `${p.label} ${Dough.fmtG(p.g)}`).join(", ") + ".";
  });
};

/* ---- Shared UI helpers: mode tabs, results table, plan line (styled with the concept's --ink, --muted, --line vars) ---- */
Dough.ui = (() => {
  const css = ".dough-res{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;color:var(--ink)}.dough-res .l{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}.dough-res .l span:last-child{font-weight:600;font-variant-numeric:tabular-nums}.dough-res .tot{grid-column:1/-1;border:0;padding-top:6px}.dough-res .tot span:first-child{font-size:1.125rem}.dough-res .tot span:last-child{font:700 40px/1 ui-monospace,'SF Mono',Consolas,monospace;letter-spacing:-.03em}";
  let injected = false;
  const inject = () => { if (injected) return; injected = true; const s = document.createElement("style"); s.textContent = css; document.head.append(s); };
  const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
  return {
    el,
    tabs(root) { Dough.subscribe(m => { root.setAttribute("role", "tablist"); root.replaceChildren(...Dough.modes.map(([v, l]) => { const b = el("button", null, l); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", String(m.mode === v)); b.onclick = () => Dough.choose("mode", v); return b; })); }); },
    results(root, opts = {}) {
      inject(); root.classList.add("dough-res"); root.setAttribute("aria-live", "polite");
      Dough.subscribe(m => {
        root.replaceChildren();
        m.parts.filter(p => opts.flour || m.mode === "pizza" || p.id !== "flour").forEach(p => { const d = el("div", "l"); d.append(el("span", null, p.label === "Yeast" ? "Instant yeast" : p.label), el("span", null, Dough.fmtG(p.g))); root.append(d); });
        const h = el("div", "l"); h.append(el("span", null, "Final hydration"), el("span", null, Dough.fmtNum(m.finalHydration, 1) + "%")); root.append(h);
        const t = el("div", "l tot"); t.append(el("span", null, "Total dough"), el("span", null, Dough.fmtG(m.total))); root.append(t);
      });
    },
    plan(root) { Dough.subscribe(m => { root.textContent = m.plan; }); },
    // field range used to turn a value into a position on a dial or rail (flour is logarithmic)
    range: { flour: { min: 100, max: 5000, log: true }, hydration: { min: 40, max: 100 }, starterPct: { min: 0, max: 30 }, balls: { min: 1, max: 24 }, pizzaHydration: { min: 50, max: 80 }, yeastPct: { min: 0.01, max: 1 } },
    toT(k, v) { const r = this.range[k]; const t = r.log ? Math.log(Math.max(v, r.min) / r.min) / Math.log(r.max / r.min) : (v - r.min) / (r.max - r.min); return Math.min(1, Math.max(0, t)); },
    toV(k, t) { const r = this.range[k]; return r.log ? r.min * Math.pow(r.max / r.min, t) : r.min + (r.max - r.min) * t; }
  };
})();

</script>
<script>
(() => {
  const $ = s => document.querySelector(s), U = Dough.ui, NS = "http://www.w3.org/2000/svg";
  const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
  const S = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  U.tabs($("#tabs")); U.plan($("#plan")); Dough.a11y();
  const PART_FIELD = { flour: ["flour", "balls"], water: ["hydration", "pizzaHydration"], starter: ["starterPct"], yeast: ["yeastPct"] };
  let m = null, st = null, holdTimer = null, presetRing = null;   // st: the gesture in progress
  const field = k => m.fields.find(f => f.key === k);

  Dough.subscribe(model => {
    m = model;
    const rows = $("#rows"); rows.replaceChildren();
    m.parts.forEach(p => {
      const fk = (PART_FIELD[p.id] || []).find(k => field(k));
      const isIn = m.mode === "pizza" ? false : p.id === "flour";
      const r = document.createElement("div"); r.className = "row " + (fk ? "in" : "out"); r.dataset.part = p.id; if (fk) r.dataset.key = fk;
      const n = document.createElement("span"); n.className = "n"; n.textContent = p.label === "Yeast" ? "Instant yeast" : p.label;
      const v = document.createElement("span"); v.className = "v"; v.textContent = Dough.fmtG(p.g).replace(" g", ""); const u = document.createElement("small"); u.textContent = "g"; v.append(u);
      r.append(n, v); rows.append(r);
    });
    const t = document.createElement("div"); t.className = "row tot"; t.innerHTML = '<span class="n">Total dough</span><span class="v"></span>'; t.querySelector(".v").textContent = Dough.fmtG(m.total).replace(" g", ""); const u = document.createElement("small"); u.textContent = "g"; t.querySelector(".v").append(u); rows.append(t);
    const ch = $("#choices"); ch.replaceChildren();
    if (m.mode === "pizza") {
      m.choices.forEach((c, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = c.options.find(o => o[0] === c.value)[1].toLowerCase(); b.setAttribute("aria-label", `${c.label}: ${b.textContent}. Tap to change.`); b.onclick = () => { const j = c.options.findIndex(o => o[0] === c.value); Dough.choose(c.key, c.options[(j + 1) % 2][0]); vib(10); }; ch.append(b); if (i === 0) ch.append(document.createTextNode("·")); });
    } else {
      const s = document.createElement("span"); s.style.color = "var(--muted)"; s.textContent = `${Dough.fmtNum(m.finalHydration, 1)}% hydration`; ch.append(s);
    }
    // keep the active row lit while a gesture is open, and the live value current
    if (st && st.key) { heat(st.key); updateLive(); } else if (presetRing) heat(presetRing.key);
  });

  /* ---- the rose ---- */
  const ov = $("#ov");
  const rowAt = (x, y) => { const el = document.elementFromPoint(x, y); const r = el && el.closest && el.closest(".row"); return r && r.dataset.key ? r : null; };
  const petalAngle = (i, n) => -Math.PI / 2 + (2 * Math.PI * i) / n;

  function showRose(x, y) {
    ov.replaceChildren(); document.body.classList.add("rose");
    const n = m.fields.length; st.petals = m.fields.map((f, i) => ({ key: f.key, a: petalAngle(i, n), f }));
    st.g = S("g"); ov.append(st.g);
    st.petals.forEach(p => {
      const px = x + Math.cos(p.a) * 74, py = y + Math.sin(p.a) * 74;
      const g = S("g", { class: "petal", transform: `translate(${px} ${py}) scale(0.6)` }); g.append(S("circle", { r: 36 }), S("text", { y: 4 }, p.key === "balls" ? "Balls" : p.f.label));
      st.g.append(g); p.el = g; p.px = px; p.py = py;
      requestAnimationFrame(() => { g.style.transition = "transform 180ms cubic-bezier(.3,1.5,.5,1)"; g.setAttribute("transform", `translate(${px} ${py}) scale(1)`); });
    });
    st.g.append(S("circle", { cx: x, cy: y, r: 6, fill: "var(--accent)" }));
    st.live = S("text", { id: "live", x, y: y - 130 }); st.liveL = S("text", { id: "liveL", x, y: y - 160 });
    ov.append(st.liveL, st.live);
    vib(8);
  }
  function hideRose() { ov.replaceChildren(); document.body.classList.remove("rose"); document.querySelectorAll(".row.hot").forEach(r => r.classList.remove("hot")); }
  function updateLive() {
    if (!st || !st.key) { return; } const f = field(st.key);
    st.live.textContent = Dough.fmtNum(f.value, f.dec) + (f.unit ? " " + f.unit : ""); st.liveL.textContent = f.label;
  }
  function heat(key) { document.querySelectorAll(".row").forEach(r => r.classList.toggle("hot", r.dataset.key === key)); }

  function openPresets(x, y, key) {
    hideRose(); presetRing = { key }; document.body.classList.add("rose"); heat(key);
    const f = field(key); const n = f.presets.length; if (!n) { presetRing = null; hideRose(); return; }
    f.presets.forEach((p, i) => {
      const a = -Math.PI / 2 + (i - (n - 1) / 2) * 0.9, px = x + Math.cos(a) * 86, py = y + Math.sin(a) * 86;
      const g = S("g", { class: "pre" + (p === f.value ? " on" : ""), transform: `translate(${px} ${py})` }); g.append(S("circle", { r: 30 }), S("text", { y: 5 }, String(p) + (f.unit === "g" ? " g" : f.unit)));
      g.addEventListener("pointerup", e => { e.stopPropagation(); Dough.set(key, p); vib(10); closePresets(); });
      ov.append(g);
    });
    ov.style.pointerEvents = "auto";
    ov.addEventListener("pointerdown", closeOnOutside);
  }
  function closeOnOutside(e) { if (!e.target.closest || !e.target.closest(".pre")) closePresets(); }
  function closePresets() { presetRing = null; ov.style.pointerEvents = "none"; ov.removeEventListener("pointerdown", closeOnOutside); hideRose(); }

  document.addEventListener("pointerdown", e => {
    if (e.button || presetRing || e.target.closest("#tabs") || e.target.closest("#choices button")) return;
    st = { id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now(), state: "wait", key: null, steps: 0, last: 0, acc: 0 };
    const row = rowAt(e.clientX, e.clientY); st.row = row;
    holdTimer = setTimeout(() => { if (st && st.state === "wait") { st.state = "rose"; showRose(st.x, st.y); } }, 250);
  });
  document.addEventListener("pointermove", e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (st.state === "wait" && Math.hypot(dx, dy) > 8) { clearTimeout(holdTimer); st = null; return; }   // a scroll or graze, not a hold
    if (st.state === "rose") {
      const r = Math.hypot(dx, dy);
      if (r < 28) { if (st.key) { Dough.set(st.key, st.start); st.key = null; st.petals.forEach(p => p.el.classList.remove("on")); document.querySelectorAll(".row.hot").forEach(x => x.classList.remove("hot")); st.live.textContent = ""; st.liveL.textContent = ""; } return; }
      if (!st.key && r > 44) {
        const a = Math.atan2(dy, dx); let best = null, bd = 9; st.petals.forEach(p => { let d = Math.abs(((a - p.a + Math.PI * 3) % (2 * Math.PI)) - Math.PI); if (d < bd) { bd = d; best = p; } });
        if (best && bd < 0.9) { st.key = best.key; st.start = field(best.key).value; st.last = a; st.acc = 0; st.rotated = false; best.el.classList.add("on"); heat(best.key); vib(6); updateLive(); }
      }
      if (st.key) {
        const a = Math.atan2(dy, dx); let d = a - st.last; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; st.last = a;
        const f = field(st.key), deg = 12 + r / 10;               // farther from the centre = finer gearing
        st.acc += d * 180 / Math.PI;
        const steps = Math.trunc(st.acc / deg);
        if (steps !== 0) { st.acc -= steps * deg; st.steps += steps; st.rotated = true; Dough.set(st.key, field(st.key).value + steps * f.drag); vib(5); updateLive(); }
      }
    }
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return; clearTimeout(holdTimer); const s = st; st = null;
    if (s.state === "wait") {
      // a plain tap on an editable row opens its presets
      if (s.row && performance.now() - s.t0 < 250) openPresets(s.x, s.y, s.row.dataset.key);
      return;
    }
    if (s.state === "rose") {
      const cx = s.x, cy = s.y;
      if (s.key && !s.rotated) { openPresets(cx, cy - 20, s.key); return; }   // lifted on a petal without turning: show its presets
      hideRose();
    }
  };
  document.addEventListener("pointerup", end); document.addEventListener("pointercancel", end);
  document.addEventListener("contextmenu", e => e.preventDefault());
})();
</script>
