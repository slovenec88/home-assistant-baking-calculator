<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dough Calculator</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #6750a4;
      --primary-container: #eaddff;
      --on-primary-container: #21005d;
      --secondary-container: #e8def8;
      --on-secondary-container: #1d192b;
      --water: #5b8fe0;
      --flour: #e0b82e;
      --starter: #b9835a;
      --yeast: #c06c84;
      --salt: #8e8a96;
      --ink: #1d1b20;
      --muted: #49454f;
      --line: #cac4d0;
      --paper: #fffbfe;
      --card: #fffbfe;
      --field: #ece6f0;
      --stat: #f3edf7;
      --warn: #b3261e;
      --focus-ring: rgba(103, 80, 164, 0.18);
      --shadow: 0 1px 2px rgba(29, 27, 32, 0.10), 0 1px 3px rgba(29, 27, 32, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #d0bcff;
        --primary-container: #4f378b;
        --on-primary-container: #eaddff;
        --secondary-container: #4a4458;
        --on-secondary-container: #e8def8;
        --water: #7fa8ee;
        --flour: #e8c85a;
        --starter: #d09a70;
        --yeast: #d98ba3;
        --salt: #a7a2b0;
        --ink: #e6e1e5;
        --muted: #cac4d0;
        --line: #49454f;
        --paper: #141218;
        --card: #211f26;
        --field: #2b2930;
        --stat: #2b2930;
        --warn: #f2b8b5;
        --focus-ring: rgba(208, 188, 255, 0.22);
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--paper);
    }

    button, input, select { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { color: inherit; outline: none; user-select: none; touch-action: manipulation; cursor: pointer; }
    button:focus-visible, input:focus-visible, summary:focus-visible { box-shadow: 0 0 0 3px var(--focus-ring), inset 0 0 0 2px var(--primary); }

    .app { width: min(940px, 100%); margin: 0 auto; padding: 12px; }
    .shell { display: grid; gap: 12px; }

    /* ---------- top bar ---------- */
    .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
    .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 999px; background: var(--field); }
    .segmented button { min-height: 42px; padding: 0 10px; border: 0; border-radius: 999px; color: var(--muted); background: transparent; font-size: 0.9rem; font-weight: 750; }
    .segmented button[aria-selected="true"], .segmented button[aria-pressed="true"] { color: var(--on-primary-container); background: var(--primary-container); }
    .segmented.small button { min-height: 36px; font-size: 0.875rem; }
    .top-actions { display: flex; gap: 6px; }
    .icon-btn { min-height: 42px; min-width: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 0.9rem; font-weight: 750; }

    /* ---------- layout ---------- */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(310px, 0.92fr); gap: 12px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .form { padding: 16px; display: grid; gap: 16px; }
    .section-title { margin: 0; font-size: 1.1rem; }
    .fields { display: grid; gap: 16px; }
    .field { display: grid; gap: 6px; }
    .field-label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--muted); font-size: 0.875rem; font-weight: 700; }
    .field-label small { font-weight: 600; opacity: 0.85; }

    /* ---------- stepper (one pattern everywhere) ---------- */
    .stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; }
    .stepper button { min-height: 48px; border: 0; border-radius: 999px; color: var(--on-primary-container); background: var(--primary-container); font-size: 1.4rem; font-weight: 600; line-height: 1; }
    .stepper button:active { filter: brightness(0.93); transform: scale(0.97); }
    .stepper .input-wrap { position: relative; display: grid; }
    .stepper input { width: 100%; min-width: 0; min-height: 48px; padding: 0 44px 0 14px; border: 0; border-radius: 16px; color: var(--ink); background: var(--field); font-size: 1.15rem; font-weight: 600; text-align: center; outline: none; }
    .stepper input:focus { box-shadow: inset 0 -2px 0 var(--primary), 0 0 0 3px var(--focus-ring); }
    .stepper input[aria-invalid="true"] { box-shadow: inset 0 -2px 0 var(--warn); }
    .stepper .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.875rem; font-weight: 600; pointer-events: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 0.875rem; font-weight: 750; }
    .chip[aria-pressed="true"] { border-color: transparent; color: var(--on-primary-container); background: var(--primary-container); }
    .hint { margin: 0; color: var(--muted); font-size: 0.875rem; line-height: 1.3; }

    details.advanced { border-top: 1px solid var(--line); padding-top: 12px; }
    details.advanced summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; color: var(--muted); font-size: 0.9rem; font-weight: 600; border-radius: 12px; }
    details.advanced .fields { margin-top: 12px; }
    .text-btn { justify-self: start; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; font-size: 0.875rem; font-weight: 750; }

    /* ---------- recipe card ---------- */
    .recipe { position: sticky; top: 12px; overflow: hidden; }
    .recipe-handle { display: none; }
    .recipe-body { padding: 16px; display: grid; gap: 16px; }
    .recipe-head h2 { margin: 0; font-size: 1.1rem; }
    .recipe-head p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
    .ings { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .ing { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 8px; row-gap: 4px; align-items: center; }
    .ing[hidden] { display: none; }
    .ing-head { justify-self: end; color: var(--muted); font-size: 0.875rem; font-weight: 600; }
    .ing .name { font-size: 0.95rem; font-weight: 700; }
    .ing .amt { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .ing .bp { min-width: 48px; text-align: right; color: var(--muted); font-size: 0.875rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ing .bar { grid-column: 1 / -1; height: 8px; border-radius: 999px; background: var(--field); overflow: hidden; }
    .ing .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--c); transition: width 150ms ease-out; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { padding: 12px; border-radius: 16px; background: var(--stat); }
    .stat .label { color: var(--muted); font-size: 0.8rem; font-weight: 750; }
    .stat .value { margin-top: 4px; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .result-main { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; color: var(--on-primary-container); background: var(--primary-container); }
    .result-main .label { font-size: 0.9rem; font-weight: 600; }
    .total { font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .actions button { min-height: 44px; padding: 0 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-size: 0.875rem; font-weight: 750; }
    .actions button.primary { color: var(--on-primary-container); background: var(--primary-container); border-color: transparent; }
    .note { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.3; }

    /* ---------- bake plan ---------- */
    .plan { padding: 16px; display: grid; gap: 12px; }
    .plan h2 { margin: 0; font-size: 1.1rem; }
    .plan-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .plan-controls label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.875rem; font-weight: 700; }
    .plan-controls input[type="datetime-local"] { min-height: 44px; padding: 0 12px; border: 0; border-radius: 14px; color: var(--ink); background: var(--field); font-size: 1rem; font-weight: 700; }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    .step { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--stat); }
    .step.bake { color: var(--on-primary-container); background: var(--primary-container); }
    .step.past .when { color: var(--warn); }
    .step .when { font-variant-numeric: tabular-nums; }
    .step .when b { display: block; font-size: 1.05rem; }
    .step .when span { color: var(--muted); font-size: 0.8rem; font-weight: 700; }
    .step .what b { display: block; font-size: 0.95rem; }
    .step .what span { color: var(--muted); font-size: 0.85rem; }
    .step .timer-btn { min-height: 40px; min-width: 96px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 0.875rem; font-weight: 750; font-variant-numeric: tabular-nums; }
    .step .timer-btn.running { color: var(--on-primary-container); background: var(--primary-container); border-color: transparent; }
    .warn { color: var(--warn); font-size: 0.9rem; font-weight: 700; margin: 0; }

    /* ---------- dialogs / toast ---------- */
    dialog { width: min(420px, calc(100% - 32px)); padding: 24px; border-radius: 28px; color: var(--ink); background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog h3 { margin: 0 0 12px; }
    dialog input[type="text"] { width: 100%; min-height: 48px; padding: 0 14px; border: 0; border-radius: 14px; color: var(--ink); background: var(--field); font-size: 1rem; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .dlg-actions button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: var(--field); font-weight: 750; }
    .dlg-actions button.primary { color: var(--on-primary-container); background: var(--primary-container); }
    .saved-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
    .saved-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 12px; border-radius: 16px; background: var(--stat); }
    .saved-item b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .saved-item span { color: var(--muted); font-size: 0.85rem; }
    .saved-item button { min-height: 38px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--primary-container); color: var(--on-primary-container); font-weight: 750; font-size: 0.875rem; }
    .saved-item button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    #toast { position: fixed; left: 50%; bottom: 96px; z-index: 50; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 999px; color: var(--paper); background: var(--ink); font-size: 0.9rem; font-weight: 700; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity 150ms ease-out, transform 150ms ease-out; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* ---------- mobile: result becomes a bottom sheet ---------- */
    @media (max-width: 760px) {
      body { padding-bottom: 96px; }
      .app { padding: 8px; }
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-end; }
      .layout { grid-template-columns: 1fr; }
      .recipe { position: fixed; top: auto; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; max-height: 86vh; border-radius: 28px 28px 0 0; border-bottom: 0; box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.05); padding-bottom: env(safe-area-inset-bottom); }
      .recipe-handle { display: grid; gap: 6px; justify-items: center; width: 100%; padding: 8px 16px 12px; border: 0; background: transparent; }
      .recipe-handle .grip { width: 40px; height: 4px; border-radius: 999px; background: var(--line); }
      .recipe-handle .summary { font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; }
      .recipe-body { display: none; overflow: auto; padding-top: 4px; }
      .recipe.open .recipe-body { display: grid; }
      #toast { bottom: 112px; }
    }

    /* ===== Material You (Material 3 tonal surfaces, amber seed) ===== */
    :root:root {
      color-scheme: light dark;
      --primary: #8b5000; --on-primary: #ffffff;
      --primary-container: #ffdcbd; --on-primary-container: #2c1600;
      --secondary-container: #f9ddc1; --on-secondary-container: #2a1708;
      --tertiary-container: #e1e6b0; --on-tertiary-container: #1a1e00;
      --surface: #fff8f5; --s-low: #fcf2ea; --s-mid: #f6ece3; --s-high: #f0e6dd; --s-highest: #eae0d7;
      --on-surface: #211a14; --on-variant: #51443a; --outline: #84746a; --outline-variant: #d6c3b6;
      --inverse: #372f28; --on-inverse: #fbeee5; --error: #ba1a1a;
      --water: #2e6a8e; --flour: #8b5000; --starter: #5c6137; --yeast: #9c4146; --salt: #84746a;
      --paper: var(--surface); --card: var(--s-mid); --field: var(--s-highest); --stat: var(--s-highest);
      --ink: var(--on-surface); --muted: var(--on-variant); --line: var(--outline-variant);
      --warn: var(--error); --focus-ring: transparent; --shadow: none;
    }
    @media (prefers-color-scheme: dark) {
      :root:root {
        --primary: #ffb778; --on-primary: #4a2800;
        --primary-container: #693c00; --on-primary-container: #ffdcbd;
        --secondary-container: #594330; --on-secondary-container: #f9ddc1;
        --tertiary-container: #444a22; --on-tertiary-container: #e1e6b0;
        --surface: #18120c; --s-low: #211a14; --s-mid: #251e18; --s-high: #302822; --s-highest: #3b332c;
        --on-surface: #eee0d5; --on-variant: #d6c3b6; --outline: #9e8e82; --outline-variant: #51443a;
        --inverse: #eee0d5; --on-inverse: #372f28; --error: #ffb4ab;
        --water: #98ccf4; --flour: #ffb778; --starter: #c5ca96; --yeast: #ffb2b6; --salt: #9e8e82;
      }
    }
    body { font-family: "Google Sans", Roboto, "Segoe UI", system-ui, sans-serif; }
    .app { width: min(960px, 100%); padding: 16px; }
    .shell { gap: 16px; }

    /* state layer: hover 8%, press 12% */
    .chip, .stepper button, .actions button, .icon-btn, .segmented button, .timer-btn, .saved-item button, .dlg-actions button, .text-btn { position: relative; overflow: hidden; border-radius: inherit; }
    .chip::after, .stepper button::after, .actions button::after, .icon-btn::after, .segmented button::after, .timer-btn::after, .saved-item button::after, .dlg-actions button::after, .text-btn::after {
      content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 150ms ease-out; pointer-events: none; }
    @media (hover: hover) { .chip:hover::after, .stepper button:hover::after, .actions button:hover::after, .icon-btn:hover::after, .segmented button:hover::after, .timer-btn:hover::after, .saved-item button:hover::after, .dlg-actions button:hover::after, .text-btn:hover::after { opacity: 0.08; } }
    .chip:active::after, .stepper button:active::after, .actions button:active::after, .icon-btn:active::after, .segmented button:active::after, .timer-btn:active::after, .saved-item button:active::after, .dlg-actions button:active::after, .text-btn:active::after { opacity: 0.12; }
    .stepper button:active { filter: none; transform: none; }
    button:focus-visible, input:focus-visible, summary:focus-visible { box-shadow: none; outline: 3px solid var(--primary); outline-offset: 2px; }

    /* surfaces are tonal, not outlined */
    .panel { border: 0; border-radius: 28px; box-shadow: none; }
    .form { background: var(--s-mid); padding: 24px; gap: 24px; }
    .recipe { background: var(--s-high); }
    .recipe-body { padding: 24px; gap: 24px; }
    .plan { background: var(--s-low); padding: 24px; gap: 16px; }
    .fields { gap: 24px; }

    /* top bar: outlined segmented button + outlined buttons */
    .topbar { gap: 12px; }
    .segmented { padding: 0; gap: 0; border: 1px solid var(--outline); border-radius: 999px; background: transparent; overflow: hidden; }
    .segmented button { min-height: 40px; border-radius: 0; color: var(--on-surface); font-size: 0.875rem; font-weight: 500; letter-spacing: 0.01em; }
    .segmented button + button { border-left: 1px solid var(--outline); }
    .segmented button[aria-selected="true"], .segmented button[aria-pressed="true"] { color: var(--on-secondary-container); background: var(--secondary-container); }
    .segmented.small button { min-height: 36px; }
    .icon-btn { min-height: 40px; padding: 0 20px; border: 1px solid var(--outline); border-radius: 999px; background: transparent; color: var(--primary); font-weight: 500; }

    .field-label { color: var(--on-variant); font-size: 0.875rem; font-weight: 500; letter-spacing: 0.01em; }
    .field-label small { font-weight: 400; }

    /* stepper: tonal icon buttons around an outlined field */
    .stepper { grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 12px; align-items: center; }
    .stepper button { min-height: 40px; border-radius: 999px; color: var(--on-secondary-container); background: var(--secondary-container); font-size: 1.375rem; font-weight: 500; }
    .stepper input { min-height: 56px; border: 1px solid var(--outline); border-radius: 16px; background: transparent; font-size: 1.375rem; font-weight: 400; padding: 0 48px; }
    .stepper input:focus { box-shadow: none; border-color: var(--primary); outline: 2px solid var(--primary); outline-offset: -2px; }
    .stepper input[aria-invalid="true"] { border-color: var(--error); outline: 2px solid var(--error); outline-offset: -2px; box-shadow: none; }
    .stepper .unit { font-weight: 500; color: var(--on-variant); }

    .chips { gap: 8px; }
    .chip { min-height: 32px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 8px; background: transparent; color: var(--on-variant); font-size: 0.875rem; font-weight: 500; }
    .chip[aria-pressed="true"] { border-color: transparent; color: var(--on-secondary-container); background: var(--secondary-container); }

    details.advanced { border-top: 1px solid var(--outline-variant); padding-top: 16px; }
    details.advanced summary { color: var(--primary); font-weight: 500; }
    .text-btn { min-height: 40px; padding: 0 20px; border: 1px solid var(--outline); border-radius: 999px; color: var(--primary); font-weight: 500; }

    /* recipe card */
    .recipe-head h2 { font-size: 1.5rem; font-weight: 400; }
    .recipe-head p { color: var(--on-variant); }
    .ings { gap: 16px; }
    .ing .name { font-size: 1rem; font-weight: 400; }
    .ing .amt { font-size: 1.5rem; font-weight: 400; }
    .ing .bp { color: var(--on-variant); }
    .ing .bar { height: 8px; background: var(--s-highest); }
    .ing-head { color: var(--on-variant); }
    .stat { padding: 16px; border-radius: 20px; background: var(--s-highest); }
    .stat .label { color: var(--on-variant); font-weight: 500; }
    .stat .value { font-size: 1.375rem; font-weight: 400; }
    .result-main { padding: 20px 24px; border-radius: 28px; color: var(--on-primary-container); background: var(--primary-container); }
    .result-main .label { font-size: 1rem; font-weight: 500; }
    .total { font-size: 2.75rem; font-weight: 400; letter-spacing: -0.01em; }
    .actions { gap: 8px; }
    .actions button { min-height: 48px; border: 0; border-radius: 999px; color: var(--on-secondary-container); background: var(--secondary-container); font-weight: 500; }
    .actions button.primary { color: var(--on-primary); background: var(--primary); }
    .actions button#resetBtn { color: var(--primary); background: transparent; }

    /* plan */
    .plan h2 { font-size: 1.375rem; font-weight: 400; }
    .plan-controls input[type="datetime-local"] { min-height: 48px; border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--outline); background: var(--s-highest); font-weight: 400; }
    .step { padding: 16px; border-radius: 20px; background: var(--s-mid); }
    .step.bake { color: var(--on-tertiary-container); background: var(--tertiary-container); }
    .step.bake .what span, .step.bake .when span { color: var(--on-tertiary-container); opacity: 0.8; }
    .step .when b { font-weight: 500; }
    .step .what b { font-weight: 500; }
    .step .timer-btn { border: 1px solid var(--outline); border-radius: 999px; background: transparent; color: var(--primary); font-weight: 500; }
    .step .timer-btn.running { border-color: transparent; color: var(--on-secondary-container); background: var(--secondary-container); }
    .step.past .when { color: var(--error); }

    dialog { border: 0; border-radius: 28px; background: var(--s-high); box-shadow: none; }
    dialog input[type="text"] { min-height: 56px; border: 1px solid var(--outline); border-radius: 16px; background: transparent; }
    .dlg-actions button { background: transparent; color: var(--primary); font-weight: 500; }
    .dlg-actions button.primary { background: transparent; color: var(--primary); }
    .saved-item { border-radius: 16px; background: var(--s-highest); }
    .saved-item button { color: var(--on-secondary-container); background: var(--secondary-container); font-weight: 500; }
    #toast { border-radius: 12px; color: var(--on-inverse); background: var(--inverse); font-weight: 400; }

    @media (max-width: 760px) {
      .app { padding: 12px; }
      .recipe { background: var(--s-low); border-radius: 28px 28px 0 0; box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.05); }
      .recipe-handle .grip { width: 32px; height: 4px; background: var(--outline); opacity: 0.6; }
      .recipe-handle .summary { color: var(--on-surface); font-weight: 500; }
      .form, .plan { padding: 16px; }
      .recipe-body { padding: 8px 16px 16px; }
    }

    /* ===== One screen: inputs and results visible together on a phone ===== */
    .phone-only { display: none; }
    @media (max-width: 760px) {
      body { padding-bottom: 0; }
      .app { padding: 8px; }
      .shell, .layout { gap: 8px; }
      .top-actions { display: none; }
      .phone-only { display: inline-flex; align-items: center; justify-content: center; }
      #resetBtn { display: none; }
      .actions { grid-template-columns: repeat(4, 1fr); }
      .actions button { min-height: 40px; }

      /* results are part of the page, not a sheet */
      .recipe { position: static; display: block; max-height: none; border-radius: 24px; box-shadow: none; background: var(--s-high); padding: 0; }
      .recipe-handle { display: none; }
      .recipe-body { display: grid; padding: 12px; gap: 8px; }
      .ing .bp { min-width: 44px; font-size: 0.8125rem; }
      .recipe-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .recipe-head h2 { font-size: 1.125rem; }
      .recipe-head p { margin: 0; }
      .ings { gap: 6px; }
      .ing { row-gap: 2px; }
      .ing .name { font-size: 0.9375rem; }
      .ing .amt { font-size: 1.25rem; }
      .ing .bar { height: 6px; }
      .ing-head { display: none; }
      .ing .bp::after { content: ""; }
      .stats { display: none; }
      .result-main { padding: 8px 16px; border-radius: 20px; }
      .total { font-size: 1.875rem; }

      /* inputs: one line per value */
      .panel { border-radius: 24px; }
      .form { padding: 12px; gap: 4px; }
      .fields { gap: 4px; }
      .field { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; row-gap: 0; min-height: 40px; }
      .field > .presets { display: none; }
      .field:focus-within > .presets { display: flex; grid-column: 1 / -1; justify-content: flex-end; padding-bottom: 6px; }
      .field > .chips { grid-column: 2; justify-content: flex-end; }
      .field:has(> .segmented) { grid-template-columns: auto minmax(0, 1fr); }
      .field > .segmented { justify-self: end; grid-column: 2; }
      .field-label { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; font-size: 0.9375rem; }
      .field-label small { font-size: 0.75rem; }
      .stepper { grid-template-columns: 36px 96px 36px; gap: 4px; }
      .stepper button { min-height: 36px; font-size: 1.25rem; }
      .stepper input { min-height: 38px; padding: 0 28px 0 8px; border-radius: 12px; font-size: 1.125rem; }
      .stepper .unit { right: 8px; font-size: 0.8125rem; }
      #fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
      #fields > .field { grid-column: 1 / -1; }
      #fields > .field.choice { grid-column: span 1; grid-template-columns: 1fr; }
      .field.choice .field-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .field.choice > .chips { grid-column: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .field.choice .chip { padding: 0 4px; font-size: 0.8125rem; }
      details.advanced { padding-top: 0; }
      details.advanced summary { min-height: 36px; }
      .plan { padding: 12px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="topbar">
        <nav class="segmented" id="tabs" aria-label="Dough type"></nav>
        <div class="top-actions">
          <button type="button" class="icon-btn" id="unitsBtn" aria-label="Switch units">g</button>
          <button type="button" class="icon-btn" id="recipesBtn">Recipes</button>
        </div>
      </header>

      <section class="layout">
        <form class="panel form" id="controls" autocomplete="off" onsubmit="return false">
          <div class="field">
            <div class="field-label">Scale by</div>
            <div class="segmented small" id="scaleSeg" role="group" aria-label="Scale recipe by"></div>
          </div>
          <div class="fields" id="fields"></div>
          <details class="advanced">
            <summary>Advanced</summary>
            <div class="fields" id="advFields"></div>
          </details>
        </form>

        <aside class="panel recipe" id="recipe" aria-label="Recipe">
          <button type="button" class="recipe-handle" id="sheetToggle" aria-expanded="false" aria-controls="recipeBody">
            <span class="grip"></span>
            <span class="summary" id="summary"></span>
          </button>
          <div class="recipe-body" id="recipeBody">
            <div class="recipe-head">
              <h2 id="recipeTitle"></h2>
              <p id="recipeSub"></p>
            </div>
            <ul class="ings" id="ings"><li class="ing-head" aria-hidden="true">% of flour</li></ul>
            <div class="stats">
              <div class="stat"><div class="label">Total flour</div><div class="value" id="totalFlour"></div></div>
              <div class="stat"><div class="label">Final hydration</div><div class="value" id="finalHydration"></div></div>
            </div>
            <div class="result-main">
              <span class="label">Total dough</span>
              <output class="total" id="totalDough" aria-live="polite"></output>
            </div>
            <div class="actions">
              <button type="button" class="primary" id="copyBtn">Copy</button>
              <button type="button" id="shareBtn">Share</button>
              <button type="button" id="saveBtn">Save</button>
              <button type="button" id="recipesBtn2" class="phone-only">Recipes</button>
              <button type="button" id="resetBtn">Reset</button>
            </div>
          </div>
        </aside>
      </section>

      <section class="panel plan" id="plan" aria-label="Bake plan">
        <h2>Bake plan</h2>
        <div class="plan-controls">
          <label>Bake at <input type="datetime-local" id="bakeAt"></label>
          <button type="button" class="chip" id="startNow">Start now</button>
        </div>
        <p class="warn" id="planWarn" hidden></p>
        <ol class="steps" id="steps"></ol>
      </section>
    </div>
  </main>

  <dialog id="saveDlg">
    <form method="dialog" id="saveForm">
      <h3>Save recipe</h3>
      <input type="text" id="saveName" maxlength="40" placeholder="Name, e.g. Weekend country loaf" aria-label="Recipe name" required>
      <div class="dlg-actions">
        <button type="button" id="saveCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="recipesDlg">
    <h3>Saved recipes</h3>
    <ul class="saved-list" id="savedList"></ul>
    <div class="dlg-actions"><button type="button" class="primary" id="recipesClose">Close</button></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";
    const KEY = "dough-ratio-assistant:v2";
    const OLD_KEY = "dough-ratio-assistant:v1";
    const TIMER_KEY = "dough-ratio-assistant:timers";
    const OZ = 28.3495;

    const MODES = {
      sourdough: { tab: "Sourdough", title: "Sourdough bread", one: "loaf", many: "loaves" },
      instant: { tab: "Instant yeast", title: "Instant yeast bread", one: "loaf", many: "loaves" },
      pizza: { tab: "Pizza", title: "Neapolitan pizza", one: "ball", many: "balls" }
    };

    const BASE = {
      scaleBy: "flour", flour: 500, pieces: 1, total: 750, pieceWeight: 750,
      hydration: 70, salt: 2, starterPct: 5, starterHyd: 100, yeastPct: 0.7
    };
    const MODE_DEFAULTS = {
      sourdough: { ...BASE },
      instant: { ...BASE },
      pizza: { ...BASE, scaleBy: "pieces", pieces: 8, total: 2400, pieceWeight: 300, hydration: 64,
               leaven: "instant", proof: "nextDay", yeastPct: 0.11, starterPct: 20 }
    };
    const PROOF = { sameDay: { yeastPct: 0.5, starterPct: 25 }, nextDay: { yeastPct: 0.11, starterPct: 20 } };

    const WEIGHT_KEYS = new Set(["flour", "total", "pieceWeight"]);
    function spec(mode, key) {
      const pizza = mode === "pizza";
      return {
        flour:       { min: 10,  max: 10000, step: 25,  stepOz: 1,   dec: 0 },
        pieces:      { min: 1,   max: 48,    step: 1,   stepOz: 1,   dec: 0 },
        total:       { min: 100, max: 20000, step: 50,  stepOz: 2,   dec: 0 },
        pieceWeight: { min: 50,  max: 3000,  step: 50,  stepOz: 1,   dec: 0 },
        hydration:   pizza ? { min: 50, max: 80, step: 1, dec: 0 } : { min: 40, max: 100, step: 1, dec: 0 },
        salt:        { min: 0,   max: 5,     step: 0.1, dec: 1 },
        starterPct:  { min: 0,   max: 100,   step: 0.5, dec: 1 },
        starterHyd:  { min: 50,  max: 200,   step: 5,   dec: 0 },
        yeastPct:    { min: 0.01, max: 3,    step: pizza ? 0.01 : 0.05, dec: 2 }
      }[key];
    }

    /* ---------------- helpers ---------------- */
    const $ = (sel, root = document) => root.querySelector(sel);
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const round = (v, d) => Math.round(v * 10 ** d) / 10 ** d;
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const haptic = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };

    function h(tag, props = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === "class") e.className = v;
        else if (k === "text") e.textContent = v;
        else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else e.setAttribute(k, v === true ? "" : v);
      }
      for (const c of kids.flat()) if (c != null) e.append(c);
      return e;
    }

    let toastTimer;
    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
    }

    /* ---------------- state ---------------- */
    function sanitize(mode, s) {
      const d = MODE_DEFAULTS[mode];
      const out = { ...d, ...s };
      for (const key of Object.keys(d)) {
        if (typeof d[key] === "number") {
          const n = Number(out[key]);
          const sp = spec(mode, key);
          out[key] = Number.isFinite(n) ? clamp(n, sp.min, sp.max) : d[key];
        }
      }
      if (!["flour", "pieces", "total"].includes(out.scaleBy)) out.scaleBy = d.scaleBy;
      if (mode === "pizza") {
        if (!["instant", "sourdough"].includes(out.leaven)) out.leaven = d.leaven;
        if (!PROOF[out.proof]) out.proof = d.proof;
      }
      return out;
    }

    function loadState() {
      const st = { mode: "sourdough", units: "g", byMode: {}, saved: [] };
      for (const m of Object.keys(MODES)) st.byMode[m] = { ...MODE_DEFAULTS[m] };
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (MODES[p.mode]) st.mode = p.mode;
          if (p.units === "oz") st.units = "oz";
          for (const m of Object.keys(MODES)) st.byMode[m] = { ...st.byMode[m], ...(p.byMode && p.byMode[m]) };
          if (Array.isArray(p.saved)) st.saved = p.saved.filter(x => x && MODES[x.mode]);
        } else {
          const old = JSON.parse(localStorage.getItem(OLD_KEY));
          if (old) {
            if (MODES[old.mode]) st.mode = old.mode;
            for (const m of ["sourdough", "instant"]) if (old[m]) Object.assign(st.byMode[m], old[m]);
            if (old.pizza) Object.assign(st.byMode.pizza, { pieces: old.pizza.balls, leaven: old.pizza.yeastType, proof: old.pizza.proof });
          }
        }
      } catch {}
      for (const m of Object.keys(MODES)) st.byMode[m] = sanitize(m, st.byMode[m]);
      return st;
    }

    const state = loadState();
    function saveState() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }

    /* ---------------- calculation (everything is linear in flour) ---------------- */
    const leavened = (m, s) => m === "sourdough" || (m === "pizza" && s.leaven === "sourdough");
    const yeasted = (m, s) => m === "instant" || (m === "pizza" && s.leaven === "instant");

    function calcAt(m, s, flour) {
      const starter = leavened(m, s) ? flour * s.starterPct / 100 : 0;
      const starterFlour = starter / (1 + s.starterHyd / 100);
      const starterWater = starter - starterFlour;
      const yeast = yeasted(m, s) ? flour * s.yeastPct / 100 : 0;
      const totalFlour = flour + starterFlour;
      const water = Math.max(0, totalFlour * s.hydration / 100 - starterWater);
      const salt = totalFlour * s.salt / 100;
      return { flour, starter, starterFlour, starterWater, yeast, totalFlour, water, salt, total: flour + starter + water + salt + yeast };
    }

    function compute(m, s) {
      const ref = calcAt(m, s, 1000);
      let k;
      if (s.scaleBy === "flour") k = s.flour / 1000;
      else k = (s.scaleBy === "pieces" ? s.pieces * s.pieceWeight : s.total) / ref.total;
      const r = calcAt(m, s, 1000 * k);
      r.finalHydration = (r.water + r.starterWater) / r.totalFlour * 100;
      r.pieces = r.total / s.pieceWeight;
      r.hasStarter = leavened(m, s);
      r.hasYeast = yeasted(m, s);
      return r;
    }

    /* ---------------- formatting ---------------- */
    function fmtW(g) {
      if (state.units === "oz") {
        const o = g / OZ;
        return (o < 1 ? o.toFixed(2) : o.toFixed(1)).replace(/\.0+$/, "") + " oz";
      }
      if (g < 10) return (Math.round(g * 10) / 10).toLocaleString() + " g";
      return Math.round(g).toLocaleString() + " g";
    }
    const fmtPct = v => Number(v.toFixed(1)).toLocaleString() + "%";
    const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));
    function fmtDur(min) {
      if (min < 60) return min + " min";
      const hr = Math.floor(min / 60), mm = min % 60;
      return mm ? `${hr} h ${mm} min` : `${hr} h`;
    }
    function fmtWhen(d) {
      const now = new Date();
      const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - day0) / 864e5);
      const day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : d.toLocaleDateString([], { weekday: "short" });
      return { day, time: d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
    }
    const toLocalInput = d => {
      const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    };

    /* animate numbers so changes are easy to notice */
    function animateTo(el, to, fmt) {
      const from = el._v == null ? to : el._v;
      el._v = to;
      cancelAnimationFrame(el._raf);
      if (reduceMotion || from === to) { el.textContent = fmt(to); return; }
      const t0 = performance.now(), dur = 150;
      const tick = now => {
        const p = Math.min(1, (now - t0) / dur);
        el.textContent = fmt(from + (to - from) * (1 - (1 - p) ** 3));
        if (p < 1) el._raf = requestAnimationFrame(tick);
      };
      el._raf = requestAnimationFrame(tick);
    }

    /* ---------------- controls ---------------- */
    let refreshers = [];

    function changed() {
      saveState();
      refreshers.forEach(fn => fn());
      renderResults();
    }

    function structural() {
      saveState();
      renderControls();
      renderResults();
      renderPlan();
    }

    function makeField(key, label, opts = {}) {
      const m = state.mode, s = state.byMode[m], sp = spec(m, key);
      const weight = WEIGHT_KEYS.has(key), oz = weight && state.units === "oz";
      const conv = oz ? OZ : 1, dec = oz ? 1 : sp.dec, step = oz ? sp.stepOz : sp.step;
      const unit = weight ? (oz ? "oz" : "g") : (opts.unit || "");
      const input = h("input", { type: "text", inputmode: "decimal", id: "f-" + key, autocomplete: "off", enterkeyhint: "done", "aria-label": label });
      const show = () => { input.value = fmtNum(s[key] / conv, dec); input.removeAttribute("aria-invalid"); };

      const setDisplay = v => {
        const lo = sp.min / conv, hi = sp.max / conv;
        s[key] = round(clamp(v, lo, hi) * conv, 3);
      };
      const nudge = dir => {
        setDisplay(round(s[key] / conv + dir * step, dec + 1));
        show(); changed(); haptic();
      };

      const minus = h("button", { type: "button", "aria-label": "Decrease " + label.toLowerCase(), text: "−" });
      const plus = h("button", { type: "button", "aria-label": "Increase " + label.toLowerCase(), text: "+" });
      for (const [btn, dir] of [[minus, -1], [plus, 1]]) {
        let delay, rep;
        const stop = () => { clearTimeout(delay); clearInterval(rep); };
        btn.addEventListener("pointerdown", e => {
          if (e.button) return;
          nudge(dir);
          delay = setTimeout(() => { rep = setInterval(() => nudge(dir), 75); }, 420);
        });
        ["pointerup", "pointerleave", "pointercancel", "blur"].forEach(ev => btn.addEventListener(ev, stop));
        btn.addEventListener("click", e => { if (e.detail === 0) nudge(dir); }); // keyboard
        btn.addEventListener("contextmenu", e => e.preventDefault());
      }

      input.addEventListener("focus", () => input.select());
      input.addEventListener("input", () => {
        const v = parseFloat(input.value.replace(",", "."));
        if (!Number.isFinite(v)) return;
        const outside = v < sp.min / conv - 1e-9 || v > sp.max / conv + 1e-9;
        input.setAttribute("aria-invalid", String(outside));
        setDisplay(v);
        saveState(); renderResults(); refreshers.forEach(fn => fn !== show && fn());
      });
      input.addEventListener("change", () => { show(); changed(); });
      input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
      show();
      refreshers.push(show);

      const wrap = h("div", { class: "field" },
        h("label", { class: "field-label", for: "f-" + key }, h("span", { text: label }), h("small", { text: opts.hint || "" })),
        h("div", { class: "stepper" }, minus, h("div", { class: "input-wrap" }, input, h("span", { class: "unit", text: unit })), plus));

      if (opts.presets) {
        const chips = opts.presets.map(p => h("button", { type: "button", class: "chip", text: p + (opts.suffix ?? opts.unit ?? ""),
          onclick: () => { s[key] = p; show(); changed(); haptic(); } }));
        const sync = () => chips.forEach((c, i) => c.setAttribute("aria-pressed", String(s[key] === opts.presets[i])));
        refreshers.push(sync); sync();
        wrap.append(h("div", { class: "chips presets" }, chips));
      }
      return wrap;
    }

    function chipGroup(label, options, get, set) {
      const chips = options.map(([v, l]) => h("button", { type: "button", class: "chip", text: l, onclick: () => { set(v); haptic(); } }));
      const sync = () => chips.forEach((c, i) => c.setAttribute("aria-pressed", String(get() === options[i][0])));
      refreshers.push(sync); sync();
      return h("div", { class: "field choice", role: "group", "aria-label": label }, h("div", { class: "field-label", text: label }), h("div", { class: "chips" }, chips));
    }

    function renderControls() {
      refreshers = [];
      const m = state.mode, s = state.byMode[m], M = MODES[m];
      $("#unitsBtn").textContent = state.units;

      $("#tabs").replaceChildren(...Object.entries(MODES).map(([k, v]) =>
        h("button", { type: "button", role: "tab", "aria-selected": String(k === m), text: v.tab,
          onclick: () => { state.mode = k; planAnchor = "now"; structural(); } })));

      $("#scaleSeg").replaceChildren(...[["flour", "Flour"], ["pieces", cap(M.many)], ["total", "Total"]].map(([k, l]) =>
        h("button", { type: "button", text: l, "aria-pressed": String(s.scaleBy === k),
          onclick: () => { s.scaleBy = k; structural(); } })));

      const fields = [];
      if (m === "pizza") {
        fields.push(
          chipGroup("Leavening", [["instant", "Yeast"], ["sourdough", "Sourdough"]], () => s.leaven, v => { s.leaven = v; structural(); }),
          chipGroup("Proofing", [["sameDay", "Same day"], ["nextDay", "Next day"]], () => s.proof, v => {
            s.proof = v; Object.assign(s, PROOF[v]); planAnchor = "now"; structural();
          }));
      }
      if (s.scaleBy === "flour") fields.push(makeField("flour", "Flour weight", state.units === "g" ? { presets: m === "pizza" ? [1000, 1500, 2000] : [500, 800, 1200], suffix: " g" } : {}));
      else if (s.scaleBy === "pieces") fields.push(makeField("pieces", cap(M.many), { hint: `${fmtW(s.pieceWeight)} each`, presets: m === "pizza" ? [4, 6, 8, 12] : [1, 2, 3] }));
      else fields.push(makeField("total", "Total dough"));

      fields.push(makeField("hydration", "Hydration", { unit: "%", presets: m === "pizza" ? [60, 64, 70] : [65, 70, 75] }));
      if (leavened(m, s)) fields.push(makeField("starterPct", "Starter amount", { unit: "%", presets: m === "pizza" ? [20, 25, 30] : [5, 10, 20] }));
      if (m === "pizza" && yeasted(m, s)) fields.push(makeField("yeastPct", "Instant yeast", { unit: "%" }));
      $("#fields").replaceChildren(...fields);

      const adv = [makeField("salt", "Salt", { unit: "%" })];
      if (leavened(m, s)) adv.push(makeField("starterHyd", "Starter hydration", { unit: "%" }));
      if (yeasted(m, s) && m !== "pizza") adv.push(makeField("yeastPct", "Instant yeast", { unit: "%" }));
      adv.push(makeField("pieceWeight", `Weight per ${M.one}`));
      adv.push(chipGroup("Units", [["g", "Grams"], ["oz", "Ounces"]], () => state.units, v => { state.units = v; structural(); }));
      adv.push(h("button", { type: "button", class: "text-btn", text: "Reset this mode to defaults",
        onclick: () => { state.byMode[m] = { ...MODE_DEFAULTS[m] }; planAnchor = "now"; structural(); toast("Defaults restored"); } }));
      $("#advFields").replaceChildren(...adv);
    }

    /* ---------------- recipe card ---------------- */
    const ING = [
      { id: "flour", name: "Flour", c: "--flour" },
      { id: "water", name: "Water", c: "--water" },
      { id: "starter", name: "Sourdough starter", c: "--starter" },
      { id: "yeast", name: "Instant dry yeast", c: "--yeast" },
      { id: "salt", name: "Salt", c: "--salt" }
    ];
    const rows = {};
    for (const i of ING) {
      const li = h("li", { class: "ing", style: `--c: var(${i.c})` },
        h("span", { class: "name", text: i.name }),
        h("output", { class: "amt" }), h("span", { class: "bp" }),
        h("span", { class: "bar" }, h("i")));
      rows[i.id] = { li, amt: $(".amt", li), bp: $(".bp", li), bar: $("i", li) };
      $("#ings").append(li);
    }

    let lastResult = null;
    function renderResults() {
      const m = state.mode, s = state.byMode[m], M = MODES[m];
      const r = compute(m, s);
      lastResult = r;
      const vis = { flour: true, water: true, starter: r.hasStarter, yeast: r.hasYeast, salt: true };
      for (const i of ING) {
        const row = rows[i.id];
        row.li.hidden = !vis[i.id];
        if (!vis[i.id]) continue;
        const val = r[i.id];
        animateTo(row.amt, val, fmtW);
        row.bp.textContent = fmtPct(val / r.totalFlour * 100);
        row.bar.style.width = (val / r.total * 100).toFixed(1) + "%";
      }
      animateTo($("#totalDough"), r.total, fmtW);
      $("#totalFlour").textContent = fmtW(r.totalFlour);
      $("#finalHydration").textContent = fmtPct(r.finalHydration);

      const p = Number(r.pieces.toFixed(1));
      const pieceTxt = s.scaleBy === "pieces" ? `${s.pieces} ${s.pieces === 1 ? M.one : M.many}` : `≈ ${p} ${p === 1 ? M.one : M.many}`;
      let title = M.title;
      if (m === "pizza") title += s.leaven === "sourdough" ? " · sourdough" : " · instant yeast";
      $("#recipeTitle").textContent = title;
      $("#recipeSub").textContent = pieceTxt;
      $("#summary").textContent = `${fmtW(r.flour)} flour · ${fmtW(r.water)} water · ${fmtW(r.hasStarter ? r.starter : r.yeast)} ${r.hasStarter ? "starter" : "yeast"} · ${fmtW(r.salt)} salt`;
    }

    function recipeText() {
      const m = state.mode, s = state.byMode[m], r = lastResult || compute(m, s);
      const lines = [`${$("#recipeTitle").textContent} (${$("#recipeSub").textContent})`, ""];
      for (const i of ING) {
        if (i.id === "starter" && !r.hasStarter) continue;
        if (i.id === "yeast" && !r.hasYeast) continue;
        lines.push(`${i.name} ${fmtW(r[i.id])} (${fmtPct(r[i.id] / r.totalFlour * 100)})`);
      }
      lines.push(`Total dough: ${fmtW(r.total)} · Hydration ${fmtPct(r.finalHydration)}`, "", "Plan:");
      for (const st of planTimes()) {
        const w = fmtWhen(st.start);
        lines.push(`${w.day} ${w.time}  ${st.label} (${fmtDur(st.min)})`);
      }
      return lines.join("\n");
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; } catch {}
      const ta = h("textarea", { style: "position:fixed;opacity:0" });
      ta.value = text; document.body.append(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
      return ok;
    }

    /* ---------------- bake plan + timers ---------------- */
    function planSteps(m, s) {
      if (m === "sourdough") return [["Mix & knead", 30], ["Bulk rest at room temp", 240], ["Shape into basket", 15], ["Final proof", 45], ["Preheat oven (pot inside)", 30], ["Bake", 45]];
      if (m === "instant") return [["Mix & knead", 20], ["Rest at room temp", 90], ["Shape into basket", 15], ["Short proof", 30], ["Preheat oven", 30], ["Bake", 40]];
      const next = s.proof === "nextDay", sd = s.leaven === "sourdough";
      if (!next) return [["Mix & knead", 20], ["Rest at room temp", 240], ["Divide into balls", 15], [sd ? "Proof until doubled" : "Proof until doubled", sd ? 120 : 90], ["Prep & preheat oven", 30], ["Bake", 20]];
      if (sd) return [["Mix & knead", 20], ["Rest at room temp", 120], ["Divide into balls", 15], ["Chill in fridge", 1440], ["Proof until doubled", 120], ["Prep & preheat oven", 30], ["Bake", 20]];
      return [["Mix & knead", 20], ["Chill in fridge", 1440], ["Rest at room temp", 120], ["Divide into balls", 15], ["Proof until doubled", 60], ["Prep & preheat oven", 30], ["Bake", 20]];
    }

    let planAnchor = "now";   // "now" = work out the start time from the plan; "fixed" = user picked a bake time
    let bakeAt = new Date();

    function planTimes() {
      const m = state.mode, steps = planSteps(m, state.byMode[m]);
      const before = steps.slice(0, -1).reduce((a, [, mins]) => a + mins, 0);
      if (planAnchor === "now") {
        const t = new Date(Date.now() + before * 60000);
        t.setSeconds(0, 0); t.setMinutes(Math.ceil(t.getMinutes() / 5) * 5);
        bakeAt = t;
      }
      let t = bakeAt.getTime() - before * 60000;
      return steps.map(([label, min], i) => {
        const start = new Date(t);
        t += min * 60000;
        return { id: `${m}|${i}|${label}`, label, min, start, bake: i === steps.length - 1 };
      });
    }

    function loadTimers() { try { return JSON.parse(localStorage.getItem(TIMER_KEY)) || {}; } catch { return {}; } }
    const timers = loadTimers();
    const saveTimers = () => { try { localStorage.setItem(TIMER_KEY, JSON.stringify(timers)); } catch {} };

    function renderPlan() {
      const times = planTimes();
      $("#bakeAt").value = toLocalInput(bakeAt);
      $("#startNow").setAttribute("aria-pressed", String(planAnchor === "now"));
      const late = times[0].start.getTime() < Date.now() - 60000;
      const warn = $("#planWarn");
      warn.hidden = !late;
      warn.textContent = late ? "The first step would already have started. Pick a later bake time or tap Start now." : "";
      $("#steps").replaceChildren(...times.map(st => {
        const w = fmtWhen(st.start);
        const btn = h("button", { type: "button", class: "timer-btn", "data-timer": st.id, onclick: () => toggleTimer(st) });
        return h("li", { class: "step" + (st.bake ? " bake" : "") + (late && st.start.getTime() < Date.now() - 60000 ? " past" : "") },
          h("div", { class: "when" }, h("b", { text: w.time }), h("span", { text: w.day })),
          h("div", { class: "what" }, h("b", { text: st.label }), h("span", { text: fmtDur(st.min) })),
          btn);
      }));
      tickTimers();
    }

    function toggleTimer(st) {
      if (timers[st.id]) { delete timers[st.id]; saveTimers(); tickTimers(); return; }
      timers[st.id] = { end: Date.now() + st.min * 60000, label: st.label };
      saveTimers();
      try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch {}
      tickTimers();
      toast(`Timer started: ${st.label}`);
    }

    function beep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.15;
        o.start(); o.stop(ctx.currentTime + 0.35);
      } catch {}
    }

    function tickTimers() {
      const now = Date.now();
      let fired = false;
      for (const [id, t] of Object.entries(timers)) {
        if (t.end <= now) {
          delete timers[id]; fired = true;
          toast(`${t.label} is done`);
          beep();
          try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
          try { if ("Notification" in window && Notification.permission === "granted") new Notification("Dough timer", { body: `${t.label} is done` }); } catch {}
        }
      }
      if (fired) saveTimers();
      document.querySelectorAll("[data-timer]").forEach(btn => {
        const t = timers[btn.dataset.timer];
        btn.classList.toggle("running", !!t);
        btn.setAttribute("aria-label", t ? "Stop timer" : "Start timer");
        if (t) {
          const left = Math.max(0, Math.round((t.end - now) / 1000));
          const hh = Math.floor(left / 3600), mm = Math.floor(left % 3600 / 60), ss = left % 60;
          btn.textContent = (hh ? hh + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0");
        } else btn.textContent = "Timer";
      });
    }
    setInterval(tickTimers, 1000);

    /* ---------------- saved recipes ---------------- */
    function renderSaved() {
      const list = $("#savedList");
      if (!state.saved.length) {
        list.replaceChildren(h("li", { class: "hint", text: "No saved recipes." }));
        return;
      }
      list.replaceChildren(...state.saved.map(item => {
        const s = sanitize(item.mode, item.settings), r = compute(item.mode, s);
        return h("li", { class: "saved-item" },
          h("div", {}, h("b", { text: item.name }), h("span", { text: `${MODES[item.mode].tab} · ${fmtW(r.flour)} flour · ${fmtPct(s.hydration)}` })),
          h("button", { type: "button", text: "Load", onclick: () => {
            state.mode = item.mode; state.byMode[item.mode] = s; planAnchor = "now";
            $("#recipesDlg").close(); structural(); toast(`Loaded ${item.name}`);
          } }),
          h("button", { type: "button", class: "ghost", "aria-label": "Delete " + item.name, text: "Delete", onclick: () => {
            state.saved = state.saved.filter(x => x !== item); saveState(); renderSaved();
          } }));
      }));
    }

    /* ---------------- wiring ---------------- */
    $("#unitsBtn").addEventListener("click", () => { state.units = state.units === "g" ? "oz" : "g"; structural(); toast(state.units === "oz" ? "Showing ounces" : "Showing grams"); });
    $("#sheetToggle").addEventListener("click", () => {
      const open = $("#recipe").classList.toggle("open");
      $("#sheetToggle").setAttribute("aria-expanded", String(open));
    });
    $("#copyBtn").addEventListener("click", async () => toast(await copyText(recipeText()) ? "Recipe copied" : "Couldn't copy"));
    $("#shareBtn").addEventListener("click", async () => {
      const text = recipeText();
      if (navigator.share) { try { await navigator.share({ title: $("#recipeTitle").textContent, text }); } catch {} }
      else toast(await copyText(text) ? "Sharing isn't available here, copied instead" : "Couldn't share");
    });
    $("#resetBtn").addEventListener("click", () => { state.byMode[state.mode] = { ...MODE_DEFAULTS[state.mode] }; planAnchor = "now"; structural(); toast("Defaults restored"); });
    $("#saveBtn").addEventListener("click", () => { $("#saveName").value = ""; $("#saveDlg").showModal(); $("#saveName").focus(); });
    $("#saveCancel").addEventListener("click", () => $("#saveDlg").close());
    $("#saveForm").addEventListener("submit", () => {
      const name = $("#saveName").value.trim();
      if (!name) return;
      state.saved.unshift({ id: Date.now(), name, mode: state.mode, settings: { ...state.byMode[state.mode] } });
      saveState(); toast(`Saved “${name}”`);
    });
    $("#recipesBtn").addEventListener("click", () => { renderSaved(); $("#recipesDlg").showModal(); });
    $("#recipesBtn2").addEventListener("click", () => { renderSaved(); $("#recipesDlg").showModal(); });
    $("#recipesClose").addEventListener("click", () => $("#recipesDlg").close());
    $("#bakeAt").addEventListener("change", e => {
      const d = new Date(e.target.value);
      if (!isNaN(d)) { bakeAt = d; planAnchor = "fixed"; renderPlan(); }
    });
    $("#startNow").addEventListener("click", () => { planAnchor = "now"; renderPlan(); });

    window.DoughRatioAssistant = { compute, calcAt, planSteps, MODE_DEFAULTS, sanitize };

    renderControls();
    renderResults();
    renderPlan();
  </script>
</body>
</html>
