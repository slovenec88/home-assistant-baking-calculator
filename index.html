ppend(val, unit);\n      const ruler = H(\"div\", { class: \"ruler\", \"aria-hidden\": \"true\" });\n      const px = PX[f.key] || 10, every = Math.ceil(8 / px);\n      ruler.style.backgroundImage = `repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px ${px * every}px)`;\n      const pre = H(\"div\", { class: \"pre\" }, ...f.presets.map(p => H(\"button\", { type: \"button\", \"data-p\": p, text: p + (f.unit === \"g\" ? \" g\" : f.unit), onclick: () => Dough.set(f.key, p) })));\n      inputs.append(H(\"div\", { class: \"in\", \"data-key\": f.key }, H(\"div\", {}, H(\"div\", { class: \"lab\", text: f.label }), pre), num, ruler));\n      Dough.drag(num, { key: f.key, axis: \"x\", pxPerStep: () => PX[f.key] || 10, onTap: () => edit(num, f) });\n      num.addEventListener(\"keydown\", e => {\n        const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];\n        if (dir) { e.preventDefault(); Dough.step(f.key, dir); }\n        if (e.key === \"Enter\") { e.preventDefault(); edit(num, f); }\n      });\n    });\n    const ch = $(\"#choices\"); ch.hidden = !model.choices.length; ch.replaceChildren();\n    model.choices.forEach(c => ch.append(H(\"div\", { class: \"grp\", role: \"group\", \"aria-label\": c.label },\n      ...c.options.map(([v, l]) => H(\"button\", { type: \"button\", text: l === \"Instant yeast\" ? \"Yeast\" : l, \"data-v\": v, \"aria-pressed\": String(c.value === v), onclick: () => Dough.choose(c.key, v) })))));\n  }\n\n  function edit(num, f) {\n    const val = num.querySelector(\".val\"); if (num.querySelector(\"input\")) return;\n    const input = H(\"input\", { type: \"text\", inputmode: \"decimal\", \"aria-label\": f.label, value: Dough.fmtNum(valueOf(f.key), f.dec) });\n    input.style.width = \"4.2ch\";\n    val.replaceChildren(input); input.focus(); input.select();\n    const done = () => { const v = parseFloat(input.value.replace(\",\", \".\")); if (Number.isFinite(v)) Dough.set(f.key, v); else paint(m); };\n    input.addEventListener(\"blur\", done);\n    input.addEventListener(\"keydown\", e => { if (e.key === \"Enter\") input.blur(); if (e.key === \"Escape\") { input.value = \"\"; input.blur(); } });\n    input.addEventListener(\"pointerdown\", e => e.stopPropagation());\n  }\n  const valueOf = key => m.fields.find(f => f.key === key).value;\n\n  function paint(model) {\n    m = model;\n    model.fields.forEach(f => {\n      const row = $(`.in[data-key=\"${f.key}\"]`); if (!row) return;\n      const val = row.querySelector(\".val\");\n      if (!val.querySelector(\"input\")) val.textContent = Dough.fmtNum(f.value, f.dec);\n      row.querySelector(\".num\").setAttribute(\"aria-valuenow\", f.value);\n      row.querySelector(\".ruler\").style.backgroundPositionX = `${-(f.value / f.drag) * (PX[f.key] || 10)}px`;\n      row.querySelectorAll(\".pre button\").forEach(b => b.setAttribute(\"aria-pressed\", String(Number(b.dataset.p) === f.value)));\n    });\n    model.choices.forEach(c => document.querySelectorAll(`#choices [role=group][aria-label=\"${c.label}\"] button`).forEach(b => b.setAttribute(\"aria-pressed\", String(b.dataset.v === c.value))));\n\n    // proportion bar\n    const bar = $(\"#bar\");\n    if (bar.children.length !== model.parts.length || [...bar.children].some((s, i) => s.dataset.id !== model.parts[i].id)) {\n      bar.replaceChildren(...model.parts.map(p => H(\"span\", { \"data-id\": p.id, text: p.label })));\n    }\n    model.parts.forEach((p, i) => { const s = bar.children[i]; s.style.flexGrow = p.g; s.style.flexBasis = \"0\"; s.textContent = p.g / model.total > 0.07 ? p.label : \"\"; });\n\n    // outputs\n    const out = $(\"#out\"); out.replaceChildren();\n    model.parts.filter(p => model.mode === \"pizza\" || p.id !== \"flour\").forEach(p => out.append(H(\"div\", { class: \"cell\", \"data-id\": p.id }, H(\"small\", { text: p.label === \"Yeast\" ? \"Instant yeast\" : p.label }), H(\"b\", { text: Dough.fmtG(p.g) }))));\n    out.append(H(\"div\", { class: \"cell\", \"data-id\": \"hyd\" }, H(\"small\", { text: \"Final hydration\" }), H(\"b\", { text: Dough.fmtNum(model.finalHydration, 1) + \"%\" })));\n    out.append(H(\"div\", { class: \"cell total\" }, H(\"small\", { text: \"Total dough\" }), H(\"b\", { text: Dough.fmtG(model.total) })));\n    $(\"#plan\").textContent = model.plan;\n  }\n\n  Dough.subscribe(model => {\n    const key = model.mode + \"|\" + model.fields.map(f => f.key).join() + \"|\" + model.choices.map(c => c.value).join();\n    if (key !== structKey) { structKey = key; build(model); }\n    paint(model);\n  });\n})();\n<\/script>\n<script>\n(() => {\n  const $ = s => document.querySelector(s), dh = $(\"#dh\"), body = $(\"#dbody\"), vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };\n  let skip = false, y0 = null, flash = 0, confirmId = null, confirmT = 0;\n  function setOpen(o) {\n    body.hidden = !o; dh.setAttribute(\"aria-expanded\", String(o));\n    if (o) { const m = Dough.model(); const f = m.fields[0]; $(\"#dname\").placeholder = m.title + \", \" + Dough.fmtVal(f); }\n  }\n  dh.addEventListener(\"pointerdown\", e => { y0 = e.clientY; try { dh.setPointerCapture(e.pointerId); } catch {} });\n  dh.addEventListener(\"pointerup\", e => { if (y0 == null) return; const d = y0 - e.clientY; y0 = null; if (Math.abs(d) > 24) { setOpen(d > 0); skip = true; } });\n  dh.addEventListener(\"click\", () => { if (skip) { skip = false; return; } setOpen(body.hidden); });\n  document.addEventListener(\"keydown\", e => { if (e.key === \"Escape\" && !body.hidden) setOpen(false); });\n  $(\"#dsave\").addEventListener(\"submit\", e => {\n    e.preventDefault(); const m = Dough.model();\n    const name = $(\"#dname\").value.trim() || (m.title + \", \" + Dough.fmtVal(m.fields[0]));\n    Dough.recipes.save(name); $(\"#dname\").value = \"\"; vib(10);\n    $(\"#dl\").textContent = Dough.recipes.persistent() ? \"Saved\" : \"Saved for this session\"; clearTimeout(flash); flash = setTimeout(() => draw(Dough.recipes.list()), 1500);\n  });\n  function draw(list) {\n    $(\"#dl\").textContent = list.length ? `Recipes (${list.length})` : \"Recipes\";\n    $(\"#dnote\").hidden = Dough.recipes.persistent();\n    const ul = $(\"#dlist\"); ul.replaceChildren();\n    if (!list.length) { const li = document.createElement(\"li\"); li.className = \"empty\"; li.textContent = \"No saved recipes.\"; ul.append(li); return; }\n    list.forEach(r => {\n      const li = document.createElement(\"li\");\n      const t = document.createElement(\"div\"); const b = document.createElement(\"b\"); b.textContent = r.name; const s = document.createElement(\"span\"); s.textContent = Dough.recipes.summary(r.snap); t.append(b, s);\n      const load = document.createElement(\"button\"); load.type = \"button\"; load.className = \"load\"; load.textContent = \"Load\"; load.setAttribute(\"aria-label\", \"Load \" + r.name);\n      load.onclick = () => { Dough.recipes.load(r.id); setOpen(false); vib(10); };\n      const del = document.createElement(\"button\"); del.type = \"button\"; del.textContent = confirmId === r.id ? \"Sure?\" : \"Delete\"; del.setAttribute(\"aria-label\", \"Delete \" + r.name);\n      del.onclick = () => { if (confirmId === r.id) { confirmId = null; Dough.recipes.remove(r.id); } else { confirmId = r.id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; draw(Dough.recipes.list()); }, 2500); draw(Dough.recipes.list()); } };\n      li.append(t, load, del); ul.append(li);\n    });\n  }\n  Dough.recipes.subscribe(draw);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "scrub-terminal", "name": "Scrub, terminal", "group": "Scrub in four more styles (with saved recipes)", "blurb": "Green phosphor on black (pale green in light mode), blinking cursor, hatched bar.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */\n  main { padding-bottom: 48px; }\n  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); }\n  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }\n  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }\n  #dl { font-size: 0.875rem; font-weight: 600; }\n  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }\n  #dbody[hidden] { display: none; }\n  #dsave { display: flex; gap: 8px; }\n  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }\n  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }\n  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }\n  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }\n  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }\n  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }\n  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }\n  #dnote[hidden] { display: none; }\n  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }\n\n  :root { color-scheme: light dark; --bg: #e2ecdf; --ink: #0d3b17; --mid: #4d7a58; --line: #9ab89f; --accent: #0d3b17; --on-accent: #e2ecdf; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #070a07; --ink: #6dff8a; --mid: #33995a; --line: #1c4a2a; --accent: #6dff8a; --on-accent: #070a07; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.25 ui-monospace, \"SF Mono\", \"Cascadia Mono\", Consolas, \"Liberation Mono\", monospace; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }\n  main { width: min(520px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 8px 12px 48px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); }\n  #tabs button { height: 40px; border: 0; background: none; color: var(--mid); font-weight: 600; }\n  #tabs button { font-size: 0.875rem; white-space: nowrap; }\n  #tabs button::before { content: \"[\"; margin-right: 4px; } #tabs button::after { content: \"]\"; margin-left: 4px; }\n  #tabs button[aria-selected=\"true\"] { background: var(--ink); color: var(--bg); }\n  #bar { display: flex; height: 22px; margin: 6px 0; border: 1px solid var(--ink); }\n  #bar span { font-size: 0; min-width: 4px; transition: flex-grow 150ms ease-out; border-right: 1px solid var(--bg); }\n  #bar span[data-id=\"flour\"] { background: var(--ink); }\n  #bar span[data-id=\"water\"] { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 6px); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: radial-gradient(var(--ink) 1.2px, transparent 1.6px) 0 0 / 6px 6px; }\n  #bar span[data-id=\"salt\"] { background: var(--mid); }\n  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 8px; padding: 8px 0 0; border-bottom: 1px dashed var(--line); }\n  .in .lab { align-self: start; color: var(--mid); font-weight: 600; text-transform: lowercase; }\n  .in .lab::before { content: \"> \"; color: var(--ink); }\n  .in .pre { display: flex; gap: 10px; margin-top: 6px; }\n  .in .pre button { padding: 4px 0; border: 0; background: none; color: var(--mid); text-decoration: underline; text-underline-offset: 3px; }\n  .in .pre button[aria-pressed=\"true\"] { color: var(--bg); background: var(--ink); text-decoration: none; padding: 4px 6px; }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 52px; font-weight: 600; font-size: 50px; line-height: 1; letter-spacing: -0.06em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; }\n  .num small { font-size: 1rem; letter-spacing: 0; color: var(--mid); }\n  .num::after { content: \"\"; width: 0.5ch; height: 0.85em; background: var(--ink); margin-left: 2px; animation: cur 1.1s steps(1) infinite; align-self: center; }\n  @keyframes cur { 50% { opacity: 0; } }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: var(--ink); color: var(--bg); border: 0; text-align: right; padding: 0 4px; }\n  .ruler { grid-column: 1 / -1; height: 12px; margin: 4px 0 0; position: relative; opacity: 0.7; }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: 0; width: 3px; height: 12px; margin-left: -1px; background: var(--ink); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); }\n  #choices button { height: 40px; border: 0; background: none; color: var(--mid); font-weight: 600; }\n  #choices button[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; padding-top: 6px; }\n  #out .cell { padding: 6px 0; }\n  #out .cell small { display: block; color: var(--mid); } #out .cell small::before { content: \"# \"; }\n  #out .cell b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.05em; }\n  #out .total { grid-column: 1 / -1; margin-top: 6px; padding: 8px 10px; background: var(--ink); color: var(--bg); }\n  #out .total small { color: var(--bg); } #out .total b { font-size: 50px; }\n  #plan { margin: 6px 0 0; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; } #plan::before { content: \"$ \"; color: var(--ink); }\n  #drawer { border-top: 1px solid var(--ink); } #dh .grip { display: none; } #dl::before { content: \"[+] \"; }\n  #dname { border: 1px solid var(--ink); border-radius: 0; } #dgo { border-radius: 0; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p), e);\n    });\n    el.addEventListener(\"pointermove\", e => {\n      if (!start || e.pointerId !== start.id || !start.k) return;\n      const d = axis === \"x\" ? e.clientX - start.x : start.y - e.clientY;\n      if (!start.moved && Math.abs(d) < 5) return;\n      start.moved = true;\n      const steps = Math.round(d / pxPerStep(start.k));\n      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }\n    });\n    const end = e => {\n      if (!start || e.pointerId !== start.id) return;\n      const s = start; start = null;\n      if (!s.moved && e.type === \"pointerup\") onTap && onTap(s.k, e);\n      onEnd && onEnd(s.k, s.moved);\n    };\n    el.addEventListener(\"pointerup\", end);\n    el.addEventListener(\"pointercancel\", end);\n  }\n\n  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);\n  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */\n  function snapshot() {\n    const p = pizzaValues();\n    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },\n             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };\n  }\n  function restore(s) {\n    if (!s || ![\"sourdough\", \"instant\", \"pizza\"].includes(s.mode)) return false;\n    state.mode = s.mode;\n    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };\n    state.instant = { ...DEFAULTS.instant, ...s.instant };\n    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };\n    emit(); return true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };\n  // critically damped-ish spring on o[key]; velocity kept in o[key + \"V\"]\n  function spring(o, key, target, dt, k = 220, d = 22) {\n    const v = (o[key + \"V\"] || 0) + (target - o[key]) * k * dt;\n    o[key + \"V\"] = v * Math.max(0, 1 - d * dt);\n    o[key] += o[key + \"V\"] * dt;\n    return o[key];\n  }\n  function canvas(el, draw) {\n    const ctx = el.getContext(\"2d\");\n    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;\n    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }\n    new ResizeObserver(resize).observe(el); resize();\n    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }\n    raf = requestAnimationFrame(frame);\n    document.addEventListener(\"visibilitychange\", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });\n    return { ctx, size: () => ({ w, h }) };\n  }\n  function pointer(el, hd) {\n    el.style.touchAction = \"none\";\n    const pos = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };\n    el.addEventListener(\"pointerdown\", e => { if (e.button) return; try { el.setPointerCapture(e.pointerId); } catch {} hd.down && hd.down(...pos(e), e ough.recipes.list()); } };\n      li.append(t, load, del); ul.append(li);\n    });\n  }\n  Dough.recipes.subscribe(draw);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "scrub-paper", "name": "Scrub, paper", "group": "Scrub in four more styles (with saved recipes)", "blurb": "A printed recipe card: serif, double rules, italic labels, small caps.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */\n  main { padding-bottom: 48px; }\n  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); }\n  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }\n  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }\n  #dl { font-size: 0.875rem; font-weight: 600; }\n  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }\n  #dbody[hidden] { display: none; }\n  #dsave { display: flex; gap: 8px; }\n  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }\n  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }\n  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }\n  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }\n  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }\n  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }\n  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }\n  #dnote[hidden] { display: none; }\n  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }\n\n  :root { color-scheme: light dark; --bg: #f3eee0; --ink: #181613; --mid: #766f60; --line: #cfc7b3; --accent: #b3261e; --on-accent: #ffffff; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #16140e; --ink: #eee7d4; --mid: #9a937f; --line: #38342a; --accent: #ef7b5d; --on-accent: #16140e; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 Georgia, \"Iowan Old Style\", \"Palatino Linotype\", \"Times New Roman\", serif; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 14px 18px 48px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); }\n  #tabs button { height: 42px; border: 0; background: none; color: var(--mid); font-variant: small-caps; letter-spacing: 0.08em; font-size: 1.0625rem; }\n  #tabs button[aria-selected=\"true\"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 -3px 0 var(--accent); }\n  #bar { display: flex; height: 10px; margin: 10px 0 2px; border: 1px solid var(--ink); }\n  #bar span { font-size: 0; min-width: 3px; transition: flex-grow 150ms ease-out; }\n  #bar span[data-id=\"flour\"] { background: var(--ink); } #bar span[data-id=\"water\"] { background: var(--accent); }\n  #bar span[data-id=\"starter\"], #bar span[data-id=\"yeast\"] { background: var(--mid); } #bar span[data-id=\"salt\"] { background: var(--line); }\n  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 0 8px; padding: 8px 0 0; border-bottom: 1px solid var(--ink); }\n  .in .lab { align-self: start; font-style: italic; color: var(--mid); font-size: 1.0625rem; text-transform: none; letter-spacing: 0; font-weight: 400; }\n  .in .pre { display: flex; gap: 14px; margin-top: 4px; }\n  .in .pre button { padding: 2px 0; border: 0; background: none; font-style: italic; color: var(--mid); border-bottom: 1px solid var(--mid); font-size: 0.9375rem; }\n  .in .pre button[aria-pressed=\"true\"] { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: 700; }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 56px; font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: lining-nums tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; }\n  .num small { font-size: 1.25rem; letter-spacing: 0; color: var(--mid); font-weight: 400; font-style: italic; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; border: 0; border-bottom: 2px solid var(--accent); text-align: right; padding: 0 2px; }\n  .ruler { grid-column: 1 / -1; height: 10px; margin: 2px 0 0; position: relative; opacity: 0.55; -webkit-mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); mask-image: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: -2px; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--ink); } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; }\n  #choices button { height: 38px; border: 0; background: none; font-style: italic; color: var(--mid); border-bottom: 1px solid var(--line); }\n  #choices button[aria-pressed=\"true\"] { color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }\n  #out .cell { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }\n  #out .cell small { font-style: italic; color: var(--mid); font-size: 1rem; } #out .cell b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }\n  #out .total { grid-column: 1 / -1; border-bottom: 0; border-top: 3px double var(--ink); margin-top: 6px; padding-top: 10px; }\n  #out .total small { font-variant: small-caps; letter-spacing: 0.08em; font-style: normal; color: var(--ink); font-size: 1.125rem; } #out .total b { font-size: 54px; letter-spacing: -0.03em; }\n  #plan { margin: 6px 0 0; color: var(--mid); font-size: 0.875rem; font-style: italic; line-height: 1.4; } #plan::before { content: \"Method. \"; font-style: normal; font-variant: small-caps; letter-spacing: 0.06em; color: var(--ink); font-weight: 700; }\n  #drawer { border-top: 3px double var(--ink); } #dh .grip { display: none; } #dl { font-variant: small-caps; letter-spacing: 0.08em; font-size: 1rem; }\n  #dname { border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; font-style: italic; } #dgo { border-radius: 0; font-variant: small-caps; letter-spacing: 0.06em; } #dlist li { border-width: 0 0 1px; border-radius: 0; }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdoug .choices.map(c => c.value).join();\n    if (key !== structKey) { structKey = key; build(model); }\n    paint(model);\n  });\n})();\n<\/script>\n<script>\n(() => {\n  const $ = s => document.querySelector(s), dh = $(\"#dh\"), body = $(\"#dbody\"), vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };\n  let skip = false, y0 = null, flash = 0, confirmId = null, confirmT = 0;\n  function setOpen(o) {\n    body.hidden = !o; dh.setAttribute(\"aria-expanded\", String(o));\n    if (o) { const m = Dough.model(); const f = m.fields[0]; $(\"#dname\").placeholder = m.title + \", \" + Dough.fmtVal(f); }\n  }\n  dh.addEventListener(\"pointerdown\", e => { y0 = e.clientY; try { dh.setPointerCapture(e.pointerId); } catch {} });\n  dh.addEventListener(\"pointerup\", e => { if (y0 == null) return; const d = y0 - e.clientY; y0 = null; if (Math.abs(d) > 24) { setOpen(d > 0); skip = true; } });\n  dh.addEventListener(\"click\", () => { if (skip) { skip = false; return; } setOpen(body.hidden); });\n  document.addEventListener(\"keydown\", e => { if (e.key === \"Escape\" && !body.hidden) setOpen(false); });\n  $(\"#dsave\").addEventListener(\"submit\", e => {\n    e.preventDefault(); const m = Dough.model();\n    const name = $(\"#dname\").value.trim() || (m.title + \", \" + Dough.fmtVal(m.fields[0]));\n    Dough.recipes.save(name); $(\"#dname\").value = \"\"; vib(10);\n    $(\"#dl\").textContent = Dough.recipes.persistent() ? \"Saved\" : \"Saved for this session\"; clearTimeout(flash); flash = setTimeout(() => draw(Dough.recipes.list()), 1500);\n  });\n  function draw(list) {\n    $(\"#dl\").textContent = list.length ? `Recipes (${list.length})` : \"Recipes\";\n    $(\"#dnote\").hidden = Dough.recipes.persistent();\n    const ul = $(\"#dlist\"); ul.replaceChildren();\n    if (!list.length) { const li = document.createElement(\"li\"); li.className = \"empty\"; li.textContent = \"No saved recipes.\"; ul.append(li); return; }\n    list.forEach(r => {\n      const li = document.createElement(\"li\");\n      const t = document.createElement(\"div\"); const b = document.createElement(\"b\"); b.textContent = r.name; const s = document.createElement(\"span\"); s.textContent = Dough.recipes.summary(r.snap); t.append(b, s);\n      const load = document.createElement(\"button\"); load.type = \"button\"; load.className = \"load\"; load.textContent = \"Load\"; load.setAttribute(\"aria-label\", \"Load \" + r.name);\n      load.onclick = () => { Dough.recipes.load(r.id); setOpen(false); vib(10); };\n      const del = document.createElement(\"button\"); del.type = \"button\"; del.textContent = confirmId === r.id ? \"Sure?\" : \"Delete\"; del.setAttribute(\"aria-label\", \"Delete \" + r.name);\n      del.onclick = () => { if (confirmId === r.id) { confirmId = null; Dough.recipes.remove(r.id); } else { confirmId = r.id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; draw(Dough.recipes.list()); }, 2500); draw(Dough.recipes.list()); } };\n      li.append(t, load, del); ul.append(li);\n    });\n  }\n  Dough.recipes.subscribe(draw);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "scrub-pop", "name": "Scrub, pop", "group": "Scrub in four more styles (with saved recipes)", "blurb": "Flat colour block per ingredient, chunky outlines, hard shadows.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  /* ---- recipe drawer (structure only; each style supplies colours and shape through its variables) ---- */\n  main { padding-bottom: 48px; }\n  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; background: var(--bg); color: var(--ink); border-top: 2px solid var(--line); }\n  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 44px; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; touch-action: none; }\n  #dh .grip { width: 36px; height: 4px; border-radius: 2px; background: var(--mid, var(--muted, currentColor)); opacity: 0.6; }\n  #dl { font-size: 0.875rem; font-weight: 600; }\n  #dbody { display: grid; gap: 10px; padding: 4px 16px 16px; max-height: 56dvh; overflow: auto; }\n  #dbody[hidden] { display: none; }\n  #dsave { display: flex; gap: 8px; }\n  #dname { flex: 1; min-width: 0; height: 48px; padding: 0 12px; border: 2px solid var(--line); background: transparent; color: inherit; font: inherit; border-radius: inherit; }\n  #dgo { height: 48px; padding: 0 18px; border: 0; background: var(--accent); color: var(--on-accent, #000); font: inherit; font-weight: 700; cursor: pointer; border-radius: inherit; }\n  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }\n  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: inherit; }\n  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  #dlist span { display: block; color: var(--mid, var(--muted, inherit)); font-size: 0.8125rem; }\n  #dlist button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); background: none; color: inherit; font: inherit; cursor: pointer; border-radius: inherit; }\n  #dlist button.load { background: var(--accent); color: var(--on-accent, #000); border-color: transparent; font-weight: 700; }\n  #dnote { margin: 0; padding: 8px 10px; border: 1px solid var(--line); font-size: 0.8125rem; line-height: 1.35; color: var(--mid, var(--muted, inherit)); border-radius: inherit; }\n  #dnote[hidden] { display: none; }\n  #dlist .empty { display: block; border: 0; color: var(--mid, var(--muted, inherit)); padding: 4px 0; }\n\n  :root { color-scheme: light dark; --bg: #fff1cf; --ink: #1b1b1b; --mid: #5d5649; --line: #1b1b1b; --accent: #ff5a5f; --on-accent: #ffffff; --on-block: #1b1b1b;\n          --flour: #ffd447; --water: #6ac6ff; --starter: #ff9e6d; --yeast: #ff8fb0; --salt: #ffffff; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #17151c; --ink: #f6f1e7; --mid: #a49e91; --line: #f6f1e7; --accent: #ff6b70; --on-accent: #17151c; --on-block: #17151c;\n          --flour: #e0b933; --water: #54aee3; --starter: #e68a58; --yeast: #e07a9a; --salt: #cfcbc2; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.2 \"Trebuchet MS\", \"Avenir Next\", \"Segoe UI\", system-ui, sans-serif; }\n  button, input { font: inherit; color: inherit; } button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }\n  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 52px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }\n  #tabs button { height: 40px; border: 3px solid var(--line); border-radius: 999px; background: var(--bg); font-weight: 700; font-size: 0.9375rem; box-shadow: 3px 3px 0 var(--line); transition: transform 150ms ease-out, box-shadow 150ms ease-out; }\n  #tabs button[aria-selected=\"true\"] { background: var(--accent); color: var(--on-accent); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }\n  #bar { display: flex; height: 22px; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg); }\n  #bar span { font-size: 0; min-width: 4px; transition: flex-grow 150ms ease-out; border-right: 3px solid var(--line); }\n  #bar span:last-child { border-right: 0; }\n  #bar span[data-id=\"flour\"] { background: var(--flour); } #bar span[data-id=\"water\"] { background: var(--water); }\n  #bar span[data-id=\"starter\"] { background: var(--starter); } #bar span[data-id=\"yeast\"] { background: var(--yeast); } #bar span[data-id=\"salt\"] { background: var(--salt); }\n  #inputs { display: grid; gap: 8px; }\n  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 8px; padding: 6px 14px 0; border: 3px solid var(--line); border-radius: 20px; box-shadow: 3px 3px 0 var(--line); color: var(--on-block); background: var(--salt); overflow: hidden; }\n  .in[data-key=\"flour\"], .in[data-key=\"balls\"] { background: var(--flour); }\n  .in[data-key=\"hydration\"], .in[data-key=\"pizzaHydration\"] { background: var(--water); }\n  .in[data-key=\"starterPct\"] { background: var(--starter); } .in[data-key=\"yeastPct\"] { background: var(--yeast); }\n  .in { --ink: var(--on-block); }\n  .in .lab { align-self: start; font-weight: 700; font-size: 1rem; }\n  .in .pre { display: flex; gap: 6px; margin-top: 6px; }\n  .in .pre button { height: 30px; padding: 0 12px; border: 2px solid var(--on-block); border-radius: 999px; background: transparent; color: var(--on-block); font-size: 0.8125rem; font-weight: 700; }\n  .in .pre button[aria-pressed=\"true\"] { background: var(--on-block); color: #fff6e0; }\n  .num { display: flex; align-items: baseline; gap: 6px; border: 0; background: none; padding: 0; min-height: 42px; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; color: var(--on-block); }\n  .num small { font-size: 1.125rem; letter-spacing: 0; opacity: 0.7; font-weight: 700; }\n  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: var(--bg); color: var(--ink); border: 3px solid var(--line); border-radius: 10px; text-align: right; padding: 0 4px; }\n  .ruler { grid-column: 1 / -1; height: 14px; margin: 4px -14px 0; position: relative; opacity: 0.6; color: var(--on-block); -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }\n  .ruler::after { content: \"\"; position: absolute; left: 50%; top: -2px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--accent); }\n  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } #choices[hidden] { display: none; }\n  #choices .grp { display: grid; grid-template-columns: 1fr 1fr; border: 3px solid var(--line); border-radius: 999px; overflow: hidden; box-shadow: 3px 3px 0 var(--line); background: var(--bg); }\n  #choices button { height: 38px; border: 0; background: none; font-weight: 700; font-size: 0.875rem; }\n  #choices button[aria-pressed=\"true\"] { background: var(--accent); color: var(--on-accent); }\n  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  #out .cell { padding: 5px 14px; border: 3px solid var(--line); border-radius: 18px; box-shadow: 3px 3px 0 var(--line); background: var(--salt); color: var(--on-block); }\n  #out .cell[data-id=\"flour\"] { background: var(--flour); } #out .cell[data-id=\"water\"] { background: var(--water); } #out .cell[data-id=\"starter\"] { background: var(--starter); } #out .cell[data-id=\"yeast\"] { background: var(--yeast); }\n  #out .cell[data-id=\"hyd\"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 0 8px; border: 0; box-shadow: none; background: none; color: var(--ink); }\n  #out .cell[data-id=\"hyd\"] b { font-size: 18px; margin: 0; }\n  #out .cell small { display: block; font-size: 0.8125rem; font-weight: 700; opacity: 0.75; } #out .cell b { display: block; margin-top: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }\n  #out .total { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); padding: 6px 16px; }\n  #out .total small { opacity: 0.85; } #out .total b { font-size: 38px; }\n  #plan { margin: 0; padding: 0 4px; color: var(--mid); font-size: 0.8125rem; line-height: 1.35; font-weight: 600; }\n  #drawer { border-top: 3px solid var(--line); border-radius: 20px 20px 0 0; } #dh .grip { height: 5px; background: var(--ink); opacity: 1; }\n  #dname { border: 3px solid var(--line); border-radius: 14px; } #dgo { border: 3px solid var(--line); border-radius: 14px; box-shadow: 3px 3px 0 var(--line); }\n  #dlist li { border: 3px solid var(--line); border-radius: 16px; } #dlist button { border: 2px solid var(--line); border-radius: 12px; font-weight: 700; } #dlist button.load { border-color: var(--line); }\n\n<\/style>\n<\/head>\n<body>\n<main>\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <div id=\"bar\" role=\"img\" aria-label=\"Proportions of the dough\"><\/div>\n  <section id=\"inputs\"><\/section>\n  <div id=\"choices\"><\/div>\n  <section id=\"out\" aria-live=\"polite\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<aside id=\"drawer\" aria-label=\"Saved recipes\">\n  <button id=\"dh\" type=\"button\" aria-expanded=\"false\" aria-controls=\"dbody\"><span class=\"grip\" aria-hidden=\"true\"><\/span><span id=\"dl\">Recipes<\/span><\/button>\n  <div id=\"dbody\" hidden>\n    <form id=\"dsave\"><input id=\"dname\" type=\"text\" maxlength=\"40\" aria-label=\"Recipe name\" placeholder=\"Name this recipe\" autocomplete=\"off\"><button id=\"dgo\" type=\"submit\">Save<\/button><\/form>\n    <p id=\"dnote\" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.<\/p>\n    <ul id=\"dlist\"><\/ul>\n  <\/div>\n<\/aside>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydrat \n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <section class=\"hero\"><output id=\"total\" aria-live=\"polite\"><\/output><span id=\"sub\"><\/span><\/section>\n  <svg id=\"jar\" viewBox=\"0 0 340 296\" role=\"group\" aria-label=\"Dough jar. Drag a layer up or down to change it.\"><\/svg>\n  <div id=\"choices\"><\/div>\n  <div id=\"fieldpick\" role=\"group\" aria-label=\"Value to edit\"><\/div>\n  <div id=\"editor\"><\/div>\n  <p id=\"plan\"><\/p>\n<\/main>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };\n  function drag(el, { key, axis = \"x\", pxPerStep = 10, onTap, onStart, onEnd, target }) {\n    let start = null;\n    el.style.touchAction = axis === \"x\" ? \"pan-y\" : \"pan-x\";\n    el.addEventListener(\"pointerdown\", e => {\n eturn true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };\n  // critically damped-ish spring on o[key]; velocity kept in o[key + \"V\"]\n  function spring(o, key, target, dt, k = 220, d = 22) {\n    const v = (o[key + \"V\"] || 0) + (target - o[key]) * k * dt;\n    o[key + \"V\"] = v * Math.max(0, 1 - d * dt);\n    o[key] += o[key + \"V\"] * dt;\n    return o[key];\n  }\n  function canvas(el, draw) {\n    const ctx = el.getContext(\"2d\");\n    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;\n    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }\n    new ResizeObserver(resize).observe(el); resize();\n    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }\n    raf = requestAnimationFrame(frame);\n    document.addEventListener(\"visibilitychange\", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });\n    return { ctx, size: () => ({ w, h }) };\n  }\n  function pointer(el, hd) {\n    el.style.to
