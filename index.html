<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dough Calculator</title>
<style>
  /* ---- shared motion layer: springs, entrances, indicators, the animated sheet ---- */
  :root { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); --ease: cubic-bezier(0.2, 0, 0, 1); }
  @supports (transition-timing-function: linear(0, 1)) {
    :root { --spring: linear(0, 0.0045, 0.0171 2.4%, 0.0674 5.2%, 0.2214 10.2%, 0.4357 15.3%, 0.7098 21.2%, 0.8421 24.1%, 0.9535 27.4%, 1.0207 30.6%, 1.0577 33.8%, 1.0687 37%, 1.0629 40.4%, 1.0436 44.4%, 1.0207 48.8%, 1.0043 54%, 0.9962 59.5%, 0.9944 65.5%, 0.998 72.4%, 1.0006 80%, 1); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; position: relative; }
  main { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 52px; transform-origin: 50% 0; }
  #tabwrap { position: relative; } #tabs { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); }
  #tabs button, .grp button { position: relative; z-index: 1; }
  .grp { position: relative; }
  .glide { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; width: 0; height: 0; transition: transform 560ms var(--spring), width 560ms var(--spring), height 560ms var(--spring); }
  #bar { display: flex; }
  #bar span { font-size: 0; min-width: 4px; flex-basis: 0; transition: flex-grow 620ms var(--spring); }
  #bar span[data-id="flour"] { background: var(--flour); } #bar span[data-id="water"] { background: var(--water); }
  #bar span[data-id="starter"] { background: var(--starter); } #bar span[data-id="yeast"] { background: var(--yeast); } #bar span[data-id="salt"] { background: var(--salt); }
  #inputs { display: grid; gap: 6px; }
  .in { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 2px 8px; overflow: hidden; transition: transform 420ms var(--spring), background-color 300ms var(--ease), box-shadow 300ms var(--ease); }
  .in > div:first-child { display: flex; flex-wrap: wrap; align-items: center; align-self: start; gap: 2px 10px; }
  .in .pre { display: flex; gap: 6px; }
  .num { display: flex; align-items: baseline; gap: 4px; border: 0; background: none; padding: 0; min-height: 40px; line-height: 1; font-variant-numeric: tabular-nums; cursor: ew-resize; user-select: none; -webkit-user-select: none; transform-origin: 100% 100%; transition: transform 380ms var(--spring); }
  .in.live .num { transform: scale(1.06); }
  .num input { width: 3.4ch; font: inherit; letter-spacing: inherit; background: transparent; border: 0; text-align: right; padding: 0 2px; }
  .ruler { grid-column: 1 / -1; position: relative; }
  .ruler::after { content: ""; position: absolute; left: 50%; transition: height 300ms var(--spring); }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } #choices[hidden] { display: none; }
  #choices .grp:only-child { grid-column: 1 / -1; }
  #choices .grp { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
  #out { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #out .total { grid-column: 1 / -1; }
  #out .cell[data-id="hyd"] { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; padding: 2px 8px !important; background: none !important; box-shadow: none !important; border: 0 !important; }
  #plan { margin: 0; padding: 0 6px; font-size: 0.8125rem; line-height: 1.35; }
  @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(0.97); } }
  .enter { animation: enter 600ms var(--spring) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .rip { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: 0.2; transform: scale(0); animation: rip 650ms var(--ease) forwards; }
  @keyframes rip { to { transform: scale(1); opacity: 0; } }
  button:not(.num):active { transform: scale(0.96); }
  #tabs button, .grp button, .pre button, #dgo { transition: transform 300ms var(--spring), background-color 250ms var(--ease), color 250ms var(--ease), border-radius 350ms var(--spring); }

  /* animated bottom sheet */
  #scrim { position: fixed; inset: 0; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 450ms var(--ease); }
  body.sheet-open #scrim { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; width: min(560px, 100%); margin: 0 auto; }
  #dh { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 48px; border: 0; background: none; touch-action: none; }
  #dh .grip { width: 36px; height: 5px; border-radius: 3px; background: currentColor; opacity: 0.3; transition: width 400ms var(--spring); }
  #drawer.open #dh .grip { width: 48px; }
  #dl { font-size: 0.875rem; font-weight: 600; }
  #dwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 620ms var(--spring); }
  #drawer.open #dwrap { grid-template-rows: 1fr; }
  #dbody { min-height: 0; overflow: hidden; display: grid; gap: 10px; padding: 0 16px; visibility: hidden; transition: visibility 0s 620ms, padding 620ms var(--spring); }
  #drawer.open #dbody { visibility: visible; overflow: auto; max-height: 60dvh; padding: 4px 16px 18px; transition-delay: 0s; }
  #dsave { display: flex; gap: 8px; }
  #dname { flex: 1; min-width: 0; height: 52px; padding: 0 14px; background: transparent; border: 2px solid transparent; }
  #dgo { height: 52px; padding: 0 22px; border: 0; font-weight: 700; }
  #dnote { margin: 0; padding: 10px 12px; font-size: 0.8125rem; line-height: 1.35; } #dnote[hidden] { display: none; }
  #dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 12px; }
  #dlist b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dlist span { display: block; font-size: 0.8125rem; }
  #dlist button { min-height: 44px; padding: 0 16px; border: 0; background: none; }
  #dlist .empty { display: block; padding: 4px 0; }
  #swatches { display: flex; gap: 10px; padding-top: 2px; }
  #swatches button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--sw); }
  #swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ring-gap, var(--bg)), 0 0 0 6px var(--sw); transform: scale(1.04); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0s !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; } }
  /* ===== Rams panel, Material You Expressive: tonal palette from one hue that morphs, springy shapes, ink ripples ===== */
  @property --hue { syntax: "<number>"; inherits: true; initial-value: 50; }
  :root {
    color-scheme: light dark; --hue: 50; transition: --hue 800ms cubic-bezier(0.2, 0, 0, 1);
    --primary: oklch(0.45 0.13 var(--hue)); --on-primary: oklch(0.98 0.01 var(--hue));
    --pc: oklch(0.9 0.07 var(--hue)); --on-pc: oklch(0.24 0.07 var(--hue));
    --sc: oklch(0.92 0.04 var(--hue)); --on-sc: oklch(0.3 0.05 var(--hue));
    --bg: oklch(0.985 0.008 var(--hue)); --s1: oklch(0.965 0.014 var(--hue)); --s2: oklch(0.945 0.02 var(--hue)); --s3: oklch(0.925 0.026 var(--hue));
    --ink: oklch(0.22 0.02 var(--hue)); --mid: oklch(0.48 0.03 var(--hue)); --line: oklch(0.82 0.035 var(--hue)); --ring-gap: var(--s3);
    --flour: oklch(0.82 0.1 85); --water: oklch(0.74 0.1 235); --starter: oklch(0.72 0.1 50); --yeast: oklch(0.74 0.12 5); --salt: oklch(0.86 0.02 var(--hue));
    --scrim: oklch(0 0 0 / 0.32);
  }
  @media (prefers-color-scheme: dark) { :root {
    --primary: oklch(0.82 0.1 var(--hue)); --on-primary: oklch(0.25 0.06 var(--hue));
    --pc: oklch(0.38 0.08 var(--hue)); --on-pc: oklch(0.92 0.05 var(--hue));
    --sc: oklch(0.3 0.04 var(--hue)); --on-sc: oklch(0.9 0.03 var(--hue));
    --bg: oklch(0.17 0.012 var(--hue)); --s1: oklch(0.2 0.016 var(--hue)); --s2: oklch(0.23 0.02 var(--hue)); --s3: oklch(0.26 0.024 var(--hue));
    --ink: oklch(0.93 0.015 var(--hue)); --mid: oklch(0.72 0.03 var(--hue)); --line: oklch(0.38 0.03 var(--hue));
    --flour: oklch(0.72 0.1 85); --water: oklch(0.66 0.1 235); --starter: oklch(0.66 0.1 50); --yeast: oklch(0.68 0.12 5); --salt: oklch(0.5 0.02 var(--hue));
    --scrim: oklch(0 0 0 / 0.55);
  } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.2 "Google Sans Flex", "Google Sans", Roboto, system-ui, sans-serif; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  button:not(.num), .glide { overflow: hidden; }

  /* connected button groups with a gliding selected pill */
  #tabs, .grp { background: var(--sc); border-radius: 30px; padding: 4px; gap: 4px; }
  #tabs button, .grp button { height: 44px; border: 0; border-radius: 26px; background: none; color: var(--on-sc); font-size: 0.9375rem; font-weight: 600; letter-spacing: 0.01em; }
  #tabs button[aria-selected="true"], .grp button[aria-pressed="true"] { color: var(--on-primary); }
  .glide { background: var(--primary); border-radius: 26px; }
  #tabs button:active, .grp button:active { border-radius: 14px; }
  #bar { height: 10px; gap: 4px; margin: 2px 6px; }
  #bar span { border-radius: 5px; }

  .in { padding: 10px 16px 0; background: var(--s1); border-radius: 28px; }
  .in.live { background: var(--s3); transform: scale(1.015); box-shadow: 0 6px 18px oklch(0 0 0 / 0.12); }
  .in .lab { font-size: 0.8125rem; color: var(--mid); font-weight: 600; letter-spacing: 0.02em; }
  .pre button { height: 32px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--on-sc); font-size: 0.8125rem; font-weight: 600; }
  .pre button[aria-pressed="true"] { background: var(--pc); color: var(--on-pc); border-color: transparent; border-radius: 16px; }
  .pre button:active { border-radius: 16px; }
  .num { font-weight: 500; font-size: 48px; letter-spacing: -0.04em; color: var(--ink); }
  .num small { font-size: 0.9375rem; letter-spacing: 0; color: var(--mid); font-weight: 600; }
  .num input { color: var(--ink); border-bottom: 2px solid var(--primary); }
  .ruler { height: 12px; margin: 2px -16px 0; opacity: 0.55; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
  .ruler::after { top: 0; width: 4px; height: 12px; margin-left: -2px; border-radius: 2px; background: var(--primary); }
  .in.live .ruler::after { top: -6px; height: 22px; }

  #out .cell { padding: 6px 16px; background: var(--s2); border-radius: 24px; }
  #out .cell small { display: block; font-size: 0.8125rem; color: var(--mid); font-weight: 600; letter-spacing: 0.02em; }
  #out .cell b { display: block; margin-top: 1px; font-weight: 500; font-size: 26px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  #out .cell[data-id="hyd"] small { color: var(--mid); } #out .cell[data-id="hyd"] b { font-size: 18px; margin: 0; color: var(--ink); }
  #out .total { padding: 8px 20px; background: var(--pc); color: var(--on-pc); border-radius: 34px 34px 34px 12px; }
  #out .total small { color: var(--on-pc); opacity: 0.8; } #out .total b { font-size: 44px; }
  #plan { color: var(--mid); }

  #scrim { background: var(--scrim); }
  #drawer { background: var(--s3); border-radius: 30px 30px 0 0; box-shadow: 0 -4px 18px oklch(0 0 0 / 0.12); }
  #dh { color: var(--mid); }
  #dname { background: var(--s1); border-radius: 18px; color: var(--ink); }
  #dname:focus { outline: none; border-color: var(--primary); }
  #dgo { background: var(--primary); color: var(--on-primary); border-radius: 18px; }
  #dgo:active { border-radius: 999px; }
  #dnote { background: var(--sc); color: var(--on-sc); border-radius: 16px; }
  #dlist li { background: var(--s1); border-radius: 22px; }
  #dlist span { color: var(--mid); }
  #dlist button { border-radius: 16px; color: var(--mid); font-weight: 600; }
  #dlist button.load { background: var(--primary); color: var(--on-primary); }
  #dlist button:active { border-radius: 999px; }
  #dlist .empty { color: var(--mid); }

</style>
</head>
<body data-ripple="1" data-glide="spring">
<main>
  <div id="tabwrap"><nav id="tabs" role="tablist" aria-label="Dough type"></nav><span class="glide" id="tabglide" aria-hidden="true"></span></div>
  <div id="bar" role="img" aria-label="Proportions of the dough"></div>
  <section id="inputs"></section>
  <div id="choices"></div>
  <section id="out" aria-live="polite"></section>
  <p id="plan"></p>
</main>
<div id="scrim" aria-hidden="true"></div>
<aside id="drawer" aria-label="Saved recipes">
  <button id="dh" type="button" aria-expanded="false" aria-controls="dbody"><span class="grip" aria-hidden="true"></span><span id="dl">Recipes</span></button>
  <div id="dwrap" inert><div id="dbody">
    <form id="dsave"><input id="dname" type="text" maxlength="40" aria-label="Recipe name" placeholder="Name this recipe" autocomplete="off"><button id="dgo" type="submit">Save</button></form>
    <p id="dnote" hidden>Your browser blocks storage in this view, so recipes only last until you close the page. Open this file in a normal browser tab to keep them.</p>
    <ul id="dlist"></ul>
    <div id="swatches" role="group" aria-label="Accent colour"></div>
  </div></div>
</aside>

<script>
/* Shared core: the original calculator maths and saved state, behind a small API.
   Every concept below only draws a different interface on top of this. */
const Dough = (() => {
  const STORAGE_KEY = "dough-ratio-assistant:v1";
  const DEFAULTS = {
    mode: "sourdough",
    sourdough: { flour: 500, hydration: 70, starterPct: 5 },
    instant: { flour: 500, hydration: 70 },
    pizza: { balls: 8, hydration: 64, yeastType: "instant", proof: "nextDay", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }
  };
  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };
  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };

  /* ---- original calculations, unchanged ---- */
  function calculateSourdough({ flour, hydration, starterPct }) {
    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;
    const totalFlour = flour + starterFlour;
    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);
    const salt = totalFlour * 0.02;
    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculateInstant({ flour, hydration }) {
    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;
    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };
  }
  function calculatePizzaInstant({ balls, hydration, yeastPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;
    const flour = target / (1 + h + s + y);
    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };
  }
  function calculatePizzaSourdough({ balls, hydration, starterPct }) {
    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;
    const totalFlour = target / (1 + h + s);
    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;
    const water = Math.max(0, totalFlour * h - starterWater);
    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };
  }
  function calculatePizza(p) {
    return p.yeastType === "sourdough"
      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })
      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });
  }
  function bakeManualText(mode, p) {
    if (mode === "pizza") {
      if (p.yeastType === "instant" && p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      if (p.yeastType === "instant") return "Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.";
      if (p.proof === "sameDay") return "Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.";
      return "Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.";
    }
    if (mode === "sourdough") return "Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.";
    return "Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.";
  }

  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      const sp = saved && saved.pizza;
      return {
        ...DEFAULTS, ...saved,
        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },
        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },
        pizza: {
          ...DEFAULTS.pizza,
          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,
          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,
          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,
          hydration: DEFAULTS.pizza.hydration,
          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }
        }
      };
    } catch { return structuredClone(DEFAULTS); }
  }
  let state = loadState();
  if (!["sourdough", "instant", "pizza"].includes(state.mode)) state.mode = "sourdough";
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));
    } catch {}
  }

  /* ---- field specs: what the UI may edit, with limits and presets ---- */
  const SPEC = {
    flour:          { label: "Flour",        unit: "g", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },
    hydration:      { label: "Hydration",    unit: "%", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },
    starterPct:     { label: "Starter",      unit: "%", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },
    balls:          { label: "Dough balls",  unit: "",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },
    pizzaHydration: { label: "Hydration",    unit: "%", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },
    yeastPct:       { label: "Yeast",        unit: "%", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }
  };
  const CHOICES = {
    yeastType: { label: "Leavening", options: [["instant", "Instant yeast"], ["sourdough", "Sourdough"]] },
    proof:     { label: "Proofing",  options: [["sameDay", "Same day"], ["nextDay", "Next day"]] }
  };
  const MODES = [["sourdough", "Sourdough"], ["instant", "Instant yeast"], ["pizza", "Pizza"]];
  const MODE_TITLE = { sourdough: "Sourdough bread", instant: "Instant yeast bread", pizza: "Neapolitan pizza" };

  function breadValues() {
    const cur = state[state.mode];
    return {
      flour: clampNumber(cur.flour, 1, 10000, 500),
      hydration: clampNumber(cur.hydration, 40, 100, 70),
      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)
    };
  }
  function pizzaValues() {
    const p = state.pizza;
    return {
      balls: clampNumber(p.balls, 1, 48, 8),
      hydration: clampNumber(p.hydration, 50, 80, 64),
      yeastType: p.yeastType === "sourdough" ? "sourdough" : "instant",
      proof: p.proof === "sameDay" ? "sameDay" : "nextDay",
      instantYeastPct: {
        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),
        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)
      }
    };
  }

  function fieldKeys() {
    if (state.mode === "pizza") return ["balls", "pizzaHydration"].concat(pizzaValues().yeastType === "instant" ? ["yeastPct"] : []);
    return state.mode === "sourdough" ? ["flour", "hydration", "starterPct"] : ["flour", "hydration"];
  }
  function valueOf(key) {
    if (state.mode === "pizza") {
      const p = pizzaValues();
      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];
    }
    return breadValues()[key];
  }

  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */
  function timeline(mode, p) {
    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + " h" : ""), fridge: !!fridge });
    if (mode === "sourdough") return [T("Mix"), T("Rest", 4), T("Basket"), T("Bake")];
    if (mode === "instant") return [T("Mix"), T("Rest", 1.5, "1-2 h"), T("Basket"), T("Bake")];
    const sd = p.yeastType === "sourdough", next = p.proof === "nextDay";
    if (!next) return [T("Mix"), T("Rest", 4), T("Divide"), T("Double"), T("Bake")];

      const pre = H("div", { class: "pre" }, ...f.presets.map(p => H("button", { type: "button", "data-p": p, text: p + (f.unit === "g" ? " g" : f.unit), onclick: () => Dough.set(f.key, p) })));
      const row = H("div", { class: "in enter", "data-key": f.key, style: `--i:${fi}` }, H("div", {}, H("div", { class: "lab", text: f.label }), pre), num, ruler);
      inputs.append(row);
      Dough.drag(num, { key: f.key, axis: "x", pxPerStep: () => PX[f.key] || 10, onTap: () => edit(num, f), onStart: () => row.classList.add("live"), onEnd: () => row.classList.remove("live") });
      num.addEventListener("keydown", e => {
        const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
        if (dir) { e.preventDefault(); Dough.step(f.key, dir); }
        if (e.key === "Enter") { e.preventDefault(); edit(num, f); }
      });
    });
    const groups = groupsOf(model);
    const ch = $("#choices"); ch.hidden = !groups.length;
    const csig = groups.map(g => g.label + g.options.map(o => o[0]).join()).join("|");
    if (ch._sig !== csig) {
      ch._sig = csig; ch.replaceChildren();
      groups.forEach(g => ch.append(H("div", { class: "grp enter", role: "group", "aria-label": g.label }, H("span", { class: "glide", "aria-hidden": "true" }),
        ...g.options.map(([v, l]) => H("button", { type: "button", text: l === "Instant yeast" ? "Yeast" : l, "data-v": v, "aria-pressed": String(g.value === v), onclick: () => g.apply(v) })))));
    }
    justBuilt = true; requestAnimationFrame(relayout);
  }

  function edit(num, f) {
    const val = num.querySelector(".val"); if (num.querySelector("input")) return;
    const input = H("input", { type: "text", inputmode: "decimal", "aria-label": f.label, value: Dough.fmtNum(valueOf(f.key), f.dec) });
    input.style.width = "4.2ch";
    val.replaceChildren(input); input.focus(); input.select();
    const done = () => { const v = parseFloat(input.value.replace(",", ".")); if (Number.isFinite(v)) Dough.set(f.key, v); else paint(m); };
    input.addEventListener("blur", done);
    input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); if (e.key === "Escape") { input.value = ""; input.blur(); } });
    input.addEventListener("pointerdown", e => e.stopPropagation());
  }
  const valueOf = key => m.fields.find(f => f.key === key).value;

  function paint(model) {
    m = model;
    model.fields.forEach(f => {
      const row = $(`.in[data-key="${f.key}"]`); if (!row) return;
      const val = row.querySelector(".val");
      if (!val.querySelector("input")) roll(val, f.value, v => Dough.fmtNum(v, f.dec), "i:" + f.key, 140);
      row.querySelector(".num").setAttribute("aria-valuenow", f.value);
      row.querySelector(".ruler").style.backgroundPositionX = `${-(f.value / f.drag) * (PX[f.key] || 10)}px`;
      row.querySelectorAll(".pre button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.p) === f.value)));
    });
    groupsOf(model).forEach(g => document.querySelectorAll(`#choices [role=group][aria-label="${g.label}"] button`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === g.value))));

    // proportion bar
    const bar = $("#bar");
    if (bar.children.length !== model.parts.length || [...bar.children].some((s, i) => s.dataset.id !== model.parts[i].id)) {
      bar.replaceChildren(...model.parts.map(p => H("span", { "data-id": p.id, text: p.label })));
    }
    model.parts.forEach((p, i) => { const s = bar.children[i]; s.style.flexGrow = p.g; s.style.flexBasis = "0"; s.textContent = p.g / model.total > 0.07 ? p.label : ""; });

    // outputs
    const out = $("#out"); out.replaceChildren();
    const mk = (cls, id, label, val, fmt) => { const b = H("b"); out.append(H("div", { class: cls, "data-id": id }, H("small", { text: label }), b)); roll(b, val, fmt, "o:" + id); };
    model.parts.filter(p => model.mode === "pizza" || p.id !== "flour").forEach(p => mk("cell", p.id, p.label === "Yeast" ? "Instant yeast" : p.label, p.g, Dough.fmtG));
    mk("cell", "hyd", "Final hydration", model.finalHydration, v => Dough.fmtNum(v, 1) + "%");
    mk("cell total", "total", "Total dough", model.total, Dough.fmtG);
    if (justBuilt) { justBuilt = false; [...out.children].forEach((c, i) => { c.classList.add("enter"); c.style.setProperty("--i", i + 3); }); }
    $("#plan").textContent = model.plan;
    relayout();
  }

  Dough.subscribe(model => {
    const key = model.mode + "|" + model.fields.map(f => f.key).join() + "|" + model.choices.map(c => c.value).join();
    if (key !== structKey) { structKey = key; build(model); }
    paint(model);
  });
})();
</script>
<script>
(() => {
  const $ = s => document.querySelector(s), dh = $("#dh"), drawer = $("#drawer"), wrap = $("#dwrap"), vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
  let skip = false, y0 = null, flash = 0, confirmId = null, confirmT = 0;
  function setOpen(o) {
    drawer.classList.toggle("open", o); document.body.classList.toggle("sheet-open", o); dh.setAttribute("aria-expanded", String(o)); wrap.inert = !o;
    if (o) { const m = Dough.model(); const f = m.fields[0]; $("#dname").placeholder = m.title + ", " + Dough.fmtVal(f); }
  }
  dh.addEventListener("pointerdown", e => { y0 = e.clientY; try { dh.setPointerCapture(e.pointerId); } catch {} });
  dh.addEventListener("pointerup", e => { if (y0 == null) return; const d = y0 - e.clientY; y0 = null; if (Math.abs(d) > 24) { setOpen(d > 0); skip = true; } });
  dh.addEventListener("click", () => { if (skip) { skip = false; return; } setOpen(!drawer.classList.contains("open")); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && drawer.classList.contains("open")) setOpen(false); });
  $("#dsave").addEventListener("submit", e => {
    e.preventDefault(); const m = Dough.model();
    const name = $("#dname").value.trim() || (m.title + ", " + Dough.fmtVal(m.fields[0]));
    Dough.recipes.save(name); $("#dname").value = ""; vib(10);
    $("#dl").textContent = Dough.recipes.persistent() ? "Saved" : "Saved for this session"; clearTimeout(flash); flash = setTimeout(() => draw(Dough.recipes.list()), 1500);
  });
  function draw(list) {
    $("#dl").textContent = list.length ? `Recipes (${list.length})` : "Recipes";
    $("#dnote").hidden = Dough.recipes.persistent();
    const ul = $("#dlist"); ul.replaceChildren();
    if (!list.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "No saved recipes."; ul.append(li); return; }
    list.forEach(r => {
      const li = document.createElement("li");
      const t = document.createElement("div"); const b = document.createElement("b"); b.textContent = r.name; const s = document.createElement("span"); s.textContent = Dough.recipes.summary(r.snap); t.append(b, s);
      const load = document.createElement("button"); load.type = "button"; load.className = "load"; load.textContent = "Load"; load.setAttribute("aria-label", "Load " + r.name);
      load.onclick = () => { Dough.recipes.load(r.id); setOpen(false); vib(10); };
      const del = document.createElement("button"); del.type = "button"; del.textContent = confirmId === r.id ? "Sure?" : "Delete"; del.setAttribute("aria-label", "Delete " + r.name);
      del.onclick = () => { if (confirmId === r.id) { confirmId = null; Dough.recipes.remove(r.id); } else { confirmId = r.id; clearTimeout(confirmT); confirmT = setTimeout(() => { confirmId = null; draw(Dough.recipes.list()); }, 2500); draw(Dough.recipes.list()); } };
      li.append(t, load, del); ul.append(li);
    });
  }
  Dough.recipes.subscribe(draw);
  $("#scrim").addEventListener("click", () => setOpen(false));
  // accent colour swatches (Material You morphs the whole palette from one hue)
  const sw = $("#swatches"); let hue = 50; try { const s = parseInt(localStorage.getItem("dough-hue")); if (Number.isFinite(s)) hue = s; } catch {}
  const applyHue = h => { document.documentElement.style.setProperty("--hue", h); sw.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.h) === h))); try { localStorage.setItem("dough-hue", h); } catch {} };
  [50, 165, 285, 15, 250].forEach(h => { const b = document.createElement("button"); b.type = "button"; b.dataset.h = h; b.setAttribute("aria-label", "Accent colour " + h); b.style.setProperty("--sw", `oklch(0.62 0.14 ${h})`); b.onclick = () => { applyHue(h); vib(8); }; sw.append(b); });
  applyHue(hue);
})();
</script>
