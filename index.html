oup": "Round 1", "blurb": "The recipe as a sentence. Tap or drag the words.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  :root { color-scheme: light dark; --bg: #faf6ee; --ink: #231c14; --muted: #7b6d5e; --line: #ddd2c1; --accent: #b4491e; --tint: #f1dccd; --on-accent: #fff; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #181410; --ink: #efe6d8; --muted: #a39482; --line: #3a3128; --accent: #f0925f; --tint: #3a2519; --on-accent: #1c1008; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.35 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\n  button, input { font: inherit; color: inherit; }\n  button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }\n  main { width: min(560px, 100%); margin: 0 auto; min-height: 100dvh; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 20px; }\n\n  #sentence { margin: 0; font: 400 28px/1.4 Georgia, \"Iowan Old Style\", \"Palatino Linotype\", serif; letter-spacing: -0.01em; }\n  .tok { padding: 0 2px; margin: 0 -1px; border: 0; border-bottom: 2px solid var(--accent); background: none; color: var(--accent); font: inherit; font-weight: 600; white-space: nowrap; border-radius: 0; touch-action: pan-y; }\n  .tok[aria-expanded=\"true\"] { background: var(--accent); color: var(--on-accent); border-radius: 4px; border-bottom-color: transparent; }\n\n  #receipt { margin: 0; padding: 0; list-style: none; }\n  #receipt li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 1.0625rem; }\n  #receipt li::after { content: none; }\n  #receipt .dots { flex: 1; border-bottom: 1px dotted var(--muted); transform: translateY(-4px); min-width: 16px; }\n  #receipt .v { font-weight: 600; font-variant-numeric: tabular-nums; }\n  #receipt .total { margin-top: 8px; padding-top: 12px; border-top: 2px solid var(--ink); align-items: baseline; }\n  #receipt .total .n { font-weight: 600; }\n  #receipt .total .v { font: 600 40px/1 Georgia, \"Iowan Old Style\", serif; letter-spacing: -0.02em; }\n  #receipt .note { color: var(--muted); font-size: 0.9375rem; padding-top: 0; }\n\n  #dock { margin-top: auto; min-height: 112px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 12px; align-content: start; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.9375rem; }\n  .dock-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 0.9375rem; }\n  .dock-head button { min-height: 36px; padding: 0 12px; border: 0; background: none; color: var(--accent); font-weight: 600; }\n  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n  .row .step { width: 52px; height: 48px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 1.5rem; }\n  .row .step:active { background: var(--tint); }\n  .row input { width: 112px; height: 48px; border: 0; border-bottom: 2px solid var(--ink); background: none; text-align: center; font: 600 1.625rem system-ui; border-radius: 0; font-variant-numeric: tabular-nums; }\n  .row .unit { color: var(--muted); margin-left: -4px; }\n  .chip { min-height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: none; }\n  .chip[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }\n<\/style>\n<\/head>\n<body>\n<main>\n  <p id=\"sentence\"><\/p>\n  <ul id=\"receipt\" aria-live=\"polite\"><\/ul>\n  <section id=\"dock\"><\/section>\n<\/main>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };\n  function drag(el, { key, axis = \"x\", pxPerStep = 10, onTap, onStart, onEnd, target }) {\n    let start = null;\n    el.style.touchAction = axis === \"x\" ? \"pan-y\" : \"pan-x\";\n    el.addEventListener(\"pointerdown\", e => {\n      if (e.button) return;\n      const k = typeof key === \"function\" ? key(e) : key;\n      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };\n      try { el.setPointerCapture(e.pointerId); } catch {}\n      onStart && onStart(k, e);\n    });\n    el.addEventListener(\"pointermove\", e => {\n      if (!start || e.pointerId !== start.id || !start.k) return;\n      const d = axis === \"x\" ? e.clientX - start.x : start.y - e.clientY;\n      if (!start.moved && Math.abs(d) < 5) return;\n      start.moved = true;\n      const steps = Math.round(d / pxPerStep(start.k));\n      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }\n    });\n    const end = e => {\n      if (!start || e.pointerId !== start.id) return;\n      const s = start; start = null;\n      if (!s.moved && e.type === \"pointerup\") onTap && onTap(s.k, e);\n      onEnd && onEnd(s.k, s.moved);\n    };\n    el.addEventListener(\"pointerup\", end);\n    el.addEventListener(\"pointercancel\", end);\n  }\n\n  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);\n  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */\n  function snapshot() {\n    const p = pizzaValues();\n    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },\n             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };\n  }\n  function restore(s) {\n    if (!s || ![\"sourdough\", \"instant\", \"pizza\"].includes(s.mode)) return false;\n    state.mode = s.mode;\n    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };\n    state.instant = { ...DEFAULTS.instant, ...s.instant };\n    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };\n    emit(); return true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } };\n  // critically damped-ish spring on o[key]; velocity kept in o[key + \"V\"]\n  function spring(o, key, target, dt, k = 220, d = 22) {\n    const v = (o[key + \"V\"] || 0) + (target - o[key]) * k * dt;\n    o[key + \"V\"] = v * Math.max(0, 1 - d * dt);\n    o[key] += o[key + \"V\"] * dt;\n    return o[key];\n  }\n  function canvas(el, draw) {\n    const ctx = el.getContext(\"2d\");\n    let w = 1, h = 1, dpr = 1, last = performance.now(), t = 0, raf = 0;\n    function resize() { const r = el.getBoundingClientRect(); dpr = Math.min(window.devicePixelRatio || 1, 3); w = Math.max(1, Math.round(r.width)); h = Math.max(1, Math.round(r.height)); el.width = Math.round(w * dpr); el.height = Math.round(h * dpr); }\n    new ResizeObserver(resize).observe(el); resize();\n    function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(ctx, w, h, dt, t); raf = requestAnimationFrame(frame); }\n    raf = requestAnimationFrame(frame);\n    document.addEventListener(\"visibilitychange\", () => { cancelAnimationFrame(raf); if (!document.hidden) { last = performance.now(); raf = requestAnimationFrame(frame); } });\n    return { ctx, size: () => ({ w, h }) };\n  }\n  function pointer(el, hd) {\n    el.style.touchAction = \"none\";\n    const pos = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };\n    el.addEventListener(\"pointerdown\", e => { if (e.button) return; try { el.setPointerCapture(e.pointerId); } catch {} hd.down && hd.down(...pos(e), e); });\n    el.addEventListener(\"pointermove\", e => { hd.move && hd.move(...pos(e), e); });\n    const up = e => { hd.up && hd.up(...pos(e), e); };\n    el.addEventListener(\"pointerup\", up); el.addEventListener(\"pointercancel\", up);\n  }\n  // simple particle pool\n  function particles() {\n    const ps = [];\n    return {\n      burst(x, y, n, o = {}) { for (let i = 0; i < n; i++) { const a = (o.angle ?? -Math.PI / 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2), s = (o.speed ?? 120) * (0.4 + Math.random() * 0.8); ps.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: (o.life ?? 0.7) * (0.6 + Math.random() * 0.6), r: (o.r ?? 3) * (0.6 + Math.random() * 0.8), c: o.color || \"#fff\", g: o.gravity ?? 300 }); } },\n      update(dt) { for (let i = ps.length - 1; i >= 0; i--) { const p = ps[i]; p.life += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life >= p.max) ps.splice(i, 1); } },\n      draw(ctx) { for (const p of ps) { ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill(); } ctx.globalAlpha = 1; }\n    };\n  }\n  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();\n  return { clamp, lerp, ease, spring, canvas, pointer, particles, css };\n})();\n\n/* ---- Accessibility layer for canvas concepts: every field and choice as real, visually hidden controls ---- */\nDough.a11y = function () {\n  const st = document.createElement(\"style\");\n  st.textContent = \".dough-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.dough-sr:focus-within{position:fixed;left:8px;right:8px;bottom:8px;width:auto;height:auto;clip:auto;white-space:normal;background:#fff;color:#000;border:2px solid #000;border-radius:12px;padding:10px;z-index:1000;display:grid;gap:8px;font:16px system-ui}.dough-sr label{display:grid;gap:2px}.dough-sr input,.dough-sr button{font:inherit;min-height:40px}\";\n  document.head.append(st);\n  const root = document.createElement(\"div\"); root.className = \"dough-sr\"; root.setAttribute(\"role\", \"group\"); root.setAttribute(\"aria-label\", \"Dough calculator controls\"); document.body.append(root);\n  const live = document.createElement(\"div\"); live.setAttribute(\"aria-live\", \"polite\");\n  let sig = \"\ re: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC[k], value: valueOf(k) })),\n      choices: pizza ? Object.entries(CHOICES).map(([k, c]) => ({ key: k, ...c, value: p[k] })) : [],\n      plan: bakeManualText(mode, p),\n      timeline: timeline(mode, p),\n      pieces: pizza ? p.balls : null\n    };\n  }\n\n  const subs = new Set();\n  const emit = () => { saveState(); const m = model(); subs.forEach(fn => fn(m)); };\n\n  function set(key, raw) {\n    const sp = SPEC[key];\n    let val = clampNumber(raw, sp.min, sp.max, valueOf(key));\n    val = Math.round(val * 10 ** sp.dec) / 10 ** sp.dec;\n    if (key === \"balls\") state.pizza.balls = val;\n    else if (key === \"pizzaHydration\") state.pizza.hydration = val;\n    else if (key === \"yeastPct\") { const p = pizzaValues(); state.pizza = { ...state.pizza, instantYeastPct: { ...p.instantYeastPct, [p.proof]: val } }; }\n    else if (key === \"starterPct\") state.sourdough.starterPct = val;\n    else state[state.mode][key] = val;\n    emit();\n  }\n  function choose(key, val) {\n    if (key === \"mode\") state.mode = val;\n    else { state.pizza = { ...pizzaValues(), instantYeastPct: { ...pizzaValues().instantYeastPct } }; state.pizza[key] = val; }\n    emit();\n  }\n\n  /* ---- formatting ---- */\n  const fmtG = g => (g < 10 ? String(Math.round(g * 10) / 10) : Math.round(g).toLocaleString()) + \" g\";\n  const fmtNum = (v, dec) => String(Number(v.toFixed(dec)));\n  const fmtVal = f => fmtNum(f.value, f.dec) + (f.unit ? (f.unit === \"g\" ? \" g\" : f.unit) : \"\");\n\n  /* ---- drag helper: pointer drags change a field in whole steps; a short press is a tap ---- */\n  const haptic = () => { try { navigator.vibrate && navigator.vibrate(6); } catch {} };\n  function drag(el, { key, axis = \"x\", pxPerStep = 10, onTap, onStart, onEnd, target }) {\n    let start = null;\n    el.style.touchAction = axis === \"x\" ? \"pan-y\" : \"pan-x\";\n    el.addEventListener(\"pointerdown\", e => {\n      if (e.button) return;\n      const k = typeof key === \"function\" ? key(e) : key;\n      start = { id: e.pointerId, x: e.clientX, y: e.clientY, k, v: k ? valueOf(k) : 0, last: 0, moved: false };\n      try { el.setPointerCapture(e.pointerId); } catch {}\n      onStart && onStart(k, e);\n    });\n    el.addEventListener(\"pointermove\", e => {\n      if (!start || e.pointerId !== start.id || !start.k) return;\n      const d = axis === \"x\" ? e.clientX - start.x : start.y - e.clientY;\n      if (!start.moved && Math.abs(d) < 5) return;\n      start.moved = true;\n      const steps = Math.round(d / pxPerStep(start.k));\n      if (steps !== start.last) { start.last = steps; set(start.k, start.v + steps * SPEC[start.k].drag); haptic(); }\n    });\n    const end = e => {\n      if (!start || e.pointerId !== start.id) return;\n      const s = start; start = null;\n      if (!s.moved && e.type === \"pointerup\") onTap && onTap(s.k, e);\n      onEnd && onEnd(s.k, s.moved);\n    };\n    el.addEventListener(\"pointerup\", end);\n    el.addEventListener(\"pointercancel\", end);\n  }\n\n  const step = (key, dir) => set(key, valueOf(key) + dir * SPEC[key].step);\n  /* ---- saved recipes: a snapshot is everything needed to rebuild the screen ---- */\n  function snapshot() {\n    const p = pizzaValues();\n    return { mode: state.mode, sourdough: { ...state.sourdough }, instant: { ...state.instant },\n             pizza: { balls: p.balls, hydration: p.hydration, yeastType: p.yeastType, proof: p.proof, instantYeastPct: { ...p.instantYeastPct } } };\n  }\n  function restore(s) {\n    if (!s || ![\"sourdough\", \"instant\", \"pizza\"].includes(s.mode)) return false;\n    state.mode = s.mode;\n    state.sourdough = { ...DEFAULTS.sourdough, ...s.sourdough };\n    state.instant = { ...DEFAULTS.instant, ...s.instant };\n    state.pizza = { ...DEFAULTS.pizza, ...s.pizza, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct, ...(s.pizza && s.pizza.instantYeastPct) } };\n    emit(); return true;\n  }\n\n  return { model, set, choose, step, snapshot, restore, spec: SPEC, modes: MODES, drag, fmtG, fmtNum, fmtVal, subscribe: fn => { subs.add(fn); fn(model()); },\n           api: { calculateSourdough, calculateInstant, calculatePizza } };\n})();\nwindow.DoughRatioAssistant = Dough.api;\n\n/* ---- Game helpers for the canvas concepts ---- */\nconst Game = (() => {\n  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));\n  const lerp = (a, b, t) => a + (b - a) * t;\n  const ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < 0.5 ? 4 1 / -1; border-bottom: 0; padding-top: 8px; font-size: 1.25rem; }\n  #ledger .tot span:last-child { font: 700 1.75rem/1 ui-monospace, \"SF Mono\", Consolas, monospace; letter-spacing: -0.03em; }\n\n  #strip { display: flex; gap: 3px; height: 40px; }\n  #strip div { display: grid; align-content: center; padding: 0 6px; overflow: hidden; background: var(--line); border-radius: 6px; font-size: 0.75rem; line-height: 1.15; min-width: 0; transition: flex-grow 200ms ease-out; }\n  #strip div b { font-weight: 700; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  #strip div.bake { background: var(--accent); color: var(--bg); }\n  #strip div.fridge { background: var(--fridge); color: #fff; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.875rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <section id=\"rows\"><\/section>\n  <div id=\"switches\"><\/div>\n  <section id=\"ledger\" aria-live=\"polite\"><\/section>\n  <div id=\"strip\" role=\"img\"><\/div>\n  <p id=\"plan\"><\/p>\n<\/main>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType \n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sour pe as a day ribbon, tiles and a magnetic preset rail.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  :root { color-scheme: light dark; --bg: #f4f0e8; --ink: #20221f; --muted: #6f7168; --line: #d8d3c6; --card: #fbf9f4; --tint: #e7e1d2; --accent: #2f6b4f; --on-accent: #fff; --fridge: #5b88a8; --bake: #b4491e; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #121411; --ink: #ecebe4; --muted: #9a9c92; --line: #2f322c; --card: #1b1d19; --tint: #262922; --accent: #6fcf9d; --on-accent: #0d1a12; --fridge: #6a9cbd; --bake: #f08a5c; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\n  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  #app { width: min(480px, 100%); margin: 0 auto; min-height: 100dvh; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 44px auto auto minmax(0, 1fr) auto; gap: 8px; }\n  #tabs { grid-row: 1; display: grid; grid-template-columns: repeat(3, 1fr); }\n  #ribbon { grid-row: 2; } #tray { grid-row: 3; } #work { grid-row: 4; } #plan { grid-row: 5; }\n  #tabs button { border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n\n  #ribbon { width: 100%; height: auto; display: block; border-radius: 12px; }\n  #ribbon.over { outline: 3px dashed var(--accent); outline-offset: 3px; }\n  #ribbon text { font-family: inherit; fill: var(--ink); }\n  #ribbon .nm { font-size: 12px; font-weight: 700; }\n  #ribbon .hr { font-size: 11px; fill: var(--muted); }\n  #ribbon .inv { fill: #fff; }\n\n  #tray { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n  #tray[hidden] { display: none; }\n  .tile { min-height: 56px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); text-align: left; touch-action: none; position: relative; user-select: none; -webkit-user-select: none; }\n  .tile b { display: block; }\n  .tile small { color: var(--muted); }\n  .tile[aria-pressed=\"true\"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--tint); }\n  .tile.drag { z-index: 5; box-shadow: 0 1px 2px rgba(0,0,0,0.15); transition: none; }\n\n  #work { position: relative; padding-right: 68px; display: grid; align-content: start; gap: 8px; min-height: 0; }\n  #active { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 4px 0; min-height: 64px; }\n  #active .l { color: var(--muted); font-weight: 600; }\n  #active button, #active input { border: 0; background: none; font: 700 48px/1 ui-monospace, \"SF Mono\", \"Cascadia Mono\", Consolas, monospace; letter-spacing: -0.04em; color: var(--ink); text-align: right; padding: 0; font-variant-numeric: tabular-nums; }\n  #active input { width: 5ch; border-bottom: 2px solid var(--accent); border-radius: 0; }\n  #active .u { color: var(--muted); font-size: 1.125rem; font-weight: 600; margin-left: 4px; }\n  #stack { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }\n  #stack li { position: relative; display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: var(--card); overflow: hidden; border: 1px solid transparent; }\n  #stack li::before { content: \"\"; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: var(--tint); transition: width 150ms ease-out; }\n  #stack li > * { position: relative; }\n  #stack li.on { border-color: var(--accent); }\n  #stack .a { font: 700 22px/1 ui-monospace, \"SF Mono\", Consolas, monospace; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }\n  #stack li.tot { background: var(--ink); color: var(--bg); } #stack li.tot::before { display: none; }\n  #chips { display: flex; gap: 6px; flex-wrap: wrap; }\n  .chip { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-align: left; }\n  .chip small { display: block; color: var(--muted); font-size: 0.75rem; }\n  .chip b { font-variant-numeric: tabular-nums; }\n  .chip[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n  .chip[aria-pressed=\"true\"] small { color: var(--bg); opacity: 0.7; }\n\n  #rail { position: absolute; right: 0; top: 0; bottom: 0; width: 64px; touch-action: none; border-radius: 16px; background: var(--card); border: 1px solid var(--line); cursor: ns-resize; user-select: none; -webkit-user-select: none; }\n  #rail .trk { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 6px; border-radius: 3px; background: var(--line); }\n  #rail .thumb { position: absolute; right: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); top: calc((1 - var(--t, 0)) * (100% - 28px)); box-shadow: 0 0 0 4px var(--card); }\n  #rail .tick { position: absolute; left: 4px; transform: translateY(-50%); min-height: 28px; padding: 0 4px; border: 0; background: none; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }\n  #rail .tick::after { content: \"\"; display: inline-block; width: 8px; height: 2px; background: var(--muted); margin-left: 3px; vertical-align: middle; }\n  #rail .tick.hit { color: var(--accent); font-weight: 700; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.875rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\" role=\"tablist\" aria-label=\"Dough type\"><\/nav>\n  <svg id=\"ribbon\" viewBox=\"0 0 351 84\" role=\"img\"><\/svg>\n  <div id=\"tray\"><\/div>\n  <section id=\"work\">\n    <div id=\"active\"><\/div>\n    <ul id=\"stack\" aria-live=\"polite\"><\/ul>\n    <div id=\"chips\" role=\"group\" aria-label=\"Value to change with the slider\"><\/div>\n    <div id=\"rail\" role=\"slider\" tabindex=\"0\"><div class=\"trk\"><\/div><div class=\"thumb\"><\/div><\/div>\n  <\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"sourdough\" ? \"sourdough\" : \"instant\",\n      proof: p.proof === \"sameDay\" ? \"sameDay\" : \"nextDay\",\n      instantYeastPct: {\n        sameDay: clampNumber(p.instantYeastPct.sameDay, 0.01, 2, 0.5),\n        nextDay: clampNumber(p.instantYeastPct.nextDay, 0.01, 2, 0.11)\n      }\n    };\n  }\n\n  function fieldKeys() {\n    if (state.mode === \"pizza\") return [\"balls\", \"pizzaHydration\"].concat(pizzaValues().yeastType === \"instant\" ? [\"yeastPct\"] : []);\n    return state.mode === \"sourdough\" ? [\"flour\", \"hydration\", \"starterPct\"] : [\"flour\", \"hydration\"];\n  }\n  function valueOf(key) {\n    if (state.mode === \"pizza\") {\n      const p = pizzaValues();\n      return { balls: p.balls, pizzaHydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] }[key];\n    }\n    return breadValues()[key];\n  }\n\n  /* ---- plan as a timeline. Only the rests named in the original text have hours; the rest are untimed steps ---- */\n  function timeline(mode, p) {\n    const T = (label, hours, text, fridge) => ({ label, hours: hours || null, text: text || (hours ? hours + \" h\" : \"\"), fridge: !!fridge });\n    if (mode === \"sourdough\") return [T(\"Mix\"), T(\"Rest\", 4), T(\"Basket\"), T(\"Bake\")];\n    if (mode === \"instant\") return [T(\"Mix\"), T(\"Rest\", 1.5, \"1-2 h\"), T(\"Basket\"), T(\"Bake\")];\n    const sd = p.yeastType === \"sourdough\", next = p.proof === \"nextDay\";\n    if (!next) return [T(\"Mix\"), T(\"Rest\", 4), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    if (!sd) return [T(\"Mix\"), T(\"Chill\", 24, \"24 h\", true), T(\"Rest\", 2), T(\"Divide\"), T(\"Double\"), T(\"Bake\")];\n    return [T(\"Mix\"), T(\"Rest\", 2), T(\"Divide\"), T(\"Chill\", 24, \"24 h\", true), T(\"Double\"), T(\"Bake\")];\n  }\n\n  function model() {\n    const mode = state.mode, pizza = mode === \"pizza\";\n    const p = pizza ? pizzaValues() : null, v = pizza ? null : breadValues();\n    const r = pizza ? calculatePizza(p) : mode === \"sourdough\" ? calculateSourdough(v) : calculateInstant(v);\n    const hasStarter = pizza ? p.yeastType === \"sourdough\" : mode === \"sourdough\";\n    const hasYeast = pizza ? p.yeastType === \"instant\" : mode === \"instant\";\n    const parts = [{ id: \"flour\", label: \"Flour\", g: pizza ? r.flour : v.flour }, { id: \"water\", label: \"Water\", g: r.water }];\n    if (hasStarter) parts.push({ id: \"starter\", label: \"Starter\", g: r.starter });\n    if (hasYeast) parts.push({ id: \"yeast\", label: \"Yeast\", g: r.yeast });\n    parts.push({ id: \"salt\", label: \"Salt\", g: r.salt });\n    return {\n      mode, title: MODE_TITLE[mode], pizza: p, total: r.totalDough, finalHydration: r.finalHydration, parts,\n      fields: fieldKeys().map(k => ({ key: k, ...SPEC balls\" ? \"Dough balls\" : f.label }),\n        H(\"span\", {}, H(\"button\", { type: \"button\", \"aria-label\": `${f.label} ${Dough.fmtNum(f.value, f.dec)}. Tap to type.`, text: Dough.fmtNum(f.value, f.dec), onclick: () => { typing = true; drawWork(); } }), H(\"span\", { class: \"u\", text: f.unit })));\n    }\n    const sel = PART_OF[active];\n    $(\"#stack\").replaceChildren(...m.parts.map(p => {\n      const li = H(\"li\", { class: p.id === sel ? \"on\" : \"\" }, H(\"span\", { text: p.label === \"Yeast\" ? \"Instant yeast\" : p.label }), H(\"span\", { class: \"a\", text: Dough.fmtG(p.g) }));\n      li.style.setProperty(\"--w\", (p.g / m.total * 100).toFixed(1) + \"%\"); return li;\n    }));\n    $(\"#stack\").append(H(\"li\", { class: \"tot\" }, H(\"span\", { text: \"Total dough\" }), H(\"span\", { class: \"a\", text: Dough.fmtG(m.total) })));\n    $(\"#chips\").replaceChildren(...m.fields.map(x => H(\"button\", { type: \"button\", class: \"chip\", \"aria-pressed\": String(x.key === active), onclick: () => { active = x.key; typing = false; draw(); } },\n      H(\"small\", { text: x.key === \"balls\" ? \"Balls\" : x.label }), H(\"b\", { text: Dough.fmtVal(x) }))));\n\n    // rail: position, preset detents with labels, aria\n    const rail = $(\"#rail\");\n    rail.style.setProperty(\"--t\", toT(active, f.value).toFixed(4));\n    rail.setAttribute(\"aria-label\", f.label); rail.setAttribute(\"aria-valuenow\", f.value); rail.setAttribute(\"aria-valuemin\", RAIL[active].min); rail.setAttribute(\"aria-valuemax\", RAIL[active].max);\n    rail.querySelectorAll(\".tick\").forEach(t => t.remove());\n    f.presets.forEach(p => {\n      const t = H(\"button\", { type: \"button\", class: \"tick\" + (p === f.value ? \" hit\" : \"\"), text: String(p), \"aria-label\": `Set ${f.label} to ${p}`, onpointerdown: e => e.stopPropagation(), onclick: () => Dough.set(active, p) });\n      t.style.top = `calc((1 - ${toT(active, p).toFixed(4)}) * (100% - 28px) + 14px)`;\n      rail.append(t);\n    });\n  }\n\n  let lastSnap = null, dragging = false;\n  function applyRail(e) {\n    const f = field(active), trk = $(\"#rail .trk\").getBoundingClientRect();\n    const t = Math.min(1, Math.max(0, 1 - (e.clientY - trk.top - 0) / trk.height));\n    let v = toV(active, t);\n    const snapP = f.presets.find(p => Math.abs(toT(active, p) - t) < 0.035);\n    if (snapP !== undefined) { v = snapP; if (lastSnap !== snapP) haptic(); lastSnap = snapP; } else lastSnap = null;\n    Dough.set(active, v);\n  }\n  const rail = $(\"#rail\");\n  rail.addEventListener(\"pointerdown\", e => { if (e.button) return; dragging = true; try { rail.setPointerCapture(e.pointerId); } catch {} applyRail(e); });\n  rail.addEventListener(\"pointermove\", e => { if (dragging) applyRail(e); });\n  [\"pointerup\", \"pointercancel\"].forEach(ev => rail.addEventListener(ev, () => { dragging = false; lastSnap = null; }));\n  rail.addEventListener(\"keydown\", e => {\n    const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];\n    if (d) { e.preventDefault(); Dough.step(active, d); return; }\n    if (e.key === \"PageUp\" || e.key === \"PageDown\") { e.preventDefault(); const f = field(active), ps = f.presets.slice().sort((a, b) => a - b); const up = e.key === \"PageUp\"; const n = up ? ps.find(p => p > f.value) : ps.reverse().find(p => p < f.value); if (n !== undefined) Dough.set(active, n); }\n  });\n\n  function draw() {\n    $(\"#tabs\").replaceChildren(...Dough.modes.map(([v, l]) => H(\"button\", { type: \"button\", role: \"tab\", text: l, \"aria-selected\": String(m.mode === v), onclick: () => { active = null; typing = false; Dough.choose(\"mode\", v); } })));\n    drawRibbon(); drawTray(); drawWork();\n    $(\"#plan\").textContent = m.plan;\n  }\n  Dough.subscribe(model => { m = model; if (!typing || !field(active)) draw(); else { drawRibbon(); drawTray(); $(\"#plan\").textContent = m.plan; } });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "knob", "name": "Range knob", "group": "Round 3, 2D game feel", "blurb": "A heavy stove knob. Outer ring for big steps, centre for single clicks, presets engraved around it.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  :root { color-scheme: light dark; --bg: #e6e2d8; --ink: #211e19; --muted: #6f6a5f; --line: #cbc6b8; --plate: #f1ede2; --knob: #b4411f; --knob2: #8f3217; --cream: #f6efe0; --accent: #b4411f; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #11100e; --ink: #ece7da; --muted: #9a9486; --line: #2f2d28; --plate: #1d1b17; --knob: #c85a35; --knob2: #9c4325; --cream: #f3e9d2; --accent: #f08a5c; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; overscroll-behavior: none; }\n  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  #app { width: min(480px, 100%); margin: 0 auto; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 44px; }\n  #tabs button { border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n  #readout { height: 72px; display: flex; align-items: baseline; justify-content: space-between; padding: 6px 6px 0; }\n  #rl { color: var(--muted); font-weight: 600; }\n  #rv { font: 700 60px/1 ui-monospace, \"SF Mono\", \"Cascadia Mono\", Consolas, monospace; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }\n  #rv small { font-size: 1.25rem; color: var(--muted); letter-spacing: 0; margin-left: 4px; font-weight: 600; }\n  #cv { width: 100%; height: 280px; display: block; border-radius: 20px; background: var(--plate); touch-action: none; }\n  #sel { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }\n  #sel button { min-height: 48px; border: 1px solid var(--line); border-radius: 12px; background: none; text-align: left; padding: 4px 10px; }\n  #sel button small { display: block; color: var(--muted); font-size: 0.75rem; }\n  #sel button[aria-pressed=\"true\"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n  #sel button[aria-pressed=\"true\"] small { color: var(--bg); opacity: 0.7; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\"><\/nav>\n  <section id=\"readout\"><span id=\"rl\"><\/span><output id=\"rv\"><\/output><\/section>\n  <canvas id=\"cv\" aria-label=\"Knob. Turn the outer ring for big steps and the centre for single steps.\"><\/canvas>\n  <div id=\"sel\" role=\"group\" aria-label=\"Value the knob changes\"><\/div>\n  <section id=\"res\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOICES = {\n    yeastType: { label: \"Leavening\", options: [[\"instant\", \"Instant yeast\"], [\"sourdough\", \"Sourdough\"]] },\n    proof:     { label: \"Proofing\",  options: [[\"sameDay\", \"Same day\"], [\"nextDay\", \"Next day\"]] }\n  };\n  const MODES = [[\"sourdough\", \"Sourdough\"], [\"instant\", \"Instant yeast\"], [\"pizza\", \"Pizza\"]];\n  const MODE_TITLE = { sourdough: \"Sourdough bread\", instant: \"Instant yeast bread\", pizza: \"Neapolitan pizza\" };\n\n  function breadValues() {\n    const cur = state[state.mode];\n    return {\n      flour: clampNumber(cur.flour, 1, 10000, 500),\n      hydration: clampNumber(cur.hydration, 40, 100, 70),\n      starterPct: clampNumber(state.sourdough.starterPct, 0, 100, 5)\n    };\n  }\n  function pizzaValues() {\n    const p = state.pizza;\n    return {\n      balls: clampNumber(p.balls, 1, 48, 8),\n      hydration: clampNumber(p.hydration, 50, 80, 64),\n      yeastType: p.yeastType === \"so
