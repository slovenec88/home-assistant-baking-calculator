ons.findIndex(o => o[0] === c.value); Dough.choose(c.key, c.options[(i + 1) % c.options.length][0]); vib(10); } }\n        else if (d.preset != null) { Dough.set(sel, d.preset); vib(8); }\n      }\n    }\n  });\n\n  Game.canvas(cv, (ctx, w, h, dt, t) => {\n    W = w; Hh = h; cx = w / 2; cy = h / 2 - 6;\n    ctx.clearRect(0, 0, w, h);\n    const f = m && field(sel); if (!f) return;\n    Game.spring(K, \"ring\", K.ringT, dt, 320, 18); Game.spring(K, \"cap\", K.capT, dt, 320, 18);\n    Game.spring(K, \"ptr\", angleOf(sel, f.value), dt, 260, 20); Game.spring(K, \"shake\", 0, dt, 400, 14);\n    parts.update(dt);\n\n    // engraving: ticks and preset numbers (static)\n    ctx.lineCap = \"round\";\n    for (let i = 0; i <= 36; i++) { const a = A0 + SPAN * i / 36, major = i % 6 === 0; ctx.strokeStyle = col[\"--muted\"]; ctx.lineWidth = major ? 2 : 1; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 104, cy + Math.sin(a) * 104); ctx.lineTo(cx + Math.cos(a) * (major ? 113 : 109), cy + Math.sin(a) * (major ? 113 : 109)); ctx.stroke(); }\n    ctx.font = \"700 15px system-ui\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\";\n    f.presets.forEach(p => { const a = angleOf(sel, p), on = p === f.value; ctx.fillStyle = on ? col[\"--accent\"] : col[\"--ink\"]; ctx.fillText(String(p), cx + Math.cos(a) * 124, cy + Math.sin(a) * 124); });\n    ctx.font = \"600 12px system-ui\"; ctx.fillStyle = col[\"--muted\"];\n    const r = U.range[sel]; [[0, r.min], [1, r.max]].forEach(([tt, v]) => { const a = A0 + SPAN * tt; ctx.fillText(Dough.fmtNum(v, f.dec), cx + Math.cos(a) * 124 + (tt ? 6 : -6), cy + Math.sin(a) * 124 + 14); });\n\n    // shadow, ring with knurls, cap with pointer\n    ctx.fillStyle = \"rgba(0,0,0,0.18)\"; ctx.beginPath(); ctx.arc(cx + 2, cy + 4, 98, 0, 7); ctx.fill();\n    ctx.fillStyle = col[\"--knob\"]; ctx.beginPath(); ctx.arc(cx, cy, 96, 0, 7); ctx.fill();\n    ctx.strokeStyle = col[\"--knob2\"]; ctx.lineWidth = 3;\n    for (let i = 0; i < 24; i++) { const a = K.ring + K.shake + i * PI / 12; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * 82, cy + Math.sin(a) * 82); ctx.lineTo(cx + Math.cos(a) * 94, cy + Math.sin(a) * 94); ctx.stroke(); }\n    ctx.fillStyle = col[\"--plate\"]; ctx.beginPath(); ctx.arc(cx, cy, 62, 0, 7); ctx.fill();\n    ctx.fillStyle = col[\"--knob2\"]; ctx.beginPath(); ctx.arc(cx, cy, 52, 0, 7); ctx.fill();\n    ctx.fillStyle = col[\"--knob\"]; ctx.beginPath(); ctx.arc(cx, cy, 48, 0, 7); ctx.fill();\n    ctx.fillStyle = col[\"--knob2\"];\n    for (let i = 0; i < 12; i++) { const a = K.cap + i * PI / 6; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 36, cy + Math.sin(a) * 36, 2.4, 0, 7); ctx.fill(); }\n    const pa = K.ptr + K.shake; ctx.strokeStyle = col[\"--cream\"]; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(pa) * 10, cy + Math.sin(pa) * 10); ctx.lineTo(cx + Math.cos(pa) * 42, cy + Math.sin(pa) * 42); ctx.stroke();\n    // pointer pip on the ring edge\n    ctx.fillStyle = col[\"--cream\"]; ctx.beginPath(); ctx.arc(cx + Math.cos(pa) * 88, cy + Math.sin(pa) * 88, 5, 0, 7); ctx.fill();\n    parts.draw(ctx);\n\n    // pizza switches\n    if (m.mode === \"pizza\") m.choices.forEach((c, i) => {\n      const x = i ? w * 0.74 : w * 0.26, y = h - 32, i1 = c.options.findIndex(o => o[0] === c.value);\n      Game.spring({ get v() { return K.sw[i]; }, set v(a) { K.sw[i] = a; } }, \"v\", i1, dt, 300, 20);\n      ctx.fillStyle = col[\"--line\"]; ctx.beginPath(); ctx.roundRect(x - 54, y - 18, 108, 36, 18); ctx.fill();\n      const tx = x - 54 + 18 + K.sw[i] * 72; ctx.fillStyle = col[\"--knob\"]; ctx.beginPath(); ctx.roundRect(tx - 18, y - 15, 36, 30, 15); ctx.fill();\n      ctx.font = \"700 11px system-ui\"; ctx.fillStyle = col[\"--ink\"]; ctx.textAlign = \"center\";\n      ctx.fillText(c.options[0][1].replace(\"Instant yeast\", \"Yeast\"), x - 54, y + 30); ctx.fillText(c.options[1][1], x + 54, y + 30);\n    });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "frame", "name": "Counting frame", "group": "Round 3, 2D game feel", "blurb": "A bakery abacus. Push beads along each digit rod, tap a bead, or double-tap the number for presets.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  :root { color-scheme: light dark; --bg: #ebe6da; --ink: #231f19; --muted: #756f62; --line: #cfc8b8; --wood: #c7a46a; --wood2: #8a6a36; --frame: #7a5a2c; --bone: #efe6cd; --slate: #6c8ea6; --tan: #c19a6b; --rose: #c98b8b; --accent: #a8431f; --on: #fff; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #131210; --ink: #ece6d6; --muted: #9a9384; --line: #2f2d27; --wood: #b08d52; --wood2: #6d4f27; --frame: #5c4220; --bone: #d9ceb1; --slate: #7fa0b8; --tan: #c9a276; --rose: #d09a9a; --accent: #f08a5c; --on: #1a1008; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; overscroll-behavior: none; }\n  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  #app { width: min(480px, 100%); margin: 0 auto; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 44px; }\n  #tabs button { border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n  #cv { width: 100%; height: 372px; display: block; border-radius: 14px; touch-action: none; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\"><\/nav>\n  <canvas id=\"cv\" aria-label=\"Counting frame. Push beads along each rod to set a digit.\"><\/canvas>\n  <section id=\"res\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\n  function saveState() {\n    try {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, pizza: { ...state.pizza, hydration: DEFAULTS.pizza.hydration, instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct } } }));\n    } catch {}\n  }\n\n  /* ---- field specs: what the UI may edit, with limits and presets ---- */\n  const SPEC = {\n    flour:          { label: \"Flour\",        unit: \"g\", min: 1,    max: 10000, step: 1,    drag: 10,   dec: 0, presets: [800, 1200] },\n    hydration:      { label: \"Hydration\",    unit: \"%\", min: 40,   max: 100,   step: 1,    drag: 1,    dec: 0, presets: [65, 70] },\n    starterPct:     { label: \"Starter\",      unit: \"%\", min: 0,    max: 100,   step: 0.5,  drag: 0.5,  dec: 1, presets: [5, 10] },\n    balls:          { label: \"Dough balls\",  unit: \"\",  min: 1,    max: 48,    step: 1,    drag: 1,    dec: 0, presets: [4, 8, 12] },\n    pizzaHydration: { label: \"Hydration\",    unit: \"%\", min: 50,   max: 80,    step: 1,    drag: 1,    dec: 0, presets: [60, 64, 70] },\n    yeastPct:       { label: \"Yeast\",        unit: \"%\", min: 0.01, max: 2,     step: 0.01, drag: 0.01, dec: 2, presets: [] }\n  };\n  const CHOIC gh.set(key, Math.round(v * 100) / 100); vib(8); };\n\n  let drag = null;\n  Game.pointer(cv, {\n    down(x, y) {\n      const r = rodAt(y); if (!r) { drag = null; return; }\n      drag = { r, x0: x, y0: y, t0: performance.now(), moved: false, locked: null, n0: r.n };\n    },\n    move(x, y) {\n      if (!drag) return; const r = drag.r, dx = x - drag.x0, dy = y - drag.y0;\n      if (drag.locked === null && Math.hypot(dx, dy) > 8) drag.locked = Math.abs(dy) > Math.abs(dx) * 0.58 ? \"v\" : \"h\";\n      if (drag.locked !== \"h\") return;\n      drag.moved = true;\n      const w = beadW(), right = cv.getBoundingClientRect().width - RIGHT;\n      const nf = Game.clamp((right - x) / w + 0.5, 0, r.max);\n      r.v = nf; r.n = Math.round(nf);\n    },\n    up(x, y) {\n      if (!drag) return; const d = drag; drag = null; const r = d.r, w = beadW(), W = cv.getBoundingClientRect().width;\n      if (d.locked === \"v\") return;\n      if (r.choice) { if (!d.moved || Math.abs(x - d.x0) < 8) { const c = r.choice; const i = c.options.findIndex(o => o[0] === c.value); Dough.choose(c.key, c.options[(i + 1) % c.options.length][0]); vib(10); } else { const i = x < W / 2 ? 0 : 1; Dough.choose(r.choice.key, r.choice.options[i][0]); } return; }\n      if (!d.moved && performance.now() - d.t0 < 400) {\n        // numeral: double tap cycles presets\n        if (x > W - RIGHT) { const g = groups.find(g => g.row0 <= r.row && r.row < g.row0 + g.rows); const now = performance.now(); if (lastTap.key === g.key && now - lastTap.t < 380) { const p = g.f.presets; if (p.length) { const i = p.indexOf(g.f.value); Dough.set(g.key, p[(i + 1) % p.length]); vib(10); } lastTap = { t: 0, key: null }; } else lastTap = { t: now, key: g.key }; return; }\n        // tap a bead: it and the beads in its way slide to the other side (track has 12 slots)\n        const right = W - RIGHT;\n        if (x >= LEFT && x < right) {\n          const slot = Math.floor((x - LEFT) / w) + 1;                 // 1..10 on a ten-slot track\n          if (slot <= r.max - r.n) r.n = r.max - slot + 1;             // a left bead: it and those right of it go right\n          else { const k = r.max - (SL - slot); r.n = Math.max(0, r.max - k); }   // a right bead: it and those left of it go left\n        }\n      }\n      commit(r.key);\n    }\n  });\n\n  Game.canvas(cv, (ctx, w, h, dt, t) => {\n    ctx.clearRect(0, 0, w, h);\n    ctx.fillStyle = col[\"--frame\"]; ctx.beginPath(); ctx.roundRect(0, 0, w, h, 14); ctx.fill();\n    ctx.fillStyle = col[\"--bg\"]; ctx.globalAlpha = 0.0; ctx.fillRect(0, 0, w, h); ctx.globalAlpha = 1;\n    const bw = (w - LEFT - RIGHT) / SL, right = w - RIGHT;\n    // inner panel\n    ctx.fillStyle = \"rgba(0,0,0,0.18)\"; ctx.beginPath(); ctx.roundRect(6, 4, w - 12, TOP + rods.length * ROW + 4, 10); ctx.fill();\n    dust.update(dt);\n    rods.forEach(r => {\n      const y = TOP + r.row * ROW + ROW / 2;\n      const prev = r.v; Game.spring(r, \"v\", dragging(r) ? r.v : r.n, dt, 260, 20);\n      // rod\n      ctx.strokeStyle = col[\"--wood2\"]; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(LEFT - 8, y); ctx.lineTo(right + 8, y); ctx.stroke();\n      if (r.choice) {\n        const c = r.choice; ctx.fillStyle = col[\"--bone\"]; ctx.font = \"600 12px system-ui\"; ctx.textAlign = \"left\"; ctx.textBaseline = \"middle\";\n        ctx.fillText(c.options[0][1].replace(\"Instant yeast\", \"Yeast\"), 10, y); ctx.textAlign = \"right\"; ctx.fillText(c.options[1][1], w - 10, y);\n        const bx = LEFT + 14 + r.v * (right - LEFT - 28); drawBead(ctx, bx, y, 16, col[\"--accent\"]); return;\n      }\n      // beads: slot positions; bead k slides right when v exceeds (max - k)\n      const colr = col[COLOR[r.key]];\n      for (let k = 1; k <= r.max; k++) {\n        const s = Game.clamp(r.v - (r.max - k), 0, 1);\n        const xl = LEFT + (k - 0.5) * bw, xr = right - (r.max - k + 0.5) * bw;\n        const x = xl + (xr - xl) * s;\n        drawBead(ctx, x, y, Math.min(bw / 2 - 0.5, 14), colr);\n      }\n      // place label\n      ctx.fillStyle = col[\"--bone\"]; ctx.font = \"600 11px system-ui\"; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.globalAlpha = 0.85;\n      ctx.fillText(r.place >= 1 ? String(r.place) : String(r.place), LEFT - 14, y); ctx.globalAlpha = 1;\n      if (Math.abs(prev - r.v) > 0.5 && Math.random() < 0.15) dust.burst(LEFT + r.v * 10, y, 1, { speed: 30, life: 0.4, r: 1.5, color: col[\"--bone\"], gravity: 120 });\n    });\n    // group names and numerals (static: they never animate)\n    groups.forEach(g => {\n      const y0 = TOP + g.row0 * ROW, yc = y0 + g.rows * ROW / 2;\n      ctx.fillStyle = col[\"--bone\"]; ctx.textAlign = \"right\"; ctx.textBaseline = \"middle\"; ctx.font = \"700 12px system-ui\"; ctx.globalAlpha = 0.85;\n      ctx.fillText(NAME[g.key].toUpperCase(), w - 12, yc - 26); ctx.globalAlpha = 1;\n      ctx.textAlign = \"right\"; ctx.font = \"700 28px ui-monospace, 'SF Mono', Consolas, monospace\"; ctx.fillStyle = \"#fff\"; if (!matchMedia(\"(prefers-color-scheme: dark)\").matches) ctx.fillStyle = col[\"--bone\"];\n      ctx.fillText(Dough.fmtNum(g.f.value, g.f.dec), w - 28, yc - 2);\n      ctx.font = \"600 13px system-ui\"; ctx.textAlign = \"left\"; ctx.fillText(g.f.unit, w - 24, yc + 4);\n      ctx.strokeStyle = \"rgba(0,0,0,0.25)\"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(10, y0 + g.rows * ROW); ctx.lineTo(w - 10, y0 + g.rows * ROW); ctx.stroke();\n    });\n    dust.draw(ctx);\n  });\n  const dragging = r => drag && drag.r === r && drag.moved;\n  function drawBead(ctx, x, y, rad, color) {\n    ctx.fillStyle = \"rgba(0,0,0,0.28)\"; ctx.beginPath(); ctx.ellipse(x + 1.5, y + 3, rad, rad * 0.72, 0, 0, 7); ctx.fill();\n    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rad, rad * 0.8, 0, 0, 7); ctx.fill();\n    ctx.fillStyle = \"rgba(255,255,255,0.35)\"; ctx.beginPath(); ctx.ellipse(x - rad * 0.3, y - rad * 0.28, rad * 0.35, rad * 0.18, 0, 0, 7); ctx.fill();\n  }\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "balance", "name": "Apothecary balance", "group": "Round 3, 2D game feel", "blurb": "Tap brass weights onto the pan. Slide a water jug and a starter crock along graduated beams.", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Dough Calculator<\/title>\n<style>\n  :root { color-scheme: light dark; --bg: #ece7dc; --ink: #241f18; --muted: #756e60; --line: #cdc6b6; --wall: #e4dccb; --brass: #b8923c; --brass2: #8a6a1f; --copper: #b4623a; --crock: #a58a6a; --shelf: #8b6b3f; --accent: #a8431f; }\n  @media (prefers-color-scheme: dark) { :root { --bg: #12110e; --ink: #ece6d6; --muted: #9a9384; --line: #2f2d27; --wall: #1d1b16; --brass: #c9a24c; --brass2: #8d6c24; --copper: #c9754b; --crock: #b79a78; --shelf: #6a512e; --accent: #f08a5c; } }\n  * { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.25 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; overscroll-behavior: none; }\n  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  #app { width: min(480px, 100%); margin: 0 auto; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 44px; }\n  #tabs button { border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n  #cv { width: 100%; height: 300px; display: block; border-radius: 16px; background: var(--wall); touch-action: none; }\n  #box { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }\n  #box button { height: 46px; padding: 0; border: 0; border-radius: 8px; background: var(--brass); color: #2a1f08; font: 700 15px ui-monospace, \"SF Mono\", Consolas, monospace; box-shadow: 0 3px 0 var(--brass2); }\n  #box button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--brass2); }\n  #box.pizza { grid-template-columns: repeat(4, 1fr); }\n  #box.pizza button { font-size: 1rem; }\n  #sw { display: none; grid-template-columns: 1fr 1fr; gap: 8px; }\n  #sw.on { display: grid; }\n  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 2px solid var(--brass2); border-radius: 10px; overflow: hidden; background: var(--wall); }\n  .seg button { min-height: 40px; border: 0; background: none; font-weight: 600; }\n  .seg button + button { border-left: 2px solid var(--brass2); }\n  .seg button[aria-pressed=\"true\"] { background: var(--brass); color: #2a1f08; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\"><\/nav>\n  <canvas id=\"cv\" aria-label=\"Balance. Tap weights below to load the pan. Slide the jug and the crock along their beams.\"><\/canvas>\n  <div id=\"sw\"><\/div>\n  <div id=\"box\" role=\"group\" aria-label=\"Weights\"><\/div>\n  <section id=\"res\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlour * h - starterWater);\n    return { totalDough: target, flour: totalFlour - starterFlour, water, starter, salt: totalFlour * s, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculatePizza(p) {\n    return p.yeastType === \"sourdough\"\n      ? calculatePizzaSourdough({ balls: p.balls, hydration: p.hydration, starterPct: PIZZA_STARTER_PCT[p.proof] })\n      : calculatePizzaInstant({ balls: p.balls, hydration: p.hydration, yeastPct: p.instantYeastPct[p.proof] });\n  }\n  function bakeManualText(mode, p) {\n    if (mode === \"pizza\") {\n      if (p.yeastType === \"instant\" && p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      if (p.yeastType === \"instant\") return \"Mix, knead, chill 24h, rest 2h at room temp, divide, let it double, prep, and bake.\";\n      if (p.proof === \"sameDay\") return \"Mix, knead, rest 4h at room temp, divide, let it double, prep, and bake.\";\n      return \"Mix, knead, rest 2h at room temp, divide, chill 24h, let it double, prep, and bake.\";\n    }\n    if (mode === \"sourdough\") return \"Mix, knead, rest 4h at room temp, put into a basket, prep, and bake.\";\n    return \"Mix, knead, rest 1-2h at room temp, put into a basket for a short time, prep, and bake.\";\n  }\n\n  /* ---- original saved state (pizza hydration and yeast are not remembered, as before) ---- */\n  function loadState() {\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));\n      const sp = saved && saved.pizza;\n      return {\n        ...DEFAULTS, ...saved,\n        sourdough: { ...DEFAULTS.sourdough, ...(saved && saved.sourdough) },\n        instant: { ...DEFAULTS.instant, ...(saved && saved.instant) },\n        pizza: {\n          ...DEFAULTS.pizza,\n          balls: sp && sp.balls ? sp.balls : DEFAULTS.pizza.balls,\n          yeastType: sp && sp.yeastType ? sp.yeastType : DEFAULTS.pizza.yeastType,\n          proof: sp && sp.proof ? sp.proof : DEFAULTS.pizza.proof,\n          hydration: DEFAULTS.pizza.hydration,\n          instantYeastPct: { ...DEFAULTS.pizza.instantYeastPct }\n        }\n      };\n    } catch { return structuredClone(DEFAULTS); }\n  }\n  let state = loadState();\n  if (![\"sourdough\", \"instant\", \"pizza\"].includes(state.mode)) state.mode = \"sourdough\";\ {w > 0 ? \"Add\" : \"Remove\"} ${Math.abs(w)} dough ball${Math.abs(w) > 1 ? \"s\" : \"\"}` : `Add ${label} g`);\n      let rep = null, delay = null;\n      const fire = () => { if (m.mode === \"pizza\") { Dough.step(\"balls\", Math.sign(w) * Math.abs(w)); Dough.set(\"balls\", field(\"balls\").value); } else { pan.push(w); Dough.set(\"flour\", sum()); land.push({ t: 0, w }); puff.burst(cv.getBoundingClientRect().width / 2, 92, 8, { angle: -PI / 2, spread: 2, speed: 80, life: 0.5, r: 3, color: \"#f3ead4\", gravity: 160 }); } vib(10); };\n      const stop = () => { clearTimeout(delay); clearInterval(rep); };\n      b.addEventListener(\"pointerdown\", e => { if (e.button) return; fire(); if (m.mode !== \"pizza\" && (w === 1 || w === 5)) delay = setTimeout(() => { rep = setInterval(fire, 125); }, 400); });\n      [\"pointerup\", \"pointerleave\", \"pointercancel\"].forEach(ev => b.addEventListener(ev, stop));\n      b.addEventListener(\"click\", e => { if (e.detail === 0) fire(); });\n      box.append(b);\n    });\n    const sw = $(\"#sw\"); sw.classList.toggle(\"on\", m.choices.length > 0); sw.replaceChildren(...m.choices.map(c => { const g = document.createElement(\"div\"); g.className = \"seg\"; g.setAttribute(\"role\", \"group\"); g.setAttribute(\"aria-label\", c.label); c.options.forEach(([v, l]) => { const b = document.createElement(\"button\"); b.type = \"button\"; b.textContent = l; b.setAttribute(\"aria-pressed\", String(c.value === v)); b.onclick = () => Dough.choose(c.key, v); g.append(b); }); return g; }));\n  }\n  let sig = \"\";\n  Dough.subscribe(model => {\n    m = model; const s = m.mode + m.choices.map(c => c.value).join(); if (s !== sig) { sig = s; buildBox(); }\n    if (m.mode !== \"pizza\") { const f = field(\"flour\"); if (f && Math.round(sum()) !== Math.round(f.value)) pan = greedy(f.value); }\n    $(\"#sw\").querySelectorAll(\".seg\").forEach((g, i) => g.querySelectorAll(\"button\").forEach((b, j) => b.setAttribute(\"aria-pressed\", String(m.choices[i].options[j][0] === m.choices[i].value))));\n  });\n\n  // poises: one for water on the upper beam, one for starter or yeast on the lower beam\n  const beams = () => {\n    const w = cv.getBoundingClientRect().width, x0 = 34, x1 = w - 34, list = [];\n    list.push({ key: m.mode === \"pizza\" ? \"pizzaHydration\" : \"hydration\", y: 188, x0, x1, label: \"Water\", color: \"--copper\", r: m.mode === \"pizza\" ? [50, 80] : [40, 100] });\n    const sk = m.mode === \"pizza\" ? (field(\"yeastPct\") ? \"yeastPct\" : null) : (field(\"starterPct\") ? \"starterPct\" : null);\n    if (sk) list.push({ key: sk, y: 262, x0, x1, label: m.mode === \"pizza\" ? \"Yeast\" : \"Starter\", color: \"--crock\", r: sk === \"yeastPct\" ? [0, 1] : [0, 30] });\n    return list;\n  };\n  const posOf = (b, v) => b.x0 + (b.x1 - b.x0) * Game.clamp((v - b.r[0]) / (b.r[1] - b.r[0]), 0, 1);\n  const valAt = (b, x) => b.r[0] + (b.r[1] - b.r[0]) * Game.clamp((x - b.x0) / (b.x1 - b.x0), 0, 1);\n  Game.pointer(cv, {\n    down(x, y) {\n      for (const b of beams()) { const f = field(b.key), px = posOf(b, f.value); if (Math.abs(y - (b.y - 20)) < 34 && Math.abs(x - px) < 40) { drag = { b, x0: x, moved: false }; return; } }\n      // tap the top weight on the pan to take it off\n      if (m.mode !== \"pizza\" && y < 120 && Math.abs(x - cv.getBoundingClientRect().width / 2) < 90 && pan.length) { pan.pop(); Dough.set(\"flour\", Math.max(1, sum())); vib(8); }\n    },\n    move(x) {\n      if (!drag) return; if (Math.abs(x - drag.x0) > 8) drag.moved = true; if (!drag.moved) return;\n      const b = drag.b, f = field(b.key); let v = valAt(b, x);\n      const snap = f.presets.find(p => Math.abs(p - v) <= (b.r[1] - b.r[0]) * 0.02);\n      if (snap !== undefined) { if (drag.last !== snap) vib(12); drag.last = snap; v = snap; } else drag.last = null;\n      Dough.set(b.key, v);\n    },\n    up() { drag = null; }\n  });\n\n  Game.canvas(cv, (ctx, w, h, dt, t) => {\n    if (!m) return; ctx.clearRect(0, 0, w, h);\n    puff.update(dt); Game.spring(beam, \"a\", 0, dt, 180, 6);\n    const cx = w / 2;\n    // shelf\n    ctx.fillStyle = col[\"--shelf\"]; ctx.fillRect(0, h - 10, w, 10);\n    // pan hanger (a small balance beam that wobbles when weights land)\n    land.forEach(l => { l.t += dt; if (l.t < dt * 2) { beam.aV += (Math.random() < 0.5 ? -1 : 1) * 6; } }); land = land.filter(l => l.t < 0.1);\n    const wob = Game.clamp(beam.a, -0.05, 0.05);\n    ctx.save(); ctx.translate(cx, 20); ctx.rotate(wob);\n    ctx.strokeStyle = col[\"--brass2\"]; ctx.lineWidth = 4; ctx.lineCap = \"round\"; ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(70, 0); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(-52, 52); ctx.moveTo(70, 0); ctx.lineTo(52, 52); ctx.stroke();\n    // pan\n    ctx.fillStyle = col[\"--brass\"]; ctx.beginPath(); ctx.ellipse(0, 54, 62, 9, 0, 0, 7); ctx.fill();\n    ctx.restore();\n    // contents of the pan\n    const base = 20 + 52 + 4;\n    if (m.mode === \"pizza\") {\n      const n = field(\"balls\").value, cols = 8;\n      for (let i = 0; i < n; i++) { const r = Math.floor(i / cols), c = i % cols, rowN = Math.min(cols, n - r * cols); const bx = cx - (rowN - 1) * 7 + c * 14, by = base - 8 - r * 11; ctx.fillStyle = \"#efe3c8\"; ctx.beginPath(); ctx.arc(bx, by, 7, 0, 7); ctx.fill(); ctx.strokeStyle = \"rgba(0,0,0,0.15)\"; ctx.stroke(); }\n    } else {\n      let y = base; const hh = Math.min(15, 62 / Math.max(1, pan.length));\n      pan.forEach((wt, i) => { const ww = 20 + Math.log10(wt + 1) * 16; y -= hh; ctx.fillStyle = col[\"--brass\"]; ctx.beginPath(); ctx.roundRect(cx - ww / 2, y, ww, hh - 1.5, 3); ctx.fill(); if (hh > 11) { ctx.fillStyle = \"#2a1f08\"; ctx.font = \"700 9px ui-monospace, monospace\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"middle\"; ctx.fillText(String(wt), cx, y + hh / 2 - 0.5); } });\n    }\n    puff.draw(ctx);\n    // plate with the flour amount (never animates)\n    const f = m.mode === \"pizza\" ? field(\"balls\") : field(\"flour\");\n    ctx.fillStyle = col[\"--ink\"]; ctx.textAlign = \"center\"; ctx.textBaseline = \"alphabetic\";\n    ctx.font = \"700 34px ui-monospace, 'SF Mono', Consolas, monospace\"; ctx.fillText(Dough.fmtNum(f.value, 0) + (m.mode === \"pizza\" ? \"\" : \"\"), cx + 112, 54);\n    ctx.font = \"600 12px system-ui\"; ctx.fillStyle = col[\"--muted\"]; ctx.fillText(m.mode === \"pizza\" ? \"dough balls\" : \"g flour\", cx + 112, 72);\n    ctx.textAlign = \"left\"; ctx.fillText(m.mode === \"pizza\" ? \"300 g each\" : \"tap a weight, tap the top one to remove\", 12, 112);\n\n    // beams and poises\n    beams().forEach(b => {\n      const fv = field(b.key), px = posOf(b, fv.value);\n      ctx.strokeStyle = col[\"--brass2\"]; ctx.lineWidth = 6; ctx.lineCap = \"round\"; ctx.beginPath(); ctx.moveTo(b.x0, b.y); ctx.lineTo(b.x1, b.y); ctx.stroke();\n      // graduations: minor every step band, major at presets\n      ctx.strokeStyle = col[\"--ink\"]; ctx.lineWidth = 1;\n      for (let i = 0; i <= 20; i++) { const x = b.x0 + (b.x1 - b.x0) * i / 20; ctx.beginPath(); ctx.moveTo(x, b.y + 5); ctx.lineTo(x, b.y + (i % 5 === 0 ? 13 : 9)); ctx.stroke(); }\n      ctx.font = \"700 12px system-ui\"; ctx.textAlign = \"center\"; ctx.textBaseline = \"top\";\n      fv.presets.forEach(p => { const x = posOf(b, p); ctx.strokeStyle = col[\"--accent\"]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x, b.y + 4); ctx.lineTo(x, b.y + 16); ctx.stroke(); ctx.fillStyle = p === fv.value ? col[\"--accent\"] : col[\"--ink\"]; ctx.fillText(String(p), x, b.y + 17); });\n      // poise: hangs from the beam\n      const ps = PS[b.key] || (PS[b.key] = { x: px });\n      const bx = ps.x += (px - ps.x) * Math.min(1, dt * 16);\n      const jig = Math.sin(t * 10) * Math.min(1, Math.abs(px - ps.x) / 18) * 0.14;\n      ctx.save(); ctx.translate(bx, b.y - 8); ctx.rotate(jig);\n      ctx.fillStyle = col[b.color]; ctx.beginPath(); if (b.key === \"starterPct\" || b.key === \"yeastPct\") { ctx.roundRect(-16, -34, bkit-tap-highlight-color: transparent; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  #app { width: min(480px, 100%); margin: 0 auto; padding: 0 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }\n  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); height: 44px; }\n  #tabs button { border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n  #plates { display: grid; gap: 6px; height: 84px; }\n  .plate { background: var(--plate); border-radius: 12px; padding: 6px 10px; display: grid; align-content: center; justify-items: center; border: 2px solid transparent; }\n  .plate small { color: var(--muted); font-weight: 600; font-size: 0.8125rem; }\n  .plate b { font: 700 40px/1 ui-monospace, \"SF Mono\", \"Cascadia Mono\", Consolas, monospace; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }\n  .plate b i { font-style: normal; font-size: 1rem; color: var(--muted); letter-spacing: 0; margin-left: 2px; }\n  .plate.on { border-color: var(--accent); }\n  #cv { width: 100%; height: 268px; display: block; border-radius: 16px; background: var(--plate); touch-action: none; }\n  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\"><\/nav>\n  <div id=\"plates\"><\/div>\n  <canvas id=\"cv\" aria-label=\"Tap tower. Pull a handle down to add, push it up to take away. Tap a handle for a single step.\"><\/canvas>\n  <section id=\"res\"><\/section>\n  <p id=\"plan\"><\/p>\n<\/main>\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + starter + water + salt, water, starter, salt, finalHydration: (water + starterWater) / totalFlour * 100 };\n  }\n  function calculateInstant({ flour, hydration }) {\n    const water = flour * hydration / 100, salt = flour * 0.02, yeast = flour * 0.007;\n    return { totalDough: flour + water + salt + yeast, water, yeast, salt, finalHydration: hydration };\n  }\n  function calculatePizzaInstant({ balls, hydration, yeastPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, y = yeastPct / 100, s = PIZZA_SALT_PCT / 100;\n    const flour = target / (1 + h + s + y);\n    return { totalDough: target, flour, water: flour * h, yeast: flour * y, salt: flour * s, finalHydration: hydration };\n  }\n  function calculatePizzaSourdough({ balls, hydration, starterPct }) {\n    const target = balls * PIZZA_BALL_WEIGHT, h = hydration / 100, st = starterPct / 100, s = PIZZA_SALT_PCT / 100;\n    const totalFlour = target / (1 + h + s);\n    const starter = totalFlour * st, starterWater = starter / 2, starterFlour = starter / 2;\n    const water = Math.max(0, totalFlo s { display: grid; grid-template-columns: repeat(3, 1fr); }\n  #tabs button { border: 0; background: none; color: var(--muted); font-size: 1.0625rem; font-weight: 500; border-bottom: 3px solid transparent; }\n  #tabs button[aria-selected=\"true\"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }\n  #rows { display: grid; }\n  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px; min-height: 64px; border-bottom: 1px solid var(--line); transition: opacity 150ms ease-out; }\n  .row .n { color: var(--muted); font-size: 1.0625rem; font-weight: 500; }\n  .row .v { font: 700 44px/1 ui-monospace, \"SF Mono\", \"Cascadia Mono\", Consolas, monospace; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; align-self: center; }\n  .row .v small { font-size: 1rem; letter-spacing: 0; color: var(--muted); font-weight: 600; margin-left: 4px; }\n  .row.in .v { color: var(--ink); } .row.out .v { color: var(--derived); }\n  .row.tot { border-bottom: 0; } .row.tot .v { font-size: 56px; color: var(--ink); }\n  body.rose .row:not(.hot) { opacity: 0.3; }\n  .hold { color: var(--muted); font-size: 0.875rem; text-align: center; margin: 2px 0; }\n  #choices { display: flex; justify-content: center; gap: 8px; align-items: baseline; font-size: 1.125rem; min-height: 46px; }\n  #choices button { border: 0; background: none; padding: 6px 4px; color: var(--accent); font-weight: 700; border-bottom: 2px dotted var(--accent); }\n  #plan { margin: 0; color: var(--muted); font-size: 0.8125rem; }\n  #ov { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 30; }\n  #ov text { font-family: inherit; }\n  .petal circle { fill: var(--petal); stroke: var(--line); stroke-width: 1.5; }\n  .petal.on circle { fill: var(--accent); stroke: var(--accent); }\n  .petal text { fill: var(--ink); font-size: 12px; font-weight: 700; text-anchor: middle; }\n  .petal.on text { fill: var(--on); }\n  #live { fill: var(--ink); font: 700 40px ui-monospace, \"SF Mono\", Consolas, monospace; text-anchor: middle; }\n  #liveL { fill: var(--muted); font-size: 13px; font-weight: 600; text-anchor: middle; }\n  .pre circle { fill: var(--petal); stroke: var(--accent); stroke-width: 2; pointer-events: all; cursor: pointer; }\n  .pre text { fill: var(--ink); font-size: 14px; font-weight: 700; text-anchor: middle; pointer-events: none; }\n  .pre.on circle { fill: var(--accent); } .pre.on text { fill: var(--on); }\n<\/style>\n<\/head>\n<body>\n<main id=\"app\">\n  <nav id=\"tabs\"><\/nav>\n  <section id=\"rows\" aria-live=\"polite\"><\/section>\n  <div id=\"choices\"><\/div>\n  <p class=\"hold\">hold anywhere to change a value<\/p>\n  <p id=\"plan\"><\/p>\n<\/main>\n<svg id=\"ov\" aria-hidden=\"true\"><\/svg>\n<script>\n/* Shared core: the original calculator maths and saved state, behind a small API.\n   Every concept below only draws a different interface on top of this. */\nconst Dough = (() => {\n  const STORAGE_KEY = \"dough-ratio-assistant:v1\";\n  const DEFAULTS = {\n    mode: \"sourdough\",\n    sourdough: { flour: 500, hydration: 70, starterPct: 5 },\n    instant: { flour: 500, hydration: 70 },\n    pizza: { balls: 8, hydration: 64, yeastType: \"instant\", proof: \"nextDay\", instantYeastPct: { sameDay: 0.5, nextDay: 0.11 } }\n  };\n  const PIZZA_BALL_WEIGHT = 300, PIZZA_SALT_PCT = 2, PIZZA_STARTER_PCT = { sameDay: 25, nextDay: 20 };\n  const clampNumber = (v, min, max, fb) => { const n = Number(v); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fb; };\n\n  /* ---- original calculations, unchanged ---- */\n  function calculateSourdough({ flour, hydration, starterPct }) {\n    const starter = flour * starterPct / 100, starterFlour = starter / 2, starterWater = starter / 2;\n    const totalFlour = flour + starterFlour;\n    const water = Math.max(0, totalFlour * hydration / 100 - starterWater);\n    const salt = totalFlour * 0.02;\n    return { totalDough: flour + <script>
(() => {
  const C = JSON.parse(document.getElementById("data").textContent);
  const $ = s => document.querySelector(s);
  const frame = $("#frame");
  let cur = 0;

  function list(into, onPick) {
    into.replaceChildren();
    let group = null;
    C.forEach((c, i) => {

  document.addEventListener("keydown", e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
